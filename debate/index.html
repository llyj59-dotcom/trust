<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생각 모으기 — 우리 반 토의·토론</title>
<meta name="description" content="내 생각을 주장·이유·근거로 세우고, 스스로 다듬고, 친구들과 나누고, 함께 결론을 짓는 초등 토의·토론 도우미">
<style>
:root{
  --bg:#f3f7f4; --card:#fff; --ink:#1f2a24; --sub:#5b6b62;
  --line:#dce5df; --soft:#eef4ef;
  --green:#2f7d5d; --green-d:#245f47; --green-l:#dff0e6;
  --blue:#2e6ea8; --blue-l:#e2eef9;
  --amber:#a8762e; --amber-l:#fbf0dd;
  --purple:#6b4a9c; --purple-l:#efe8f9;
  --r:16px; --sh:0 2px 10px rgba(31,42,36,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{line-height:1.35;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
textarea,input,select{font-family:inherit;font-size:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:14px 2px 10px;flex-wrap:wrap}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.top .tag{font-size:13px;color:var(--sub);font-weight:600}
.top .sp{flex:1}
.ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--sub)}
.ghost:hover{background:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{font-size:19px;font-weight:800;margin-bottom:6px}
.card .lead{color:var(--sub);font-size:15px;margin:0 0 14px}
.hint{color:var(--sub);font-size:14px;margin:6px 0 0}
.steps{display:flex;gap:6px;margin:4px 2px 16px}
.steps i{flex:1;height:6px;border-radius:999px;background:var(--line);transition:background .25s}
.steps i.on{background:var(--green)}
.steps i.done{background:var(--green-l)}
.stepname{font-size:13px;font-weight:700;color:var(--green);letter-spacing:.02em;margin:0 2px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;
  border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn:hover{background:var(--green-d)}
.btn:disabled{background:#c3d2c9;box-shadow:none;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.sec:hover{background:var(--green-l)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1}
.nav .btn.sec{flex:0 0 auto;min-width:92px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.topic{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;transition:.15s}
.topic:hover{border-color:var(--green);background:var(--green-l)}
.topic .ic{font-size:22px;display:block;margin-bottom:4px}
.topic .q{display:block;font-weight:700;font-size:15.5px;line-height:1.45}
.topic .c{font-size:12.5px;color:var(--sub);font-weight:600;margin-top:5px}
/* 가치 수직선 */
.vl{margin:16px 0 4px}
.vl-ends{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;color:var(--sub);margin-bottom:7px}
.vl-ends span{flex:1;line-height:1.35}
.vl-ends span:last-child{text-align:right}
.vl-line{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px}
.vl-line::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:3px;border-radius:2px;background:var(--line);transform:translateY(-8px)}
.vl-line button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;padding:9px 0;touch-action:manipulation}
.vl-line .dot{width:17px;height:17px;border-radius:50%;background:#fff;border:2.5px solid #c3d2c9;transition:.15s}
.vl-line button:hover .dot{border-color:var(--green);transform:scale(1.15)}
.vl-line .num{font-size:11px;font-weight:700;color:#aab6ae}
.vl-line button[aria-pressed=true] .dot{width:25px;height:25px;border-color:var(--green);background:var(--green);
  box-shadow:0 0 0 5px var(--green-l)}
.vl-line button[aria-pressed=true] .num{color:var(--green-d);font-size:12.5px}
.vl-now{text-align:center;font-weight:700;font-size:15.5px;color:var(--green-d);margin-top:12px;min-height:24px}
.vl-now.none{color:var(--sub);font-weight:600}
/* 교사용 분포 수직선 */
.vlmap{margin:10px 0 18px}
.vlmap .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.vlmap .lab span:last-child{text-align:right}
.vlmap .cols{display:flex;align-items:flex-end;gap:3px;border-bottom:3px solid var(--line);padding-bottom:2px;min-height:60px}
.vlmap .col{flex:1;display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.vlmap .pip{width:13px;height:13px;border-radius:50%}
.vlmap .pip.a{background:#b9ccc0}
.vlmap .pip.b{background:var(--green)}
.vlmap .nums{display:flex;gap:3px;margin-top:3px}
.vlmap .nums span{flex:1;text-align:center;font-size:11px;color:#aab6ae;font-weight:700}
.vlkey{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-top:6px}
.vlkey i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:4px}
label.f{display:block;font-weight:700;font-size:15.5px;margin:16px 0 5px}
label.f .n{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;
  background:var(--green);color:#fff;font-size:12.5px;margin-right:7px;vertical-align:1px}
.fh{font-size:13.5px;color:var(--sub);margin:-2px 0 7px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;resize:vertical;line-height:1.6}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--green)}
textarea{min-height:76px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--sub);text-align:left}
.chip:hover{border-color:var(--green);color:var(--green-d)}
.chip[aria-pressed=true]{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.think{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.think summary{padding:11px 14px;font-weight:700;font-size:15px;cursor:pointer;background:var(--soft);list-style:none}
.think summary::-webkit-details-marker{display:none}
.think .in{padding:4px 14px 12px}
.tline{display:flex;gap:9px;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.tline:first-child{border-top:0}
.tline .s{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;height:fit-content;margin-top:2px}
.tline .s.y{background:var(--blue-l);color:var(--blue)}
.tline .s.n{background:var(--amber-l);color:var(--amber)}
.tline .s.q{background:var(--green-l);color:var(--green-d)}
.chk{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;gap:11px}
.chk .m{flex:0 0 auto;font-size:19px;line-height:1.3}
.chk .b{flex:1}
.chk .t{font-weight:700;font-size:15px}
.chk .d{font-size:14px;color:var(--sub);margin-top:2px}
.chk.ok{border-color:#bcdcc9;background:#f3faf5}
.chk.no{border-color:#e8cfa9;background:var(--amber-l)}
.chk.no .t{color:var(--amber)}
.score{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:4px}
.score .big{font-size:26px;font-weight:800;color:var(--green-d)}
.score .tx{font-size:14.5px;color:var(--sub);font-weight:600}
.speech{border:2px solid var(--green);border-radius:14px;padding:16px;background:#fbfdfb}
.speech .ln{margin:0 0 10px;font-size:16.5px;line-height:1.7}
.speech .ln:last-child{margin-bottom:0}
.speech b{color:var(--green-d)}
.speech .k{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--green);border-radius:999px;padding:1px 9px;margin-right:7px;vertical-align:2px}
.out{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
.note{background:var(--blue-l);border-radius:12px;padding:12px 14px;font-size:14.5px;color:#23527c;margin:12px 0}
.warn{background:var(--amber-l);border-radius:12px;padding:12px 14px;font-size:14.5px;color:#7d5a21;margin:12px 0}
.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:700;color:var(--sub)}
.tab[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;font-size:13.5px}
.bar{height:22px;border-radius:6px;background:var(--green);min-width:3px}
.mini{font-size:13px;color:var(--sub)}
ul.std{margin:4px 0 0 18px;padding:0;font-size:14.5px;line-height:1.6}
ul.std li{margin:3px 0}
code{font-family:inherit;background:var(--green-l);padding:1px 5px;border-radius:5px;font-size:12.5px}
.gchip{padding:5px 10px;font-size:13px}
.gchip[aria-pressed=true]{background:var(--green);color:#fff}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grades{min-width:640px}
.grades td{vertical-align:middle}
.grades input.gnote{font-size:13.5px;padding:7px 9px;border-radius:8px;min-width:220px}
@media print{.grades input.gnote{border:0;padding:0;min-width:0}}
.movecard{border:1.5px solid var(--purple);background:var(--purple-l);border-radius:12px;padding:12px 14px;margin:10px 0}
.movecard .t{font-weight:800;color:var(--purple);font-size:15px}
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.job{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;text-align:left;font-size:14px;line-height:1.4}
.job .nm{display:block;font-weight:700}
.job .ds{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.job[data-pick="1"]{border-color:#c98f8f;background:#fcefee}
.job[data-pick="2"]{border-color:#c9a85f;background:var(--amber-l)}
.job[data-pick="3"]{border-color:#7fae8e;background:var(--green-l)}
.jobgrid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.jobkey{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:4px}
.jobkey span{display:inline-flex;align-items:center;gap:5px}
.jobkey i{width:13px;height:13px;border-radius:4px;display:inline-block}
.printonly{display:none}
pre.plain{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.7;margin:0}
@media print{body{background:#fff}.noprint{display:none!important}.printonly{display:block}.card{box-shadow:none;break-inside:avoid}
  .card.hasprint textarea{display:none}}
@media (max-width:520px){
  body{font-size:16px}
  .vl-line .dot{width:19px;height:19px}
  .vl-line button[aria-pressed=true] .dot{width:26px;height:26px;box-shadow:0 0 0 4px var(--green-l)}
  .vl-ends{font-size:12.5px}
  .vl-now{font-size:15px}
  .topics{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top noprint">
    <h1 id="appName">🌱 생각 모으기</h1>
    <span class="tag">우리 반 토의·토론</span>
    <span class="sp"></span>
    <button class="ghost" id="btnMode">선생님용</button>
  </div>
  <main id="app"></main>
</div>
<script>
(function(){
'use strict';

/* 앱 이름은 여기 한 곳만 바꾸면 제목·머리글·결과 글에 모두 반영됩니다. */
var APP_NAME = '생각 모으기';
document.title = APP_NAME + ' — 우리 반 토의·토론';
document.getElementById('appName').textContent = '🌱 ' + APP_NAME;

/* ===================== 주제 ===================== */
var TOPICS = [
 {id:'aijob', band:'56', std:['6국01-07','6실05-05','6실01-07'], ic:'🤖', cat:'AI와 미래', jobs:true,
  q:'AI가 발달하면 사람의 일자리는 사라질까?',

  think:[
   ['y','은행 창구나 전화 상담처럼 정해진 순서대로 하는 일은 이미 줄고 있어요.'],
   ['n','AI가 공정하게 판단하는지 검사하는 사람처럼, 전에 없던 일도 새로 생기고 있어요.'],
   ['y','일자리가 줄어들면 그 사람들의 생활은 누가 어떻게 도와야 할까요?'],
   ['n','예전에도 기계가 들어왔지만 일이 아주 없어지기보다 모습이 바뀌었어요.'],

   ['n','사람을 마주 보고 마음을 살피는 일은 AI가 대신하기 어려워요.']],
  stems:['AI 때문에 많은 일자리가 사라질 것이다',
         'AI가 발달해도 일자리는 크게 줄지 않는다',
         '사라지는 일도 있지만 새로 생기는 일이 더 많을 것이다',
         '일자리가 사라지기보다 하는 일이 바뀌는 쪽이 더 클 것이다']},

 {id:'robottax', band:'56', std:['6국01-07','6사11-02'], ic:'🏛️', cat:'AI와 미래',
  q:'AI 로봇에게 세금(로봇세)을 걷어야 할까?',
  sub:'사람 대신 일하는 로봇에게 세금을 매기자는 이야기가 있어요.',
  think:[

   ['n','세금을 걷으면 회사가 로봇을 덜 만들어서 기술이 늦어질 수 있어요.'],

   ['y','우리나라만 걷지 않으면 다른 나라와 달라져서 혼란스러울 수 있어요.']],
  stems:['로봇에게도 세금을 걷어야 한다',
         '로봇세는 걷지 않는 것이 좋다',
         '조건을 정해서 일부만 걷어야 한다',
         '지금은 이르고 더 지켜본 뒤에 정해야 한다']},

 {id:'facegate', band:'56', std:['6국01-07','6사03-02'], ic:'🚪', cat:'AI와 생활',

   ['n','얼굴은 비밀번호와 달라서 새어 나가도 바꿀 수가 없어요.'],

   ['n','찍힌 얼굴을 얼마나 오래 두는지, 누가 볼 수 있는지 정해져 있나요?']],
  stems:['얼굴 인식 출입문을 달아도 된다',

 {id:'aihomework', band:'all', std:['4국01-06','4도03-02','6국01-07','6국06-04'], ic:'📝', cat:'AI와 생활',

  stems:['숙제에 AI를 써도 된다',
         '숙제에는 AI를 쓰지 않아야 한다',
         '어떻게 썼는지 밝히면 써도 된다',
         '찾아보는 것만 되고 대신 쓰게 하면 안 된다']},

 {id:'phone', band:'all', std:['4국01-06','4사08-01','6국01-07','6국06-04'], ic:'📱', cat:'학교생활',
  q:'학교에 휴대폰을 가져와도 될까?',
  sub:'우리 반의 규칙을 우리가 정해 본다면요?',
  think:[
   ['y','급한 일이 생겼을 때 집에 바로 연락할 수 있어요.'],
   ['n','쉬는 시간에 다 같이 노는 대신 각자 휴대폰만 보게 돼요.'],
   ['y','수업에서 찾아보기 도구로 쓸 수 있어요.'],
   ['n','잃어버리거나 망가졌을 때 누가 책임질지 정하기 어려워요.'],
   ['n','몰래 찍은 사진 때문에 다툼이 생길 수 있어요.']],

function posLabel(v, t){

}

var VAGUE = ['것 같','아마','그냥','들은 것','대충','뭔가','어디서'];
function checks(){
  var r = [], t = topic(), lo = (S.band==='34');
  var claim = (S.claim||'').trim(), reason=(S.reason||'').trim(), ev=(S.ev||'').trim(), who=(S.who||'').trim();
  var N_R = lo?10:15, N_E = lo?6:10, N_W = lo?4:6, N_O = lo?4:6;

  r.push({ ok: claim.length >= 5,
    t:'주장이 한 문장으로 또렷한가요?',
    d: claim.length>=5 ? '좋아요. 무엇을 주장하는지 한 번에 읽혀요.'
                       : '"나는 ~라고 생각한다" 한 문장으로 적어 보세요.' });

  var sameWord = reason.length>0 && claim.length>0 &&
    reason.replace(/\s/g,'').indexOf(claim.replace(/\s/g,'').slice(0,8))>=0 && reason.length < claim.length+10;
  r.push({ ok: reason.length >= N_R && !sameWord,
    t:'이유가 주장을 다시 말한 것은 아닌가요?',
    d: reason.length<N_R ? '왜 그렇게 생각했는지 한 걸음 더 적어 보세요.'
      : sameWord ? '주장과 거의 같은 말이에요. "왜냐하면"으로 이어서 다시 써 볼까요?'
      : '좋아요. 주장과 다른 말로 까닭을 설명했어요.' });

  var vague = false;
  for(var i=0;i<VAGUE.length;i++) if(ev.indexOf(VAGUE[i])>=0) vague=true;
  r.push({ ok: ev.length >= N_E && !vague && S.evType>=0,
    t:'근거를 어디서 알게 되었는지 밝혔나요?',
    d: ev.length<N_E ? '내 생각 말고, 확인할 수 있는 사실을 하나 적어 보세요.'
      : S.evType<0 ? '아래에서 근거의 종류를 하나 골라 주세요.'
      : vague ? '"~것 같다", "어디서 들었다" 같은 말이 있어요. 어디서 보았는지 적을 수 있나요?'
      : '좋아요. 친구가 "어디서 봤어?"라고 물어도 답할 수 있어요.' });

  r.push({ ok: who.length >= N_W,
    t:'누구에게 어떤 영향이 가는지 생각했나요?',
    d: who.length>=N_W ? '좋아요. 사람을 떠올린 주장은 힘이 세요.'
                     : '누가 좋아지고 누가 힘들어질지 한 줄 적어 보세요.' });

  r.push({ ok: (S.other||'').trim().length >= N_O && (S.still||'').trim().length >= N_O,
    t:'반대편에서 가장 그럴듯한 말을 찾았나요?',
    d: ((S.other||'').trim().length>=N_O && (S.still||'').trim().length>=N_O)
      ? '반대 의견을 읽고도 내 생각을 설명할 수 있어요. 아주 좋아요.'
      : '다음 단계에서 적게 됩니다. 아직 비어 있어요.' });

  var CD = cardsOf(t);
  if(CD){
    var n=0; for(var k in S.jobs) if(S.jobs[k]) n++;
    var need = Math.min(CD.min||6, CD.list.length);
    r.push({ ok: n>=need, t:CD.verb+'를 충분히 나누어 보았나요?',
      d: n>=need ? (n+'개를 나누었어요. 이 가운데 하나를 근거로 쓰면 더 좋아요.')
              : need+'개를 나누어 보면 내 생각이 또렷해져요. (지금 '+n+'개)' });
  }
  return r;
}

      h += '<div class="movecard"><span class="t">'

function resultText(){
  var t = topic(), L = [], n = okCount();
  L.push('━━━ ' + APP_NAME + ' ━━━');
  L.push('이름/코드: ' + (S.name||'(안 적음)'));
  L.push('주제: ' + (t?t.q:''));
  L.push('');
  if(!(t && t.noLine)){
    L.push('[가치 수직선 — 양 끝] ◀ ' + (t?t.ends[0]:'') + '  /  ' + (t?t.ends[1]:'') + ' ▶');
    L.push('[처음 내 자리] ' + (S.first!==null ? S.first + '번 (' + posLabel(S.first,t) + ')' : '-'));
    L.push('');
  }
  L.push('[주장] ' + (S.claim||''));
  L.push('[이유] ' + (S.reason||''));
  L.push('[근거] ' + (S.ev||'') + (S.evType>=0 ? ' (' + EVTYPE[S.evType][0] + ')' : ''));
  L.push('[영향] ' + (S.who||''));
  L.push('');
  L.push('[반대편에서 가장 일리 있던 말] ' + (S.other||''));
  L.push('[그래도 내 생각인 까닭] ' + (S.still||''));
  L.push('');
  L.push('[스스로 점검] ' + n[0] + '/' + n[1]);
  var CD = cardsOf(t), cardCode = '';
  if(CD){
    var g=[[],[],[]];
    for(var k in S.jobs){
      var v=S.jobs[k]; if(!v || !CD.list[k]) continue;
      g[v-1].push(CD.list[k][0]);
    }
    for(var q=0;q<3;q++) L.push('['+(t.noLine?'처음 ':'')+CD.lbl+' — '+CD.keys[q]+'] ' + (g[q].join(', ')||'-'));
    cardCode = cardCode0(CD, S.jobs);
  }
  var after = (t && t.noLine && countPicks(S.jobs2)) ? cardCode0(CD, S.jobs2) : '';
  if(S.moved || S.last!==null || S.why || after){
    L.push('');
    L.push('[나를 움직인 말] ' + (S.moved||''));
    if(t && t.noLine){
      var g2=[[],[],[]], chg=[];
      for(var k2=0;k2<CD.list.length;k2++){
        var v2=S.jobs2[k2]||0, v1=S.jobs[k2]||0;
        if(v2) g2[v2-1].push(CD.list[k2][0]);
        if(v1!==v2) chg.push(CD.list[k2][0]+' ('+(v1?CD.keys[v1-1]:'안 고름')+' → '+(v2?CD.keys[v2-1]:'안 고름')+')');
      }
      for(var q2=0;q2<3;q2++) L.push('[토의 뒤 '+CD.lbl+' — '+CD.keys[q2]+'] ' + (g2[q2].join(', ')||'-'));
      L.push('[바꾼 카드] ' + (chg.length ? chg.length+'장 — '+chg.join(', ') : '없음'));
    } else {
      L.push('[나중 내 자리] ' + (S.last!==null ? S.last + '번 (' + posLabel(S.last,t) + ')' : '-'));
      if(S.first!==null && S.last!==null)
        L.push('[움직임] ' + (S.first===S.last ? '그대로' : (S.last-S.first>0?'+':'') + (S.last-S.first) + '칸'));
    }
    L.push('[그 까닭] ' + (S.why||''));
  }
  L.push('');
  function cell(x){ return String(x==null?'':x).replace(/[|@\r\n]/g,' ').trim(); }
  L.push('@@' + [ cell(S.name), (t?t.id:''),
    (S.first===null?'':S.first), (S.last===null?'':S.last),
    (S.evType<0?'':EVTYPE[S.evType][0]), n[0]+'/'+n[1],
    cell(t?t.ends[0]:''), cell(t?t.ends[1]:''), cell(t&&t.id==='custom'?t.q:''), cardCode ].concat(after ? [after] : []).join('|') + '@@');
  return L.join('\n');
}
function sendOut(){
  if(!S.send) return;
  if(!(S.name||'').trim()){
    var nm = prompt('이름이나 참여 코드를 적지 않았어요. 선생님이 누구 글인지 알 수 있게 적어 주세요.', '');
    if(nm===null) return;
    S.name = nm.trim(); save();
  }
  var tx = resultText(), body = JSON.stringify({text:tx});

/* ===================== 선생님 화면 ===================== */
var T = { tab:'guide', paste:'', a1:'', a2:'', a3:'', a4:'', topicPick:'', grades:{}, notes:{}, band:'56', sheet:'' };
function num(x){ x=String(x==null?'':x).trim(); if(x==='') return null; var v=+x; return (v>=0 && v<=10 && v===Math.floor(v)) ? v : null; }
function parsePastes(){
  var rows = [], seen = {}, blocks = (T.paste||'').split(/@@/);
  for(var i=1;i<blocks.length;i+=2){
    var p = blocks[i].split('|');
    if(p.length<6) continue;
    var row = { name:(p[0]||'').trim()||'(이름없음)', topic:(p[1]||'').trim(), first:num(p[2]),
      last:num(p[3]), evt:(p[4]||'').trim()||'-', score:(p[5]||'').trim(),
      endL:(p[6]||'').trim(), endR:(p[7]||'').trim(), q:(p[8]||'').trim(),
      cards:/^[0-3]+$/.test((p[9]||'').trim()) ? (p[9]||'').trim() : '',
      cards2:/^[0-3]+$/.test((p[10]||'').trim()) ? (p[10]||'').trim() : '', dup:false,
      text:readFields(blocks[i-1]||'') };
    /* 같은 이름이 같은 주제로 두 번 들어오면(토론 전·후 두 번 복사) 뒤의 것을 씁니다. */
    var key = row.name==='(이름없음)' ? null : row.name+'\u0001'+row.topic;
    if(key && seen[key]!==undefined){ rows[seen[key]] = row; row.dup=true; continue; }
    if(key) seen[key]=rows.length;
    rows.push(row);
  }
  return rows;
}
/* 결과 글의 "[주장] ..." 같은 줄을 읽어 옵니다. 같은 이름표가 여러 번이면 마지막 것을 씁니다. */
var FIELDS = { claim:'주장', reason:'이유', ev:'근거', who:'영향', other:'반대편에서 가장 일리 있던 말',
  still:'그래도 내 생각인 까닭', moved:'나를 움직인 말', why:'그 까닭' };
function readFields(txt){
  var out = { found:false };
  for(var k in FIELDS){
    var re = new RegExp('^\\['+FIELDS[k]+'\\] ?(.*)$','mg'), m, v='';
    while((m=re.exec(txt))){ v=m[1]; out.found=true; }
    if(k==='ev') v = v.replace(/\s*\((자료|경험|숫자|사례|들은 말)\)\s*$/,'');
    out[k] = v.trim();
  }
  return out;
}
/* 상·중·하 제안. 글에서 읽은 것만 봅니다. 설득력 자체는 선생님이 보셔야 해요. */
function evaluate(r){
  var B = bandOf(), x = r.text, c = [], i;
  var L = function(k){ return x && x[k] ? x[k].length : 0; };
  if(x && x.found){
    for(i=0;i<B.crit.length;i++) c.push({ k:B.crit[i].k, v:B.crit[i].f(L, r) });
  } else {
    var sc = /^(\d+)\/(\d+)$/.exec(r.score||''), ratio = sc ? (+sc[1])/(+sc[2]||1) : 0;
    c.push({ k:B.crit[0].k, v: ratio>=0.8 ? 2 : ratio>=0.5 ? 1 : 0 });
    c.push({ k:B.crit[1].k, v: T.band==='34' ? (r.evt!=='-' ? 2 : 0) : (STRONG_EV[r.evt] ? 2 : r.evt!=='-' ? 1 : 0) });
    c.push({ k:B.crit[2].k, v: ratio>=0.8 ? 1 : 0 });
    c.push({ k:B.crit[3].k, v: hasAfter(r) ? 1 : 0 });
  }
  var sum = 0; for(var i=0;i<c.length;i++) sum += c[i].v;
  var grade = sum>=7 ? '상' : sum>=4 ? '중' : '하';
  return { c:c, sum:sum, grade:grade, partial: !(x && x.found) };
}
function gradeKey(r){ return r.name+'\u0001'+r.topic; }
function gradeOf(r){ return T.grades[gradeKey(r)] || evaluate(r).grade; }
function noteOf(r){
  var k = gradeKey(r);
  if(T.notes[k]!==undefined && T.notes[k]!=='') return T.notes[k];
  return autoNote(r);
}
function autoNote(r){
  var e = evaluate(r), c = e.c, B = bandOf(), s = [], i;
  if(e.partial) return '글 없이 코드만 있어서 스스로 점검 '+(r.score||'-')+'과 근거 종류('+r.evt+')만 보았어요. 글을 보고 다시 적어 주세요.';
  for(i=0;i<3;i++){
    var n = B.crit[i].n, v = c[i].v;
    var txt = (typeof n==='function') ? n(v, r) : n[2-v];
    s.push(txt.replace('{evt}', r.evt==='-' ? '겪은 일' : r.evt));
  }
  if(r.cards2){
    var nch = cardsChanged(r.cards||'', r.cards2);
    s.push((nch ? '토의 뒤 카드 '+nch+'장을 바꾸며' : '토의 뒤에도 처음 생각을 지켰고')+(c[3].v===2?' 그 까닭을 적었어요':' 까닭은 적지 않았어요'));
  } else if(r.first!==null && r.last!==null){
    if(r.first!==r.last) s.push('토론 뒤 자리를 '+r.first+'에서 '+r.last+'로 옮기며'+(c[3].v===2?' 까닭을 적었어요':' 까닭은 적지 않았어요'));
    else s.push('자리를 지켰고'+(c[3].v===2?' 그 까닭을 적었어요':' 까닭은 적지 않았어요'));
  } else s.push(r.cards ? '토의 뒤 카드는 아직 없어요' : '토론 뒤 자리는 아직 없어요');
  return s.join('. ') + '.';
}
function gradesText(rows){
  var B = bandOf(), hd = ['이름/코드','평가'];
  for(var bi=0;bi<B.crit.length;bi++) hd.push(B.crit[bi].k);
  hd.push('처음→나중','한 줄 평');
  var L = [hd.join('\t')];
  for(var i=0;i<rows.length;i++){
    var r = rows[i], e = evaluate(r);
    L.push([r.name, gradeOf(r), e.c[0].v, e.c[1].v, e.c[2].v, e.c[3].v,
      r.cards2 ? ('카드 '+cardsChanged(r.cards||'',r.cards2)+'장 바꿈') : (r.first===null?'-':r.first)+'→'+(r.last===null?'-':r.last),
      noteOf(r).replace(/\t/g,' ')].join('\t'));
  }
  return L.join('\n');
}
function gradeRows(){

function render(){
  if(S.mode!=='teacher' && S.step>0 && !topic()){ S.step=0; S.topic=null; }
  var key = S.mode+'/'+(S.mode==='teacher'?T.tab:S.step), y = window.pageYOffset||0;
  app(S.mode==='teacher' ? viewTeacher() : viewStudent());
  $('btnMode').textContent = S.mode==='teacher' ? '학생용' : '선생님용';
  window.scrollTo(0, key===render.lastKey ? y : 0);
  render.lastKey = key;
}
function grab(){
  var ids = ['claim','reason','ev','who','other','still','moved','why','nm','cq','cl','cr','paste','a1','a2','a3','a4','sheet'];
  for(var i=0;i<ids.length;i++){
    var el = $(ids[i]); if(!el) continue;
    var v = el.value;
    if(ids[i]==='nm') S.name=v;
    else if(ids[i]==='cq') S.custom=v;
    else if(ids[i]==='cl') S.customL=v;
    else if(ids[i]==='cr') S.customR=v;
    else if(ids[i]==='paste') T.paste=v;
    else if(ids[i]==='sheet') T.sheet=v;
    else if(ids[i].charAt(0)==='a' && ids[i].length===2) T[ids[i]]=v;
    else S[ids[i]]=v;
  }
  var notes = document.querySelectorAll('input[data-gnote]');
  /* 앱이 제안한 문구 그대로면 저장하지 않아요. 그래야 학년군을 바꿀 때 한 줄 평도 따라 바뀝니다. */
  for(var j=0;j<notes.length;j++){
    var nk = notes[j].getAttribute('data-gnote');
    if(notes[j].value === notes[j].getAttribute('data-auto')) delete T.notes[nk];
    else T.notes[nk] = notes[j].value;
  }
  save();
}
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-go],[data-topic],[data-first],[data-last],[data-stem],[data-evt],[data-job],[data-tab],[data-tpick],[data-grade],[data-band],[data-job2]') : null;
  if(!el) return;
  var d = el.dataset;

  if(d.band){ grab(); if(S.mode==='teacher') T.band=d.band; else S.band=d.band; save(); render(); return; }

  if(d.tab){ grab(); T.tab=d.tab; render(); return; }
  if(d.tpick!==undefined){ grab(); T.topicPick=d.tpick; save(); render(); return; }
  if(d.grade!==undefined){ grab(); T.grades[d.gkey]=d.grade; save(); render(); return; }

  if(d.topic){
    grab();
    var prevTopic = S.topic;
    if(d.topic==='custom'){
      if(!(S.custom||'').trim()){ alert('주제를 적어 주세요.'); return; }
      S.topic='custom';
    } else S.topic=d.topic;
    if(prevTopic!==S.topic){ S.jobs={}; S.jobs2={}; }
    S.step=1; save(); render(); return;
  }
  if(d.first!==undefined){ S.first=+d.first; save(); render(); return; }
  if(d.last!==undefined){ grab(); S.last=+d.last; save(); render(); return; }
  if(d.stem!==undefined){
    grab(); var t=topic();
    S.claimPick = (S.claimPick===+d.stem) ? -1 : +d.stem;
    if(S.claimPick>=0) S.claim = t.stems[S.claimPick];
    save(); render(); return;
  }
  if(d.evt!==undefined){ grab(); S.evType = (S.evType===+d.evt)?-1:+d.evt; save(); render(); return; }
  if(d.job2!==undefined){ grab(); var j2=+d.job2; S.jobs2[j2] = ((S.jobs2[j2]||0)+1) % 4; save(); render(); return; }
  if(d.job!==undefined){ grab(); var j=+d.job; S.jobs[j] = ((S.jobs[j]||0)+1) % 4; save(); render(); return; }

  switch(d.go){
    case 'next': grab(); if(!canGoNext()){ refreshNext(); break; }
      if(S.step<6){ S.step++;
        var tn = topic();
        if(S.step===6 && tn && tn.noLine && !countPicks(S.jobs2)){ S.jobs2={}; for(var kj in S.jobs) S.jobs2[kj]=S.jobs[kj]; }
        save(); render(); }
      break;
    case 'back': grab(); if(S.step>0){ S.step--; save(); render(); } break;
    case 'fix':  grab(); S.step=2; save(); render(); break;
    case 'copy': grab(); copyOut(); break;
    case 'send': grab(); sendOut(); break;
    case 'loadsheet': grab(); loadSheet(false); break;
    case 'testsheet': grab(); loadSheet(true); break;
    case 'print': grab(); window.print(); break;
    case 'agg': grab(); render(); break;
    case 'copylesson':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('이 수업 학생용 주소를 복사했어요.\n'+tx);},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(location.href.split('?')[0].split('#')[0] + '?band=56&topic=upload3' + (sheetUrl() ? '&send=' + encodeURIComponent(sheetUrl()) : ''));
      break;
    case 'copylink':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('학생용 주소를 복사했어요. 아이들에게 이 주소를 주면 돼요.\n'+tx);},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(location.href.split('?')[0].split('#')[0] + '?band=' + T.band + (sheetUrl() ? '&send=' + encodeURIComponent(sheetUrl()) : ''));
      break;
    case 'copygrades':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('평가표를 복사했어요. 시트나 문서에 붙여 넣으세요.');},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(gradesText(gradeRows()));
      break;
    case 'resetgrades':
      grab();
      if(!confirm('고친 평가와 한 줄 평을 지우고 앱 제안으로 되돌릴까요?')) break;
      T.grades={}; T.notes={}; save(); render(); break;
    case 'clearpaste':
      grab();
      if(!confirm('붙여 넣은 학생 결과를 모두 지울까요? 합의문은 그대로 남아요.')) break;
      T.paste=''; save(); render(); break;
    case 'copyagree':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('합의문을 복사했어요.');},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(agreeText());
      break;
    case 'reset':
      if(!confirm('지금 쓴 내용을 지우고 새 주제로 시작할까요?')) break;
      var nm = S.name;
      S = { mode:S.mode, step:0, topic:null, custom:'', name:nm, first:null, claim:'', claimPick:-1,
            reason:'', ev:'', evType:-1, who:'', jobs:{}, other:'', still:'', moved:'', last:null, why:'', checked:false,
            customL:'', customR:'', band:S.band, send:S.send, lastSent:'', jobs2:{} };
      save(); render(); break;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && (e.target.id==='cq' || e.target.id==='cl' || e.target.id==='cr')){
    e.preventDefault(); var b=document.querySelector('[data-topic="custom"]'); if(b) b.click();
  }
});
document.addEventListener('input', function(e){
  if(e.target && (e.target.tagName==='TEXTAREA' || e.target.tagName==='INPUT')){
    clearTimeout(window.__t);
    window.__t = setTimeout(function(){ grab(); refreshNext(); }, 250);
  }
});
$('btnMode').addEventListener('click', function(){
  grab(); S.mode = (S.mode==='teacher') ? 'student' : 'teacher'; save(); render();
});

load();
if(location.search.indexOf('teacher')>=0) S.mode='teacher';
var _qb = /[?&]band=(34|56)/.exec(location.search);
if(_qb){ S.band=_qb[1]; T.band=_qb[1]; save(); }
var _qt = /[?&]topic=([a-z0-9]+)/.exec(location.search);
if(_qt && location.search.indexOf('teacher')<0){
  var _tt = null; for(var _j=0;_j<TOPICS.length;_j++) if(TOPICS[_j].id===_qt[1]) _tt=TOPICS[_j];
  /* 이미 그 주제로 쓰던 아이는 그대로 두고, 처음 들어오는 아이만 그 주제로 엽니다. */
  if(_tt && S.topic!==_tt.id){ S.topic=_tt.id; S.step=1; S.jobs={}; S.jobs2={}; if(_tt.band!=='all') S.band=_tt.band; save(); }
}
var _qs = /[?&]send=([^&#]+)/.exec(location.search);
if(_qs){
  var _u = _qs[1]; try{ _u = decodeURIComponent(_u); }catch(e){}
  if(/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\//.test(_u)){
    S.send=_u;
    /* 선생님 화면 주소(?teacher&send=…)로 열면 시트 주소 칸도 채워 둡니다. 이미 넣은 주소는 덮지 않아요. */
    if(location.search.indexOf('teacher')>=0 && !(T.sheet||'').trim()) T.sheet=_u;
    save();
  }
}
render();
})();
</script>
</body>
