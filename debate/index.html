<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생각 모으기 — 우리 반 토의·토론</title>
<meta name="description" content="내 생각을 주장·이유·근거로 세우고, 스스로 다듬고, 친구들과 나누고, 함께 결론을 짓는 초등 토의·토론 도우미">
<style>
:root{
  /* 면과 글자 */
  --bg:#f2f4f6; --card:#fff; --fill:#f6f7f9; --fill-2:#eef0f3;
  --ink:#191f28; --sub:#4e5968; --mute:#8b95a1; --line:#e5e8eb; --soft:#f6f7f9;
  /* 강조색은 초록 하나 */
  --green:#0b8a5c; --green-d:#077049; --green-l:#e6f5ee;
  /* 상태를 알리는 옅은 면 */
  --blue:#2272eb; --blue-l:#ebf3fe;
  --amber:#b45f06; --amber-l:#fff4e3;
  --purple:#6248e5; --purple-l:#f1eefe;
  --red-l:#fff0f0;
  --r:24px; --r-sm:14px;
  --sh:0 1px 2px rgba(25,31,40,.04);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
h1,h2,h3{line-height:1.35;margin:0;letter-spacing:-.03em}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;letter-spacing:inherit}
textarea,input,select{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
b,strong{font-weight:700}

/* 머리 — 반투명 유리 막대 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  margin:0 -20px 8px;padding:12px 20px;
  background:rgba(242,244,246,.86);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  box-shadow:0 0 0 100vmax rgba(242,244,246,.86);clip-path:inset(0 -100vmax)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.logo svg{width:17px;height:17px;display:block}
.top h1{font-size:18px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.top .tag{font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap}
.top .sp{flex:1}
.ghost{background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--sub);
  box-shadow:0 0 0 1px var(--line) inset;transition:background .15s}
.ghost:hover{background:var(--fill)}

/* 카드 */
.card{background:var(--card);border-radius:var(--r);padding:28px;box-shadow:var(--sh);margin-bottom:12px}
.card h2{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-.035em}
.card .lead{color:var(--sub);font-size:15.5px;margin:0 0 18px;line-height:1.6}
.card h3{letter-spacing:-.03em}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0;line-height:1.55}
.mini{font-size:13px;color:var(--mute);line-height:1.55}

/* 단계 */
.stepname{font-size:13px;font-weight:600;color:var(--green);margin:6px 2px 8px;letter-spacing:-.01em}
.steps{display:flex;gap:4px;margin:0 2px 16px}
.steps i{flex:1;height:4px;border-radius:999px;background:#dde1e6;transition:background .3s var(--ease)}
.steps i.on{background:var(--green)}
.steps i.done{background:#8fd0b3}

/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;
  background:var(--green);color:#fff;border-radius:16px;font-weight:600;font-size:16.5px;letter-spacing:-.02em;
  transition:background .15s,transform .1s var(--ease)}
.btn:hover{background:var(--green-d)}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--fill-2);color:#b0b8c1;cursor:not-allowed;transform:none}
.btn.sec{background:var(--fill-2);color:var(--ink)}
.btn.sec:hover{background:#e3e6ea}
.btn.sm{min-height:40px;padding:0 14px;font-size:14.5px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.nav{display:flex;gap:8px;margin:24px -4px 0;padding:12px 4px 4px;position:sticky;bottom:0;z-index:5;
  background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 22%)}
.nav .btn{flex:1}
.nav .btn.sec{flex:0 0 auto;min-width:96px}
/* 마지막 단계의 [새 주제로 다시 하기]는 화면 아래에 붙이지 않아요(잘못 누르기 쉬워서). */
.nav.static{position:static;background:none}

/* 주제 고르기 */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.topic{text-align:left;background:var(--fill);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px;
  transition:background .15s,transform .1s var(--ease)}
.topic:hover{background:var(--fill-2)}
.topic:active{transform:scale(.985)}
.topic .ic{font-size:22px;width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(25,31,40,.05)}
.topic .q{display:block;font-weight:600;font-size:15.5px;line-height:1.45;letter-spacing:-.025em}
.topic .c{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:6px}

/* 가치 수직선 */
.vl{margin:22px 0 6px}
.vl-ends{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:600;color:var(--sub);margin-bottom:6px}
.vl-ends span{flex:1;line-height:1.4}
.vl-ends span:last-child{text-align:right}
.vl-line{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 0 2px}
.vl-line::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:4px;border-radius:2px;background:var(--fill-2);transform:translateY(-9px)}
.vl-line button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;padding:8px 0;touch-action:manipulation}
.vl-line .dot{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #cfd5db inset;transition:all .18s var(--ease)}
.vl-line button:hover .dot{box-shadow:0 0 0 2px var(--green) inset;transform:scale(1.12)}
.vl-line .num{font-size:11px;font-weight:600;color:#b0b8c1;font-variant-numeric:tabular-nums}
.vl-line button[aria-pressed=true] .dot{width:28px;height:28px;background:var(--green);box-shadow:0 0 0 6px var(--green-l),0 4px 10px rgba(11,138,92,.25)}
.vl-line button[aria-pressed=true] .num{color:var(--green);font-weight:700;font-size:12.5px}
.vl-now{display:table;margin:16px auto 0;padding:8px 16px;border-radius:999px;background:var(--green-l);
  font-weight:600;font-size:15px;color:var(--green-d);text-align:center}
.vl-now.none{background:var(--fill);color:var(--mute);font-weight:500}

/* 교사용 분포 */
.vlmap{margin:10px 0 20px}
.vlmap .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.vlmap .lab span:last-child{text-align:right}
.vlmap .cols{display:flex;align-items:flex-end;gap:4px;border-bottom:2px solid var(--line);padding-bottom:4px;min-height:64px}
.vlmap .col{flex:1;display:flex;flex-direction:column-reverse;align-items:center;gap:3px}
.vlmap .pip{width:13px;height:13px;border-radius:50%}
.vlmap .pip.a{background:#c8d0d8}
.vlmap .pip.b{background:var(--green)}
.vlmap .nums{display:flex;gap:4px;margin-top:4px}
.vlmap .nums span{flex:1;text-align:center;font-size:11px;color:var(--mute);font-weight:600}
.vlkey{display:flex;gap:16px;font-size:13px;color:var(--sub);margin-top:6px}
.vlkey i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}

/* 입력 */
label.f{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin:26px 0 6px;letter-spacing:-.03em}
label.f .n{flex:0 0 auto;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;
  background:var(--green-l);color:var(--green);font-size:12.5px;font-weight:700}
.fh{font-size:14px;color:var(--mute);margin:0 0 10px;line-height:1.55}
textarea,input[type=text]{width:100%;border:0;border-radius:var(--r-sm);padding:14px 16px;background:var(--fill);resize:none;line-height:1.6;
  box-shadow:0 0 0 1px transparent inset;transition:background .15s,box-shadow .15s}
textarea::placeholder,input::placeholder{color:#b0b8c1}
#pin::placeholder{letter-spacing:normal;font-size:16px}
textarea:hover,input[type=text]:hover{background:var(--fill-2)}
textarea:focus,input[type=text]:focus{outline:none;background:#fff;box-shadow:0 0 0 2px var(--green) inset}
textarea{min-height:96px;overflow:hidden}

/* 고르기 칩 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chip{background:var(--fill);border-radius:12px;padding:9px 14px;font-size:14.5px;font-weight:500;color:var(--sub);text-align:left;line-height:1.45;
  transition:background .15s,color .15s}
.chip:hover{background:var(--fill-2);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--green-l);color:var(--green-d);font-weight:600;box-shadow:0 0 0 1.5px var(--green) inset}

/* 생각할 거리 */
.think{background:var(--fill);border-radius:18px;overflow:hidden;margin:16px 0}
.think summary{padding:15px 18px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.think summary::-webkit-details-marker{display:none}
.think summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-top:-4px;transition:transform .2s var(--ease)}
.think[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.think .in{padding:0 18px 14px}
.tline{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.55}
.tline:first-child{border-top:0}
.tline .s{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;height:fit-content;margin-top:1px}
.tline .s.y{background:var(--blue-l);color:var(--blue)}
.tline .s.n{background:var(--amber-l);color:var(--amber)}
.tline .s.q{background:var(--green-l);color:var(--green-d)}

/* 스스로 다듬기 */
.chk{background:var(--fill);border-radius:16px;padding:14px 16px;margin:8px 0;display:flex;gap:12px;align-items:flex-start}
.chk .m{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:0;margin-top:1px}
.chk.ok .m{background:var(--green)}
.chk.ok .m::before{content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk.no .m{background:#f5a524}
.chk.no .m::before{content:"";width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:-6px 0 0 #fff,6px 0 0 #fff}
.chk .b{flex:1}
.chk .t{display:block;font-weight:600;font-size:15px;line-height:1.5}
.chk .d{display:block}
.chk .d{font-size:14px;color:var(--sub);margin-top:2px;line-height:1.55}
.chk.ok{background:var(--fill)}
.chk.no{background:var(--amber-l)}
.chk.no .t{color:var(--amber)}
.score{display:flex;align-items:center;gap:14px;background:var(--fill);border-radius:18px;padding:16px 18px;margin-bottom:8px}
.score .big{font-size:28px;font-weight:800;color:var(--green);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.score .tx{font-size:15px;color:var(--sub);font-weight:500}

/* 발표 카드 */
.speech{background:var(--fill);border-radius:20px;padding:20px 22px}
.speech .ln{margin:0;padding:10px 0 10px 64px;font-size:16px;line-height:1.65;position:relative;border-top:1px solid var(--line)}
.speech .ln:first-child{border-top:0;padding-top:2px}
.speech .ln:last-child{padding-bottom:2px}
.speech b{color:var(--green-d)}
.speech .k{position:absolute;left:0;top:12px;width:52px;text-align:center;font-size:12.5px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:8px;padding:2px 0;line-height:1.5}
.speech .ln:first-child .k{top:4px}

.out{width:100%;min-height:220px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.6;overflow:auto;resize:vertical}

/* 알림 면 */
.note{background:var(--blue-l);border-radius:var(--r-sm);padding:14px 16px;font-size:14.5px;color:#26476f;margin:14px 0;line-height:1.6}
.warn{background:var(--amber-l);border-radius:var(--r-sm);padding:14px 16px;font-size:14.5px;color:#7a4206;margin:14px 0;line-height:1.6}
.movecard{background:var(--purple-l);border-radius:18px;padding:16px 18px;margin:12px 0}
.movecard .t{font-weight:700;color:var(--purple);font-size:15.5px}

/* 선생님 탭 — 세그먼트 */
.tabs{display:flex;gap:2px;margin:0 0 14px;padding:4px;background:#e4e7eb;border-radius:14px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{white-space:nowrap;border-radius:10px;padding:8px 16px;font-size:14.5px;font-weight:600;color:var(--sub);transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(25,31,40,.12)}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{border:0;border-bottom:1px solid var(--line);padding:11px 10px;text-align:left;vertical-align:top;line-height:1.55}
th{color:var(--mute);font-weight:600;font-size:13px;background:none;border-bottom:1px solid #d9dde2}
tr:last-child td{border-bottom:0}
td b{font-weight:700}
.bar{height:22px;border-radius:6px;background:var(--green);min-width:3px}
ul.std{margin:6px 0 0 18px;padding:0;font-size:14.5px;line-height:1.65}
ul.std li{margin:4px 0}
code{font-family:inherit;background:var(--fill-2);padding:1px 6px;border-radius:6px;font-size:12.5px}
.gchip{padding:5px 11px;font-size:13px;border-radius:9px}
.gchip[aria-pressed=true]{background:var(--green);color:#fff;box-shadow:none}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grades{min-width:640px}
.grades td{vertical-align:middle}
.grades .chips{flex-wrap:nowrap}
.grades input.gnote{font-size:13.5px;padding:8px 10px;border-radius:10px;min-width:220px}
@media print{.grades input.gnote{border:0;padding:0;min-width:0;background:none}}

/* 카드 나누기 */
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.jobgrid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.job{background:#fff;border-radius:16px;padding:14px 15px;text-align:left;font-size:14px;line-height:1.45;
  box-shadow:0 0 0 1.5px var(--line) inset;transition:background .15s,box-shadow .15s,transform .1s var(--ease)}
.job:hover{box-shadow:0 0 0 1.5px #c9cfd6 inset}
.job:active{transform:scale(.985)}
.job .nm{display:block;font-weight:700;font-size:15px;letter-spacing:-.025em}
.job .ds{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.job .ds:last-child{margin-top:8px}
.job[data-pick="1"]{background:var(--red-l);box-shadow:0 0 0 1.5px #f2b8b8 inset}
.job[data-pick="2"]{background:var(--amber-l);box-shadow:0 0 0 1.5px #f3c47c inset}
.job[data-pick="3"]{background:var(--green-l);box-shadow:0 0 0 1.5px #7fcfa9 inset}
.pick3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.pk{background:#fff;border-radius:10px;padding:9px 4px;font-size:13.5px;font-weight:600;color:var(--sub);line-height:1.3;
  box-shadow:0 0 0 1px var(--line) inset;transition:background .15s,color .15s}
.pk:hover{color:var(--ink);box-shadow:0 0 0 1px #c9cfd6 inset}
.pk3[aria-pressed=true]{background:var(--green);color:#fff;box-shadow:none}
.pk2[aria-pressed=true]{background:#f5a524;color:#fff;box-shadow:none}
.pk1[aria-pressed=true]{background:#e5534b;color:#fff;box-shadow:none}
.linkbtn{color:var(--mute);text-decoration:underline;font-size:13.5px;padding:0}
.grpbox{margin:16px 0 4px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.who span{background:#fff;border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--mute)}
.who span.ok{color:var(--green-d);font-weight:700}
.grph{font-size:16px;margin:18px 0 8px}
.grpcards{display:grid;gap:8px}
.gc{background:var(--fill);border-radius:14px;padding:12px 14px}
.gc.split{background:var(--amber-l)}
.gc .nm{font-weight:700;font-size:14.5px;margin-bottom:4px}
.gc .tag{font-size:11.5px;font-weight:700;color:var(--amber);background:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
.gl{font-size:14px;color:var(--sub);margin-top:2px}
.gl b{font-size:12px;border-radius:6px;padding:1px 7px;margin-right:4px;color:#fff}
.gl b.k0{background:var(--green)} .gl b.k1{background:#f5a524} .gl b.k2{background:#e5534b}
.grpclaims{display:grid;gap:6px}
.gcl{background:var(--fill);border-radius:12px;padding:10px 14px;font-size:14.5px;display:flex;gap:10px}
.gcl b{flex:0 0 auto;color:var(--green-d)}
.meline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 2px 12px;font-size:14px;color:var(--sub)}
.meline b{color:var(--ink)}
.flow{list-style:none;margin:14px 0 8px;padding:0;display:grid;gap:6px;counter-reset:f}
.flow li{counter-increment:f;display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:12px;padding:10px 12px;font-size:14.5px;color:var(--mute);line-height:1.45}
.flow li::before{content:counter(f);flex:0 0 24px;height:24px;border-radius:50%;background:#d5dae0;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.flow li.on{background:var(--green-l);color:var(--green-d);font-weight:700}
.flow li.on::before{background:var(--green)}
.flow li.done{color:var(--sub)}
.flow li.done::before{content:'\2713';background:#8fd0b3}
a.btn{text-decoration:none}
textarea.long{min-height:240px}
.jjmark{display:inline-flex;align-items:center;gap:6px;background:var(--green-l);color:var(--green-d);font-weight:700;border-radius:999px;padding:6px 12px;font-size:14px;margin-top:10px}
.jjmark::before{content:'\2713'}
.jjmark.p{background:var(--fill-2);color:var(--sub)}
.jjmark.p::before{content:none}
.speechbox{background:var(--fill);border-radius:18px;padding:4px 16px 2px;margin-top:18px}
.speechbox>summary{font-weight:700;padding:12px 0;cursor:pointer}
.lv-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.lv-sum{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.lv-sum span{background:var(--fill);border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--sub)}
.lv-g{background:var(--fill);border-radius:18px;padding:14px 16px;margin-top:12px}
.lv-g h3{font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.lv-g h3 .mini{font-weight:600}
.lv-k{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:4px 10px;align-items:center;background:#fff;border-radius:12px;padding:9px 12px;margin-top:6px;font-size:14px}
.lv-k .nm{font-weight:700}

var VAGUE = ['것 같','아마','그냥','들은 것','대충','뭔가','어디서'];
function checks(){
  var r = [], t = topic(), lo = (S.band==='34');
  var claim = (S.claim||'').trim(), reason=(S.reason||'').trim(), ev=(S.ev||'').trim(), who=(S.who||'').trim();
  var N_R = lo?10:15, N_E = lo?6:10, N_W = lo?4:6, N_O = lo?4:6;

  r.push({ ok: claim.length >= 5,
    t:'주장이 한 문장으로 또렷한가요?',
    d: claim.length>=5 ? '좋아요. 무엇을 주장하는지 한 번에 읽혀요.'
                       : '"나는 ~라고 생각한다" 한 문장으로 적어 보세요.' });

  var sameWord = reason.length>0 && claim.length>0 &&
    reason.replace(/\s/g,'').indexOf(claim.replace(/\s/g,'').slice(0,8))>=0 && reason.length < claim.length+10;
  r.push({ ok: reason.length >= N_R && !sameWord,
    t:'이유가 주장을 다시 말한 것은 아닌가요?',
    d: reason.length<N_R ? '왜 그렇게 생각했는지 한 걸음 더 적어 보세요.'
      : sameWord ? '주장과 거의 같은 말이에요. "왜냐하면"으로 이어서 다시 써 볼까요?'
      : '좋아요. 주장과 다른 말로 까닭을 설명했어요.' });

  var vague = false;
  for(var i=0;i<VAGUE.length;i++) if(ev.indexOf(VAGUE[i])>=0) vague=true;
  r.push({ ok: ev.length >= N_E && !vague && S.evType>=0,
    t:'근거를 어디서 알게 되었는지 밝혔나요?',
    d: ev.length<N_E ? '내 생각 말고, 확인할 수 있는 사실을 하나 적어 보세요.'
      : S.evType<0 ? '아래에서 근거의 종류를 하나 골라 주세요.'
      : vague ? '"~것 같다", "어디서 들었다" 같은 말이 있어요. 어디서 보았는지 적을 수 있나요?'
      : '좋아요. 친구가 "어디서 봤어?"라고 물어도 답할 수 있어요.' });

  r.push({ ok: who.length >= N_W,
    t:'누구에게 어떤 영향이 가는지 생각했나요?',
    d: who.length>=N_W ? '좋아요. 사람을 떠올린 주장은 힘이 세요.'
                     : '누가 좋아지고 누가 힘들어질지 한 줄 적어 보세요.' });

  r.push({ ok: (S.other||'').trim().length >= N_O && (S.still||'').trim().length >= N_O,
    t:'나와 다른 의견 가운데 가장 그럴듯한 말을 찾았나요?',
    d: ((S.other||'').trim().length>=N_O && (S.still||'').trim().length>=N_O)
      ? '다른 의견을 읽고도 내 생각을 설명할 수 있어요. 아주 좋아요.'
      : '다음 단계에서 적게 됩니다. 아직 비어 있어요.' });

  var CD = cardsOf(t);
  if(CD){
    var n=0; for(var k in S.jobs) if(S.jobs[k]) n++;
    var need = Math.min(CD.min||6, CD.list.length);
    r.push({ ok: n>=need, t:CD.verb+'를 충분히 나누어 보았나요?',
      d: n>=need ? (n+'개를 나누었어요. 이 가운데 하나를 근거로 쓰면 더 좋아요.')
              : need+'개를 나누어 보면 내 생각이 또렷해져요. (지금 '+n+'개)' });
  }
  return r;
}

function cardGrid(CD, picks, attr){
  var KC = [['#fff0f0','#f2b8b8'],['#fff4e3','#f3c47c'],['#e6f5ee','#7fcfa9']];
  var isJobs = CD.list===JOBS;
  /* 넣을지 정하는 카드는 첫 칸('꼭 넣자')이 초록이 되도록 색 순서를 뒤집어요. */
  var order = isJobs ? [0,1,2] : [2,1,0];
  var h = '';
  if(isJobs){
    h += '<div class="fh">카드를 누를 때마다 <b>'+esc(CD.keys.join(' → '))+' → 처음으로</b> 순서로 바뀌어요.</div><div class="jobkey">';
    for(var q=0;q<3;q++){ var kc=KC[order[q]];
      h += '<span><i style="background:'+kc[0]+';border:1.5px solid '+kc[1]+'"></i>'+esc(CD.keys[q])+'</span>'; }
    h += '</div>';
  } else {
    h += '<div class="fh">카드마다 하나씩 골라 봐요. 고른 단추를 한 번 더 누르면 지워져요.'
       + (CD.help ? '<br>'+esc(CD.help) : '') + '</div>';
  }
  h += '<div class="jobgrid'+(isJobs?'':' wide')+'">';
  for(var a=0;a<CD.list.length;a++){
    var p = picks[a]||0, shown = p ? (order[p-1]+1) : 0;
    if(isJobs){
      h += '<button class="job" data-'+attr+'="'+a+'" data-pick="'+shown+'">'
         + '<span class="nm">'+esc(CD.list[a][0])+'</span><span class="ds">'+esc(CD.list[a][1])+'</span>'
         + (p ? '<span class="ds" style="font-weight:700;color:var(--ink)">→ '+esc(CD.keys[p-1])+'</span>' : '')
         + '</button>';
    } else {
      var B = CD.btn || CD.keys;
      h += '<div class="job" data-pick="'+shown+'"><span class="nm">'+esc(CD.list[a][0])+'</span>'
         + '<span class="ds">'+esc(CD.list[a][1])+'</span><div class="pick3" role="group" aria-label="'+esc(CD.list[a][0])+'">';
      for(var k=1;k<=3;k++)
        h += '<button class="pk pk'+(order[k-1]+1)+'" data-'+attr+'="'+a+'" data-v="'+k+'" aria-pressed="'+(p===k)+'">'+esc(B[k-1])+'</button>';
      h += '</div></div>';

/* 지금까지 쓴 것을 이어 붙인 설득하는 글 초안 */
function buildDraft(t){
  function s(x){ x=(x||'').trim(); if(x && !/[.!?。~]$/.test(x)) x += '.'; return x; }
  function bare(x){ return (x||'').trim().replace(/[.!?。~\s]+$/,''); }
  var P = [];
  P.push((t && t.noLine ? (t.intro || '우리 반은 함께 지킬 규칙을 정하는 토의를 했다.') + ' 나는 우리 반 규칙으로 이것을 제안한다. '
                        : '「'+(t ? t.q : '')+'」에 대해 나는 이렇게 생각한다. ') + s(S.claim));
  var body = [s(S.reason), s(S.ev), s(S.who)].filter(Boolean).join(' ');
  if(body) P.push(body);
  if((S.other||'').trim()) P.push('물론 「' + bare(S.other) + '」라는 의견도 일리가 있다.'
    + ((S.still||'').trim() ? (/^(하지만|그래도|그런데|그렇지만)/.test(S.still.trim()) ? ' ' : ' 하지만 ') + s(S.still) : ''));
  if((S.moved||'').trim() || (S.why||'').trim()) P.push([(S.moved||'').trim() ? '이야기를 나누며 마음에 남은 말이 있다. ' + s(S.moved) : '', s(S.why)].filter(Boolean).join(' '));
  P.push('그래서 나는 다시 한번 말하고 싶다. ' + s(S.claim));
  return P.join('\n\n');
}

function resultText(){

    L.push('[처음 내 자리] ' + (S.first!==null ? S.first + '번 (' + posLabel(S.first,t) + ')' : '-'));
    L.push('');
  }
  L.push('[주장] ' + (S.claim||''));
  L.push('[이유] ' + (S.reason||''));
  L.push('[근거] ' + (S.ev||'') + (S.evType>=0 ? ' (' + EVTYPE[S.evType][0] + ')' : ''));
  L.push('[영향] ' + (S.who||''));
  L.push('');
  L.push('[반대편에서 가장 일리 있던 말] ' + (S.other||''));
  L.push('[그래도 내 생각인 까닭] ' + (S.still||''));
  if((S.grule||'').trim()) L.push('[우리 모둠 의견] ' + S.grule.trim().replace(/\s*\n+\s*/g, ' / '));
  L.push('');
  L.push('[스스로 점검] ' + n[0] + '/' + n[1]);
  var CD = cardsOf(t), cardCode = '';
  if(CD){
    var g=[[],[],[]];
    for(var k in S.jobs){
      var v=S.jobs[k]; if(!v || !CD.list[k]) continue;
      g[v-1].push(CD.list[k][0]);
    }
    for(var q=0;q<3;q++) L.push('['+(t.noLine?'처음 ':'')+CD.lbl+' — '+CD.keys[q]+'] ' + (g[q].join(', ')||'-'));
    cardCode = cardCode0(CD, S.jobs);
  }
  var after = (t && t.noLine && countPicks(S.jobs2)) ? cardCode0(CD, S.jobs2) : '';
  if(S.moved || S.last!==null || S.why || after){
    L.push('');
    L.push('[나를 움직인 말] ' + (S.moved||''));
    if(t && t.noLine){
      var g2=[[],[],[]], chg=[];
      for(var k2=0;k2<CD.list.length;k2++){
        var v2=S.jobs2[k2]||0, v1=S.jobs[k2]||0;
        if(v2) g2[v2-1].push(CD.list[k2][0]);
        if(v1!==v2) chg.push(CD.list[k2][0]+' ('+(v1?CD.keys[v1-1]:'안 고름')+' → '+(v2?CD.keys[v2-1]:'안 고름')+')');
      }
      for(var q2=0;q2<3;q2++) L.push('[토의 뒤 '+CD.lbl+' — '+CD.keys[q2]+'] ' + (g2[q2].join(', ')||'-'));
      L.push('[바꾼 카드] ' + (chg.length ? chg.length+'장 — '+chg.join(', ') : '없음'));
    } else {
      L.push('[나중 내 자리] ' + (S.last!==null ? S.last + '번 (' + posLabel(S.last,t) + ')' : '-'));
      if(S.first!==null && S.last!==null)
        L.push('[움직임] ' + (S.first===S.last ? '그대로' : (S.last-S.first>0?'+':'') + (S.last-S.first) + '칸'));
    }
    L.push('[그 까닭] ' + (S.why||''));
  }
  var jf = jjFlag();
  if(jf){
    L.push('');

    L.push(String(S.final).trim().replace(/@@/g,'@ @').replace(/^\[/mg,' ['));

    (S.first===null?'':S.first), (S.last===null?'':S.last),

    cell(t?t.ends[0]:''), cell(t?t.ends[1]:''), cell(t&&t.id==='custom'?t.q:''), cardCode, after, cell(S.typeName?'':S.group), jf ].join('|') + '@@');
  return L.join('\n');
}
function sendOut(kind){
  if(!S.send) return;

    var nm = prompt('이름을 적지 않았어요. 선생님이 누구 글인지 알 수 있게 적어 주세요.', '');
    if(nm===null) return;

  function stamp(){ var d=new Date(); return d.getHours()+'시 '+(d.getMinutes()<10?'0':'')+d.getMinutes()+'분'; }
  function ok(){
    var tt = topic(), tw = tt && tt.noLine ? '토의가' : '토론이';

    save(); render(); progPing(true);
    var gm = S.step<7 && S.group && ROSTER && ROSTER[S.group], gd = gm && grpDone();
    if(gm) grpTick();
    alert(S.step>=7 ? '선생님께 보냈어요. 최종 글까지 다 했어요! 수고했어요.'
      : gm && !gd ? '선생님께 보냈어요. 모둠 친구들이 다 보내면 아래에 우리 모둠 판이 나와요.'
      : S.step>=6 ? '선생님께 보냈어요. 오늘 활동 끝! 수고했어요.'
      : '선생님께 보냈어요. 이제 친구들과 이야기해요. '+tw+' 끝나면 한 번 더 보내요.');
  }
  function fail(){ render(); alert('보내지 못했어요. 인터넷이 되는지 보고, 안 되면 [결과 복사하기]로 선생님이 알려 주신 곳에 붙여 넣어 주세요.'); }
  if(!window.fetch){ fail(); return; }
  fetch(S.send, { method:'POST', body:body, headers:{'Content-Type':'text/plain;charset=utf-8'} })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.ok) ok(); else throw new Error('bad'); })
    .catch(fail);
}
function copyOut(){
  if(!(S.name||'').trim()){
    var nm = prompt('이름을 적지 않았어요. 선생님이 누구 글인지 알 수 있게 적어 주세요.', '');
    if(nm===null) return;
    S.name = nm.trim(); save();
  }
  var tx = resultText();
  function done(){ alert('복사했어요. 선생님이 알려 주신 곳에 붙여 넣으세요.'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(tx).then(done, fallback);
  } else fallback();
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=tx;
    ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ prompt('아래 글을 직접 복사하세요.', tx); }
    document.body.removeChild(ta);
  }
}

function rosterFromText(txt){
  var m, re = /모둠명단 (\{[^\n]*\})/g, found = null;
  while((m = re.exec(txt||''))){ try{ found = JSON.parse(m[1]); }catch(e){} }
  return found;
}
function sheetGet(url, cb){
  if(!url || !window.fetch){ cb(null); return; }
  fetch(url + (url.indexOf('?')>=0?'&':'?') + 't=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.ok) ctlRead(j); cb(j && j.ok ? (j.texts||[]).join('\n\n') : null, j); })
    .catch(function(){ cb(null, null); });
}
function loadRoster(){
  if(rosterState) return;
  rosterState = 'loading';
  sheetGet(S.send, function(txt){
    var r = txt ? rosterFromText(txt) : null;
    ROSTER = r && Object.keys(r).length ? r : null;
    rosterState = 'done';
    if(txt) grpLast = txt;
    syncGroup();
    render();
  });
}
/* 선생님이 명단에서 모둠을 옮겼으면 이 기기의 모둠도 따라 바꿉니다. 명단이 기준이에요. */
function syncGroup(){
  if(!ROSTER || S.typeName || !(S.name||'').trim()) return false;
  var gs = Object.keys(ROSTER), hit = '';
  for(var i=0;i<gs.length && !hit;i++) if(ROSTER[gs[i]].indexOf(S.name)>=0) hit = gs[i];
  for(var j=0;j<gs.length && !hit;j++) if(ROSTER[gs[j]].some(function(m){ return sameName(S.name, m); })) hit = gs[j];
  if(hit && hit!==S.group){ S.group = hit; save(); return true; }
  return false;
}
function sameName(a, b){ a=(a||'').replace(/\s/g,''); b=(b||'').replace(/\s/g,''); return !!a && !!b && (a===b || a.indexOf(b)>=0); }
function whoPicker(){
  var h = '<label class="f">우리 모둠과 내 이름</label><div class="fh">우리 모둠을 누르고, 내 이름을 눌러요.</div><div class="chips">';
  var gs = Object.keys(ROSTER);
  for(var i=0;i<gs.length;i++) h += '<button class="chip" data-grp="'+esc(gs[i])+'" aria-pressed="'+(S.group===gs[i])+'">'+esc(gs[i])+'모둠</button>';
  h += '</div>';
  if(S.group && ROSTER[S.group]){
    h += '<div class="chips" style="margin-top:12px">';
    for(var j=0;j<ROSTER[S.group].length;j++){ var nm = ROSTER[S.group][j];
      h += '<button class="chip" data-me="'+esc(nm)+'" aria-pressed="'+(S.name===nm)+'">'+esc(nm)+'</button>'; }
    h += '</div>';
  }
  h += '<p class="hint"><button class="linkbtn" data-go="typename">명단에 내 이름이 없어요</button></p>';
  return h;
}
/* 우리 모둠 친구마다 보낸 결과(없으면 row:null) */
function grpGot(txt){
  var t = topic(), members = ROSTER && ROSTER[S.group] || [];
  var rows = parsePastes(txt || grpLast || '').filter(function(r){ return t && r.topic===t.id; });
  return members.map(function(m){ var r=null; for(var i=0;i<rows.length;i++) if(sameName(rows[i].name, m)) r=rows[i]; return {name:m, row:r}; });
}
/* 고른 카드와 제안한 규칙(보낸 친구만) */
function grpBoard(got){
  var t = topic(), CD = cardsOf(t), h = '', sent = got.filter(function(g){ return g.row; });
  if(!sent.length) return '';
  if(CD){
    var B = CD.btn || CD.keys;
    h += '<h3 class="grph">우리 모둠이 고른 카드</h3><div class="grpcards">';
    for(var c=0;c<CD.list.length;c++){
      var col = [[],[],[]];
      for(var g=0;g<sent.length;g++){ var v = +((sent[g].row.cards||'').charAt(c)||0); if(v) col[v-1].push(sent[g].name); }
      var split = (col[0].length>0) + (col[1].length>0) + (col[2].length>0) > 1;
      h += '<div class="gc'+(split?' split':'')+'"><div class="nm">'+esc(CD.list[c][0])+(split?' <span class="tag">생각이 갈려요</span>':'')+'</div>';
      for(var k=0;k<3;k++) if(col[k].length) h += '<div class="gl"><b class="k'+k+'">'+esc(B[k])+'</b> '+col[k].map(esc).join(', ')+'</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  h += '<h3 class="grph">'+(t && t.noLine ? '우리 모둠이 제안한 규칙' : '우리 모둠의 주장')+'</h3><div class="grpclaims">';
  for(var q=0;q<sent.length;q++){ var x = sent[q].row.text || {};
    h += '<div class="gcl"><b>'+esc(sent[q].name)+'</b><span>'+esc(x.claim || '(글 없이 보냈어요)')+'</span></div>'; }
  return h + '</div>';
}
/* ⑥단계 모둠 판(토의 시작 전, 또는 ⑦에서 다시 볼 때). txt 가 없으면 '확인하는 중'으로 그립니다. */
function groupPanel(txt){
  var t = topic(), TW = t && t.noLine ? '토의' : '토론';
  if(!S.group || !ROSTER || !ROSTER[S.group]){
    if(ROSTER) return '<div class="pause"><span class="t">우리 모둠을 골라 주세요</span><div class="mini">모둠 친구들이 다 보냈는지 보려면 모둠과 이름이 필요해요.</div></div>' + whoPicker();
    return '<div class="pause"><span class="t">보냈다면 여기서 잠깐 멈춰요</span><div class="mini">이제 친구들과 '+TW+'해요.</div></div>';
  }
  var members = ROSTER[S.group];
  /* 모둠만 고르고 이름을 아직 안 골랐으면(또는 앞에서 쓴 이름이 명단과 달라 비었으면) 이름 단추를 다시 보여 줍니다. */
  if(!members.some(function(m){ return sameName(S.name, m); }))
    return '<div class="pause"><span class="t">내 이름을 눌러 주세요</span></div>' + whoPicker();
  if(txt===null || txt===undefined) txt = grpLast;
  if(!txt) return '<div class="pause"><span class="t">'+esc(S.group)+'모둠 친구들을 확인하는 중…</span></div>';
  var got = grpGot(txt), tk = talkOf(S.group, members.length);
  var done = got.filter(function(g){ return g.row; }).length, me = got.filter(function(g){ return sameName(S.name, g.name); })[0];
  if(tk) return grpBoard(got);   /* ⑦에서 다시 볼 때 */
  var h = '', mins = talkMinFor(members.length);
  if(done < members.length){
    h += '<div class="pause"><span class="t">우리 모둠 '+done+' / '+members.length+'명 보냈어요</span>'
       + '<div class="mini">'+(me && !me.row ? '<b>나는 아직 안 보냈어요.</b> 위의 [선생님께 보내기]를 눌러요. ' : '')
       + '모두 보내면 바로 모둠 '+TW+'를 시작할 수 있어요. 기다리는 동안 내 발표 카드를 소리 내어 읽어 봐요.</div>'
       + '<div class="who">';
    for(var i=0;i<got.length;i++) h += '<span class="'+(got[i].row?'ok':'')+'">'+(got[i].row?'✓ ':'')+esc(got[i].name)+'</span>';
    h += '</div>';
    /* 절반 넘게 모이면 먼저 시작할 수 있어요. 늦는 친구 화면에는 합류 알림과 타이머가 떠요. */
    if(me && me.row && done*2 >= members.length)
      h += '<div class="row" style="margin-top:12px"><button class="btn sm" data-go="talkstart">지금 모인 '+done+'명과 먼저 시작하기 · '+mins+'분</button></div>'
         + '<div class="mini" style="margin-top:6px">아직 안 온 친구 화면에는 "'+TALK_JOIN+'분 안에 보내고 함께해요" 알림이 떠요.</div>';
    return h + '</div>';
  }
  h += '<div class="pause done"><span class="t">'+esc(S.group)+'모둠 모두 모였어요!</span>'
     + '<div class="mini">아래 단추를 누르면 모둠 '+TW+' 타이머가 시작돼요. 모둠 친구 누구든 한 명만 누르면 돼요.</div>'
     + '<div class="row" style="margin-top:12px"><button class="btn" data-go="talkstart" style="flex:1;background:#fff;color:var(--green-d)">모둠 '+TW+' 시작하기 · '+mins+'분</button></div></div>';
  return h + grpBoard(got);
}
/* ===================== 모둠 토의 시간 =====================
   선생님이나 모둠 아이가 시트에 "모둠토의 {…}" 줄을 하나 보내면, 같은 모둠 기기가 모두 그 줄을 읽어 같은 타이머를 봅니다.
   k: start(시작, min 0이면 자동) · add(min분 더) · stop(끝내기), g: 모둠 이름 또는 '*'(모든 모둠).
   시각은 시트가 받은 때(서버 시각)를 써서 기기마다 시계가 달라도 같은 시간이 남아요. 세 시간이 지난 줄은 지난 수업으로 봅니다. */
var CTL = [], clockOff = 0, TALK_JOIN = 3, talkMinSet = 0;
function autoMin(n){ return Math.max(6, Math.min(12, (n||4) + 4)); }
function talkMinFor(n){ return talkMinSet || autoMin(n); }
function srvNow(){ return Date.now() + clockOff; }
function ctlRead(j){
  if(!j) return;
  if(j.now) clockOff = j.now - Date.now();
  var tx = j.ctl || j.texts || [], tm = j.ctl ? (j.ctlTimes || []) : (j.times || []), out = [];
  for(var i=0;i<tx.length;i++){
    var m = /^모둠토의 (\{[^\n]*\})/.exec(String(tx[i])); if(!m) continue;
    try{ var o = JSON.parse(m[1]); o.at = +tm[i] || +o.t || 0; if(srvNow() - o.at < 3*3600000) out.push(o); }catch(e){}
  }
  out.sort(function(a,b){ return a.at - b.at; });
  CTL = out;
  /* 선생님이 정한 시간: 가장 마지막 '*' 시작 줄의 분 */
  for(var k=out.length-1;k>=0;k--) if(out[k].g==='*' && out[k].k==='start'){ talkMinSet = +out[k].min || 0; break; }
}
function talkOf(g, n, tp){
  var t = topic(), tid = tp || (t ? t.id : ''), st = null;
  for(var i=0;i<CTL.length;i++){
    var e = CTL[i]; if((e.g!==g && e.g!=='*') || (e.tp && tid && e.tp!==tid)) continue;
    var live = st && !st.stop && e.at < st.end;
    if(e.k==='start'){ if(!live) st = { start:e.at, min:+e.min || autoMin(n), add:0, stop:0, by:e.by||'' }; }
    else if(e.k==='add'){ if(live) st.add += (+e.min || 1); }
    else if(e.k==='stop'){ if(live) st.stop = e.at; }
    if(st) st.end = st.stop || (st.start + (st.min + st.add) * 60000);
  }
  return st;
}
function fmtLeft(ms){ ms = Math.max(0, ms); var s = Math.ceil(ms/1000); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
function ctlPost(url, o, done){
  o.t = Date.now(); if(!o.tp){ var t = topic(); o.tp = t ? t.id : (LIVE.cur || 'upload3'); }
  var tx = '모둠토의 ' + JSON.stringify(o) + '\n@@__모둠토의__|' + o.tp + '@@';
  fetch(url, { method:'POST', body:JSON.stringify({text:tx}), headers:{'Content-Type':'text/plain;charset=utf-8'} })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j || !j.ok) throw new Error('bad'); if(done) done(true); })
    .catch(function(){ if(done) done(false); });
}
/* ①~⑥ 어디에 있든, 우리 모둠 토의가 시작됐는데 아직 안 보냈으면 띄우는 알림 */
function lateBar(){
  if(!S.send || !S.group || !inRoster() || S.sents.indexOf('5')>=0 || S.sents.indexOf('6')>=0) return '';
  var tk = talkOf(S.group, ROSTER[S.group].length), t = topic(), TW = t && t.noLine ? '토의' : '토론';
  if(!tk || tk.stop || srvNow() >= tk.end) return '';
  var due = tk.start + TALK_JOIN*60000, late = srvNow() >= due;
  return '<div class="late"><b>우리 모둠 '+TW+'가 시작됐어요!</b> '
    + (late ? '얼른 지금까지 쓴 것으로 보내고 함께해요.'
            : '<b data-end="'+due+'">'+fmtLeft(due - srvNow())+'</b> 안에 지금까지 쓴 것으로 보내고 함께해요.')
    + (S.step<5 ? '<div class="row"><button class="btn sm" data-go="join">보내러 가기</button></div>' : '<div class="mini">아래 [선생님께 보내기]를 눌러요.</div>')
    + '</div>';
}
/* 모둠 토의 화면 */

var progOff = false, progTimer = null, progDue = 0, progLast = '', progAt = 0, progField = '';

function progData(){
  var t = topic(), f = {}, ks = ['claim','reason','ev','who','other','still','moved','why','draft','final','grule'];
  for(var i=0;i<ks.length;i++){ var v=(S[ks[i]]||'').trim(); if(v) f[ks[i]] = v.length; }

           sents:S.sents||'', jj:jjFlag(), cards:countPicks(S.jobs), cards2:countPicks(S.jobs2), f:f,

function progPing(fast){
  if(progOff || !S.send || S.mode!=='student' || !(S.name||'').trim() || !topic() || !window.fetch) return;
  /* 곧 보낼 알림이 이미 있으면 더 늦은 것으로 미루지 않아요(쓰는 동안에도 단계가 바뀐 건 바로 가게). */
  var wait = fast ? 600 : Math.max(2000, 15000 - (Date.now() - progAt));
  if(progTimer && progDue <= Date.now() + wait) return;
  clearTimeout(progTimer); progDue = Date.now() + wait;
  progTimer = setTimeout(function(){
    progTimer = null;
    var d = progData(), key = JSON.stringify(d);
    if(key===progLast) return;
    progLast = key; progAt = Date.now();
    fetch(S.send, { method:'POST', body:JSON.stringify({progress:d}), headers:{'Content-Type':'text/plain;charset=utf-8'} })
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!j || !j.progress) progOff = true; })
      .catch(function(){ progLast = ''; });
  }, wait);
}

var T = { tab:'guide', paste:'', a1:'', a2:'', a3:'', a4:'', topicPick:'', grades:{}, notes:{}, band:'56', sheet:'', unlocked:'', talkMin:0, gop:{} };
function num(x){ x=String(x==null?'':x).trim(); if(x==='') return null; var v=+x; return (v>=0 && v<=10 && v===Math.floor(v)) ? v : null; }
function parsePastes(src){
  var rows = [], seen = {}, blocks = ((src===undefined ? T.paste : src)||'').split(/@@/);
  for(var i=1;i<blocks.length;i+=2){
    var p = blocks[i].split('|');
    if(p.length<6) continue;

      last:num(p[3]), evt:(p[4]||'').trim()||'-', score:(p[5]||'').trim(),

/* 결과 글의 "[주장] ..." 같은 줄을 읽어 옵니다. 같은 이름표가 여러 번이면 마지막 것을 씁니다. */
var FIELDS = { claim:'주장', reason:'이유', ev:'근거', who:'영향', other:'반대편에서 가장 일리 있던 말',
  still:'그래도 내 생각인 까닭', moved:'나를 움직인 말', why:'그 까닭', grule:'우리 모둠 의견' };
function readFields(txt){
  var out = { found:false };
  for(var k in FIELDS){
    var re = new RegExp('^\\['+FIELDS[k]+'\\] ?(.*)$','mg'), m, v='';
    while((m=re.exec(txt))){ v=m[1]; out.found=true; }
    if(k==='ev') v = v.replace(/\s*\((자료|경험|숫자|사례|들은 말)\)\s*$/,'');

/* 상·중·하 제안. 글에서 읽은 것만 봅니다. 설득력 자체는 선생님이 보셔야 해요. */
function evaluate(r){
  var B = bandOf(), x = r.text, c = [], i;
  var L = function(k){ return x && x[k] ? x[k].length : 0; };
  if(x && x.found){
    for(i=0;i<B.crit.length;i++) c.push({ k:B.crit[i].k, v:B.crit[i].f(L, r) });
  } else {
    var sc = /^(\d+)\/(\d+)$/.exec(r.score||''), ratio = sc ? (+sc[1])/(+sc[2]||1) : 0;
    c.push({ k:B.crit[0].k, v: ratio>=0.8 ? 2 : ratio>=0.5 ? 1 : 0 });
    c.push({ k:B.crit[1].k, v: T.band==='34' ? (r.evt!=='-' ? 2 : 0) : (STRONG_EV[r.evt] ? 2 : r.evt!=='-' ? 1 : 0) });
    c.push({ k:B.crit[2].k, v: ratio>=0.8 ? 1 : 0 });
    c.push({ k:B.crit[3].k, v: hasAfter(r) ? 1 : 0 });
  }
  var sum = 0; for(var i=0;i<c.length;i++) sum += c[i].v;

  for(i=0;i<3;i++){
    var n = B.crit[i].n, v = c[i].v;
    var txt = (typeof n==='function') ? n(v, r) : n[2-v];

function gradesText(rows){

  hd.push('처음→나중','한 줄 평');

function liveHtml(){

    + '<div class="row"><span class="mini">'+(LIVE.at ? '10초마다 저절로 새로 봐요 · '+new Date(LIVE.at).toLocaleTimeString('ko-KR') : '불러오는 중…')+'</span>'
    + '<button class="btn sm sec" data-go="liveload">지금 새로 보기</button><button class="btn sm" data-go="showopen">전체 토의 화면</button></div></div>';
  if(LIVE.err==='nosheet') return h + '<p class="lead" style="margin-top:10px">[결과 모아 보기]에 시트 웹 앱 주소를 먼저 넣어 주세요.</p>';
  if(LIVE.err==='fail') h += '<div class="warn">시트를 읽지 못했어요. 인터넷을 확인하고 잠시 뒤 다시 볼게요.</div>';
  if(LIVE.old) return h + '<div class="warn"><b>시트 스크립트가 옛 판이에요.</b> 실시간 보기를 쓰려면 시트의 Apps Script를 새 판으로 바꿔야 해요. '
    + '안내 문서 「02_구글시트_연결하기」의 "새 판으로 바꾸기"를 봐 주세요. 결과 보내기·모아 보기는 그대로 돼요.</div>';
  if(!LIVE.list) return h;
  /* 지난 세 시간 안에 움직인 아이만, 가장 많이 쓰는 주제로 */
  var now = LIVE.now || Date.now(), recent = LIVE.list.filter(function(x){ return x && x.d && now - (x.at||0) < 3*3600000; });
  var cnt = {}; recent.forEach(function(x){ cnt[x.d.topic] = (cnt[x.d.topic]||0) + 1; });
  var tps = Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; });
  var tp = (LIVE.topic && cnt[LIVE.topic]) ? LIVE.topic : (tps[0] || LIVE.cur || 'upload3');   /* 아직 아무도 안 들어왔으면 지금 수업(3차시) 주제로 */
  var tt = topicById(tp), kids = recent.filter(function(x){ return x.d.topic===tp; });
  LIVE.cur = tp || LIVE.cur;
  if(tps.length>1){
    h += '<div class="chips" style="margin-top:10px">';
    for(var a=0;a<tps.length;a++){ var tq = topicById(tps[a]);
      h += '<button class="chip" data-livetopic="'+esc(tps[a])+'" aria-pressed="'+(tps[a]===tp)+'">'+esc(tq ? tq.q : tps[a])+' ('+cnt[tps[a]]+'명)</button>'; }
    h += '</div>';
  }
  if(!kids.length && !LIVE.roster) return h + '<p class="lead" style="margin-top:10px">아직 들어온 아이가 없어요. 아이들이 학생용 주소로 들어와 이름을 고르면 여기에 나와요.</p>';
  var TWn = tt && tt.noLine ? '토의' : '토론';
  /* 단계별 인원 */
  var bySt = {}; kids.forEach(function(x){ bySt[x.d.step] = (bySt[x.d.step]||0) + 1; });
  h += '<div class="lv-sum">';
  for(var st=1; st<=7; st++) if(bySt[st]) h += '<span>'+(st+1)+'. '+esc(stepLabel(st, tt))+' <b>'+bySt[st]+'명</b></span>';
  h += '</div>';
  function find(nm){ var hit=null; for(var i=0;i<kids.length;i++) if(kids[i].d.name===nm) hit=kids[i];
    if(!hit) for(var j=0;j<kids.length;j++) if(sameName(kids[j].d.name, nm)) hit=kids[j]; return hit; }
  var R = LIVE.roster, used = {}, gs = R ? Object.keys(R) : [];
  function kidRow(nm, x, g){
    if(x) used[x.d.name] = true;
    var hh = '<div class="lv-k'+(x?'':' off')+'"><span class="nm">'+esc(nm)+'</span><span class="wh">';
    if(!x) hh += '아직 안 들어왔어요';
    else {
      var d = x.d, sn = d.sents||'', fl = d.field && FIELDNAMES[d.field] ? FIELDNAMES[d.field] : '';
      hh += '<span class="st s'+d.step+'">'+(d.step+1)+'. '+esc(stepLabel(d.step, tt))+'</span>'
         + (fl ? esc(fl)+' 칸'+(d.f && d.f[d.field] ? ' · '+d.f[d.field]+'자' : '') : (d.step===1 && tt && tt.noLine ? '카드 '+(d.cards||0)+'장 고름' : ''))
         + '<span class="mini">'
         + (sn.indexOf('5')>=0 ? '<span class="mk ok">'+TWn+' 전 보냄</span>' : '')
         + (sn.indexOf('6')>=0 ? '<span class="mk ok">'+TWn+' 뒤 보냄</span>' : '')
         + (sn.indexOf('7')>=0 ? '<span class="mk ok">최종 글 보냄</span>' : '')
         + (d.gs ? '<span class="mk ok">모둠 의견 보냄</span>' : '')
         + (d.jj==='j' ? '<span class="mk jj">자작자작</span>' : d.jj==='p' ? '<span class="mk">붙여 넣음</span>' : '')
         + '<span class="mk'+(now-(x.at||0) > 5*60000 ? ' late' : '')+'">'+ago(now-(x.at||0))+'</span></span>';
    }
    hh += '</span>';
    if(R){
      hh += '<select data-move="'+esc(x ? x.d.name : nm)+'" aria-label="모둠 옮기기"><option value="">'+(g ? esc(g)+'모둠' : '모둠 없음')+'</option>';
      for(var q=0;q<gs.length;q++) if(gs[q]!==g) hh += '<option value="'+esc(gs[q])+'">'+esc(gs[q])+'모둠으로</option>';
      hh += '</select>';
    } else hh += '<span></span>';
    return hh + '</div>';
  }
  /* 모둠 토의 시간 */
  var tm = T.talkMin || 0, anyLive = false;
  if(R) for(var gq in R){ var s0 = talkOf(gq, R[gq].length, tp); if(s0 && !s0.stop && srvNow() < s0.end) anyLive = true; }
  h += '<div class="lv-talk"><b>모둠 '+TWn+'</b><select data-talkmin aria-label="모둠 '+TWn+' 시간"><option value="0">자동 (모둠 인원 + 4분)</option>';
  for(var mm=5; mm<=15; mm++) h += '<option value="'+mm+'"'+(tm===mm?' selected':'')+'>'+mm+'분</option>';
  h += '</select><button class="btn sm" data-go="talkall">모든 모둠 시작</button>'
    + (anyLive ? '<button class="btn sm sec" data-go="talkadd" data-min="1">모두 +1분</button><button class="btn sm sec" data-go="talkadd" data-min="3">모두 +3분</button>'
               + '<button class="btn sm sec" data-go="talkstop">모두 끝내기</button>' : '')
    + '<span class="mini" style="flex-basis:100%">모둠은 절반 넘게 보내면 아이들이 직접 시작할 수도 있어요. 시작하면 아직 안 보낸 아이 화면에 "'+TALK_JOIN+'분 안에 보내고 함께해요" 알림이 떠요.</span></div>';
  /* 모둠 의견 모아 보기 (전체 토의 때 띄워요) */
  if(R){
    var gops = '';
    for(var go2 in R){
      var seen = {}, lines = [];
      R[go2].forEach(function(nm){ var x = find(nm); var gr = x && x.d.grule; if(gr && !seen[gr]){ seen[gr] = 1; lines.push([gr, x.d.name]); } });
      if(lines.length) gops += '<div class="gop"><b>'+esc(go2)+'모둠</b> '+lines.map(function(l){ return esc(l[0])+' <span class="mini">— '+esc(l[1])+'</span>'; }).join('')+'</div>';
    }
    if(gops) h += '<div class="lv-g"><h3>모둠 의견 모아 보기 <span class="mini">전체 '+TWn+' 때 이 화면을 띄워 보세요</span></h3>'+gops+'</div>';
  }
  if(R){
    h += '<p class="mini" style="margin-top:10px">모둠을 잘못 골랐거나 자리를 옮긴 아이는 오른쪽에서 모둠을 바꿔 주세요. 아이 화면은 ⑥단계에서 저절로 따라가요.</p>';
    for(var gi=0; gi<gs.length; gi++){
      var mem = R[gs[gi]], xs = mem.map(function(nm){ return find(nm); }), inn = xs.filter(Boolean);
      var minSt = inn.length ? Math.min.apply(null, inn.map(function(x){ return x.d.step; })) : -1;
      var all5 = inn.length===mem.length && inn.every(function(x){ return (x.d.sents||'').indexOf('5')>=0 || (x.d.sents||'').indexOf('6')>=0; });
      var stTxt = !inn.length ? '아직 아무도 안 들어왔어요'
        : all5 ? '모두 보냈어요 — 모둠 '+TWn+' 중'
        : (inn.length<mem.length ? (mem.length-inn.length)+'명 아직 · ' : '') + '가장 느린 친구 '+(minSt+1)+'. '+stepLabel(minSt, tt);
      var gt = talkOf(gs[gi], mem.length, tp), gOver = gt && (gt.stop || srvNow() >= gt.end);
      h += '<div class="lv-g"><h3>'+esc(gs[gi])+'모둠 <span class="mini">'+esc(stTxt)+'</span>'
        + (gt ? '<span class="tst'+(gOver?' over':'')+'">'+(gOver ? TWn+' 끝' : TWn+' 중 · <span data-end="'+gt.end+'">'+fmtLeft(gt.end - srvNow())+'</span> 남음')+'</span>' : '')
        + '<span class="gbtn">'
        + (!gt || gOver ? '<button class="btn sm sec" data-go="talkg" data-k="start" data-g="'+esc(gs[gi])+'">'+(gt?'다시 ':'')+'시작</button>'
                        : '<button class="btn sm sec" data-go="talkg" data-k="add" data-min="1" data-g="'+esc(gs[gi])+'">+1분</button>'
                        + '<button class="btn sm sec" data-go="talkg" data-k="stop" data-g="'+esc(gs[gi])+'">끝내기</button>')
        + '</span></h3>';
      for(var mi=0; mi<mem.length; mi++) h += kidRow(mem[mi], xs[mi], gs[gi]);
      h += '</div>';
    }
  }
  var rest = kids.filter(function(x){ return !used[x.d.name]; });
  if(rest.length){
    h += '<div class="lv-g"><h3>'+(R ? '명단에 없는 이름' : '들어온 아이')+' <span class="mini">'+rest.length+'명</span></h3>';
    for(var ri=0; ri<rest.length; ri++) h += kidRow(rest[ri].d.name, rest[ri], rest[ri].d.group||'');
    h += '</div>';
  }
  return h;
}
/* 선생님이 아이의 모둠을 옮김 → 명단 줄을 새로 하나 보냄(가장 마지막 줄을 씀) */
function moveKid(nm, g){
  var R = JSON.parse(JSON.stringify(LIVE.roster || {})), u = sheetUrl();
  if(!u || !g || !R[g]) return;
  for(var k in R) R[k] = R[k].filter(function(m){ return m!==nm && !sameName(nm, m); });
  R[g].push(nm);
  var tx = '모둠명단 ' + JSON.stringify(R) + '\n@@__모둠명단__|' + (LIVE.topic || 'upload3') + '@@';
  fetch(u, { method:'POST', body:JSON.stringify({text:tx}), headers:{'Content-Type':'text/plain;charset=utf-8'} })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j || !j.ok) throw new Error('bad'); LIVE.roster = R; paintLive(); })
    .catch(function(){ alert('모둠을 바꾸지 못했어요. 인터넷을 확인하고 다시 해 볼까요?'); paintLive(); });
}
/* ===================== 전체 토의 화면 (전자칠판) =====================
   시트 글을 한 번 불러와 표지 → 모둠마다 한 장 → 같은 것 → 다른 것 → 합의문 순서로 크게 보여 줍니다.
   붙여넣기 칸(T.paste)은 건드리지 않아요. */
var SHOW = { open:false, i:0, rows:null, roster:null, tp:'', err:'' };
/* 카드마다 그 카드 이야기인지 알아볼 말. 없으면 카드 이름에서 뽑아요. */
var KWC = { upload3:[['출처','정확','베낀','퍼온'],['폭력','욕설','부적절','잔인','무서운'],['개인정보','딥페이크','보기 좋','비속어','비하'],['출처','믿을','가짜','사실'],['개인정보','다른 사람','남의','얼굴','사진']] };
function cardWords(tp, c, CD){
  var k = KWC[tp] && KWC[tp][c]; if(k) return k;
  return String(CD.list[c][0]).replace(/^\d+모둠\s*·\s*/,'').split(/[\s·,]+/).filter(function(w){ return w.length>=2; });
}
/* 그 카드를 '고쳐서 넣자'·'빼도 돼요'로 고른 친구의 글에서 그 카드 이야기를 한 문장을 이름 없이 꺼내요. */
function cardVoices(rows, c, tp, CD){
  var B = CD.btn || CD.keys, ws = cardWords(tp, c, CD), out = [], seen = {}, quiet = 0;
  rows.forEach(function(r){
    var v = +(lastCards(r).charAt(c)||0); if(v<2) return;
    var x = r.text || {}, src = [x.why, x.other, x.still, x.grule, x.claim, x.moved, r.final].join('\n');
    var sents = src.replace(/([.!?。])\s+/g, '$1\n').split(/\n+/).map(function(t){ return t.trim(); }).filter(Boolean);
    var hit = sents.filter(function(t){ return ws.some(function(w){ return t.indexOf(w)>=0; }); })[0];
    if(!hit){ quiet++; return; }
    if(hit.length > 140) hit = hit.slice(0, 138) + '…';
    if(seen[hit]) return; seen[hit] = 1;
    out.push({ k:B[v-1], t:hit });
  });
  return { list:out.slice(0, 6), more:Math.max(0, out.length-6), quiet:quiet };
}
function voicesHtml(vo){
  if(!vo || (!vo.list.length && !vo.quiet)) return '';
  return vo.list.map(function(x){ return '<div class="voice"><b>'+esc(x.k)+'</b>'+esc(x.t)+'</div>'; }).join('')
    + (vo.more ? '<div class="mini">… '+vo.more+'개 더</div>' : '')
    + (vo.quiet ? '<div class="mini" style="font-size:.75em;margin-top:.2em">까닭을 따로 적지 않은 친구 '+vo.quiet+'명</div>' : '');
}
var KW = { upload3:['개인정보','출처','허락','동의','욕설','비속어','비하','폭력','딥페이크','얼굴','사진','이름','저작권','사실','확인','3초'] };
function showOpen(){
  SHOW.open = true; SHOW.i = 0; SHOW.err = ''; SHOW.rows = null; paintShow();
  showFetch(function(){ paintShow(); agLoad(function(){ agApply(document); }); });
}
function showList(){
  var L = [{k:'title'}];
  if(SHOW.roster) Object.keys(SHOW.roster).forEach(function(g){ L.push({k:'group', g:g}); });
  return L.concat([{k:'same'}, {k:'diff'}, {k:'agree'}]);
}
/* 한 사람의 마지막 카드(토의 뒤에 다시 골랐으면 그것) */
function lastCards(r){ return r ? (r.cards2 || r.cards || '') : ''; }
function showGot(g){
  var mem = SHOW.roster && SHOW.roster[g] || [], rows = SHOW.rows || [];
  return mem.map(function(nm){ var hit = null; rows.forEach(function(r){ if(sameName(r.name, nm)) hit = r; }); return {name:nm, row:hit}; });
}
function cardCounts(list, c){ var n = [0,0,0,0]; list.forEach(function(r){ n[+(lastCards(r).charAt(c)||0)]++; }); return n; }
function barHtml(n, B){
  var tot = n[1]+n[2]+n[3]; if(!tot) return '<div class="bar"></div>';
  var h = '<div class="bar">';
  for(var k=1;k<=3;k++) if(n[k]) h += '<i class="k'+(k-1)+'" style="width:'+(n[k]/tot*100)+'%">'+esc(B[k-1])+' '+n[k]+'</i>';
  return h + '</div>';
}
function showSlide(it){
  var tt = topicById(SHOW.tp), CD = cardsOf(tt), TW = tt && tt.noLine ? '토의' : '토론', rows = SHOW.rows || [];
  var B = CD ? (CD.btn || CD.keys) : [];
  if(!SHOW.rows) return '<h1>불러오는 중…</h1>';
  if(it.k==='title'){
    return '<h1>'+esc(tt ? tt.q : '전체 '+TW)+'</h1>'
      + (SHOW.err ? '<div class="ask">'+esc(SHOW.err)+'</div>' : '')
      + '<h3>전체 '+TW+' 순서</h3><ol class="big">'
      + '<li>모둠마다 30초 — "우리 모둠 의견은 ~이고, 왜냐하면 ~"</li>'
      + '<li>같은 것 찾기 — 우리 반이 거의 같이 고른 것</li>'
      + '<li>다른 것 이야기하기 — "어떻게 고치면 다 같이 넣을 수 있을까?"</li>'
      + '<li>우리 반 합의문 쓰기</li></ol>'
      + '<p class="mini" style="font-size:.8em">보낸 사람 '+rows.length+'명'+(SHOW.roster ? ' · '+Object.keys(SHOW.roster).length+'모둠' : '')+' · 손 들어 정하지 않아요. 생각이 다른 곳을 찾아 고쳐서 모아요.</p>';
  }
  if(it.k==='group'){
    var got = showGot(it.g), sent = got.filter(function(x){ return x.row; }).map(function(x){ return x.row; });
    var seen = {}, gops = [];
    got.forEach(function(x){ var gr = x.row && x.row.text && x.row.text.grule; if(gr && !seen[gr]){ seen[gr] = 1; gops.push([gr, x.name]); } });
    var h = '<h1>'+esc(it.g)+'모둠<span class="mini">'+sent.length+' / '+got.length+'명 보냄</span></h1>';
    if(gops.length) h += gops.map(function(g){ return '<div class="gopbig">'+esc(g[0])+'<span class="who">'+esc(g[1])+'</span></div>'; }).join('');
    h += '<label class="al">'+(gops.length ? '발표를 들으며 덧붙일 말' : '모둠 의견 — 발표를 들으며 여기에 적어요')+'</label>'
      + '<textarea data-gop="'+esc(it.g)+'" placeholder="예: 올리기 전에 사진에 친구가 나오면 허락을 받는다">'+esc((T.gop||{})[it.g]||'')+'</textarea>';
    h += '<div class="cols"><div><h3>'+(tt && tt.noLine ? '모둠 친구들이 제안한 규칙' : '모둠 친구들의 주장')+'</h3>'
      + got.map(function(x){ var c = x.row && x.row.text && x.row.text.claim;
          return '<div class="cl'+(c?'':' off')+'"><b>'+esc(x.name)+'</b><span>'+esc(c || (x.row ? '(글 없이 보냈어요)' : '아직 안 보냈어요'))+'</span></div>'; }).join('')
      + '</div><div>';
    if(CD && sent.length){
      h += '<h3>'+(sent.some(function(r){ return r.cards2; }) ? '토의 뒤에 고른 카드' : '고른 카드')+'</h3>';
      for(var c=0;c<CD.list.length;c++){
        var n = cardCounts(sent, c), split = (n[1]>0) + (n[2]>0) + (n[3]>0) > 1;
        h += '<div class="crow"><div class="nm">'+esc(CD.list[c][0])+(split ? '<span class="tag">생각이 갈려요</span>' : '')+'</div>'+barHtml(n, B)+'</div>';
      }
      var mv = got.filter(function(x){ return x.row && x.row.cards2 && x.row.cards && cardsChanged(x.row.cards, x.row.cards2); });
      if(mv.length) h += '<p style="font-size:.85em">생각이 바뀐 친구: <b>'+mv.map(function(x){ return esc(x.name); }).join(', ')+'</b> — "무엇이 생각을 바꿨어?"</p>';
    }
    return h + '</div></div>';
  }
  if(it.k==='same' || it.k==='diff'){
    var rs = rows.filter(function(r){ return lastCards(r); }), same = [], diff = [];
    if(CD) for(var c2=0;c2<CD.list.length;c2++){
      var m = cardCounts(rs, c2), tot = m[1]+m[2]+m[3], mx = Math.max(m[1],m[2],m[3]);
      if(!tot) continue;
      (mx/tot >= 0.7 ? same : diff).push({c:c2, n:m, top:m.indexOf(mx), share:mx/tot, vo:cardVoices(rs, c2, SHOW.tp, CD)});
    }
    var hs = '';
    if(it.k==='same'){
      hs += '<h1>같은 것<span class="mini">우리 반이 거의 같이 고른 것</span></h1>';
      if(same.length) same.sort(function(a,b){ return b.share-a.share; }).forEach(function(x){
        hs += '<div class="crow"><div class="nm">'+esc(CD.list[x.c][0])+' — '+esc(B[x.top-1])+' '+x.n[x.top]+'명</div>'+barHtml(x.n, B)+voicesHtml(x.vo)+'</div>'; });
      else hs += '<div class="empty">열 명 가운데 일곱 명 넘게 같이 고른 카드는 아직 없어요.</div>';

function render(){
  var bm = $('btnMode');
  if(askPin){ app(viewLock()); bm.hidden = true; var pe=$('pin'); if(pe) pe.focus(); render.lastKey='lock'; return; }
  if(S.mode==='teacher' && !unlocked()) S.mode = 'student';
  if(S.mode!=='teacher' && S.step>0 && !topic()){ S.step=0; S.topic=null; }
  var key = S.mode+'/'+(S.mode==='teacher'?T.tab:S.step), y = window.pageYOffset||0;
  app(S.mode==='teacher' ? viewTeacher() : viewStudent());
  if(S.mode==='student' && key!==render.lastKey) progPing(true);
  if(S.mode==='teacher' && T.tab==='live'){ if(!liveTimer){ liveTimer = setInterval(liveLoad, 10000); liveLoad(); } }
  else if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  if(S.mode==='student' && S.send && !rosterState && (S.step===1 || S.step>=5)) loadRoster();
  if(S.mode==='student' && S.send && S.group && S.step>=1 && S.step<=4 && S.sents.indexOf('5')<0){ if(!ctlTimer){ ctlTimer = setInterval(ctlTick, 15000); setTimeout(ctlTick, 500); } }
  else if(ctlTimer){ clearInterval(ctlTimer); ctlTimer = null; }
  if(S.mode==='student' && S.step>=5 && S.step<=6 && S.send && S.group){ if(!grpTimer){ grpTimer = setInterval(grpTick, 8000); setTimeout(grpTick, 300); } }
  else if(grpTimer){ clearInterval(grpTimer); grpTimer = null; }
  /* 아이 기기에는 단추가 보이지 않아요. 비밀번호를 넣은 선생님 기기에서만 두 화면을 오갑니다. */
  bm.hidden = !(S.mode==='teacher' || unlocked());
  bm.textContent = S.mode==='teacher' ? '학생 화면' : '선생님 화면';
  window.scrollTo(0, key===render.lastKey ? y : 0);
  render.lastKey = key;
}
function grab(){
  var ids = ['claim','reason','ev','who','other','still','moved','why','draft','final','grule','nm','cq','cl','cr','paste','a1','a2','a3','a4','sheet'];
  for(var i=0;i<ids.length;i++){
    var el = $(ids[i]); if(!el) continue;
    var v = el.value;
    if(ids[i]==='nm') S.name=v;
    else if(ids[i]==='cq') S.custom=v;
    else if(ids[i]==='cl') S.customL=v;
    else if(ids[i]==='cr') S.customR=v;
    else if(ids[i]==='paste') T.paste=v;
    else if(ids[i]==='sheet') T.sheet=v;
    else if(ids[i].charAt(0)==='a' && ids[i].length===2) T[ids[i]]=v;
    else S[ids[i]]=v;
  }
  var notes = document.querySelectorAll('input[data-gnote]');
  /* 앱이 제안한 문구 그대로면 저장하지 않아요. 그래야 학년군을 바꿀 때 한 줄 평도 따라 바뀝니다. */
  for(var j=0;j<notes.length;j++){
    var nk = notes[j].getAttribute('data-gnote');
    if(notes[j].value === notes[j].getAttribute('data-auto')) delete T.notes[nk];
    else T.notes[nk] = notes[j].value;
  }
  save();
}

    save(); render(); return; }

  switch(d.go){

                   : !talkKey() ? '아직 모둠 토의를 시작하지 않았어요. 모둠 토의와 전체 토의가 끝난 뒤에 눌러요.\n그래도 지금 넘어갈까요?'
                                : '아직 우리 모둠 의견을 보내지 않았어요. 모둠 의견을 보내고, 전체 토의가 끝난 뒤에 눌러요.\n그래도 지금 넘어갈까요?')) break;
      if(S.step<6){ S.step++;

    case 'shownext': showGo(SHOW.i+1); break;
    case 'showprev': showGo(SHOW.i-1); break;
    case 'showto': showGo(+d.i); break;
    case 'showfull':
      if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen().catch(function(){}); }
      else { var fe = document.documentElement; if(fe.requestFullscreen) fe.requestFullscreen().catch(function(){}); }
      break;
    case 'fix':  grab(); S.step=2; save(); render(); break;
    case 'copy': grab(); copyOut(); break;
    case 'send': grab(); sendOut(); break;
    case 'loadsheet': grab(); loadSheet(false); break;
    case 'testsheet': grab(); loadSheet(true); break;
    case 'print': grab(); window.print(); break;
    case 'agg': grab(); render(); break;
    case 'unlock': tryUnlock(); break;
    case 'typename': grab(); S.typeName = true; S.group = ''; S.nameHere = true; save(); render(); break;
    case 'lockback':
      askPin = false; S.mode = 'student'; save();
      try{ history.replaceState(null, '', location.pathname + location.search.replace(/([?&])teacher(=[^&]*)?&?/, '$1').replace(/[?&]$/, '')); }catch(e){}
      render(); break;
    case 'copylesson':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('이 수업 학생용 주소를 복사했어요.\n'+tx);},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(location.href.split('?')[0].split('#')[0] + '?band=56&topic=upload3' + (sheetUrl() ? '&send=' + encodeURIComponent(sheetUrl()) : ''));
      break;
    case 'copylink':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('학생용 주소를 복사했어요. 아이들에게 이 주소를 주면 돼요.\n'+tx);},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(location.href.split('?')[0].split('#')[0] + '?band=' + T.band + (sheetUrl() ? '&send=' + encodeURIComponent(sheetUrl()) : ''));
      break;
    case 'copygrades':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('평가표를 복사했어요. 시트나 문서에 붙여 넣으세요.');},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(gradesText(gradeRows()));
      break;
    case 'resetgrades':
      grab();
      if(!confirm('고친 평가와 한 줄 평을 지우고 앱 제안으로 되돌릴까요?')) break;
      T.grades={}; T.notes={}; save(); render(); break;
    case 'clearpaste':
      grab();
      if(!confirm('붙여 넣은 학생 결과를 모두 지울까요? 합의문은 그대로 남아요.')) break;
      T.paste=''; save(); render(); break;
    case 'copyagree':
      grab();
      (function(tx){
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(tx).then(function(){alert('합의문을 복사했어요.');},function(){prompt('복사하세요',tx);});
        else prompt('복사하세요', tx);
      })(agreeText());
      break;
    case 'reset':
      if(!confirm('지금 쓴 내용을 지우고 새 주제로 시작할까요?')) break;
      var nm = S.name, gp = S.group;
      S = { mode:S.mode, step:0, topic:null, custom:'', name:nm, first:null, claim:'', claimPick:-1,
            reason:'', ev:'', evType:-1, who:'', jobs:{}, other:'', still:'', moved:'', last:null, why:'', checked:false,
            customL:'', customR:'', band:S.band, send:S.send, lastSent:'', jobs2:{}, sentStep:-1, group:gp,
            sents:'', draft:'', final:'', jj:'', jjOpened:false, grule:'', grSent:false };
      save(); render(); break;
  }
});
document.addEventListener('keydown', function(e){
  if(SHOW.open){
    var tg = e.target && e.target.tagName;
    if(e.key==='Escape'){ SHOW.open = false; paintShow(); render(); return; }
    if(tg==='TEXTAREA' || tg==='INPUT') return;
    if(e.key==='ArrowRight' || e.key==='PageDown' || e.key===' '){ e.preventDefault(); if(SHOW.i < showList().length-1) showGo(SHOW.i+1); return; }
    if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); if(SHOW.i>0) showGo(SHOW.i-1); return; }
  }
  if(e.key==='Enter' && e.target && e.target.id==='pin'){ e.preventDefault(); tryUnlock(); return; }
  if(e.key==='Enter' && e.target && (e.target.id==='cq' || e.target.id==='cl' || e.target.id==='cr')){
    e.preventDefault(); var b=document.querySelector('[data-topic="custom"]'); if(b) b.click();
  }
});
/* 최종본 칸에 붙여 넣으면: 자작자작을 열었던 아이는 '자작자작 도움', 아니면 '붙여 넣음' */
document.addEventListener('paste', function(e){
  if(!e.target || e.target.id!=='final') return;
  setTimeout(function(){
    grab();
    if((S.final||'').trim().length >= 10){ S.jj = S.jjOpened ? 'j' : (S.jj==='j' ? 'j' : 'p'); save(); }
    var m = $('jjmark'); if(m) m.innerHTML = jjMark();
    progPing(true);
  }, 0);
});
document.addEventListener('focusin', function(e){
  var id = e.target && e.target.id;
  if(S.mode==='student' && id && FIELDNAMES[id] && progField!==id){ progField = id; progPing(true); }
});
document.addEventListener('change', function(e){
  if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-talkmin')){ T.talkMin = +e.target.value || 0; save(); return; }
  var mv = e.target && e.target.getAttribute && e.target.getAttribute('data-move');
  if(mv===null || mv===undefined || !e.target.value) return;
  var g = e.target.value; e.target.blur();
  if(confirm(mv+'을(를) '+g+'모둠으로 옮길까요?')) moveKid(mv, g); else paintLive();
});
/* 전자칠판에서 손가락으로 밀어 넘기기 */
var swX = null;
document.addEventListener('touchstart', function(e){ swX = (SHOW.open && e.target.closest && e.target.closest('#sl') && e.touches.length===1) ? e.touches[0].clientX : null; }, {passive:true});
document.addEventListener('touchend', function(e){
  if(swX===null || !SHOW.open) return;
  var dx = e.changedTouches[0].clientX - swX; swX = null;
  if(Math.abs(dx) < 70) return;
  var n = showList().length;
  if(dx < 0 && SHOW.i < n-1) showGo(SHOW.i+1); else if(dx > 0 && SHOW.i > 0) showGo(SHOW.i-1);
}, {passive:true});
document.addEventListener('input', function(e){
  var ga = e.target && e.target.getAttribute;
  if(ga && e.target.getAttribute('data-gop')!==null){ T.gop = T.gop || {}; T.gop[e.target.getAttribute('data-gop')] = e.target.value; grow(e.target); save(); return; }
  if(ga && e.target.getAttribute('data-ag')!==null){ agType(e.target.getAttribute('data-ag'), e.target.value); grow(e.target); return; }
  /* [마무리 — 합의문] 탭에서 고쳐도 모두의 화면에 가요 */
  if(S.mode==='teacher' && e.target && /^a[1-4]$/.test(e.target.id||'') && sheetUrl()){ grow(e.target); agType(e.target.id, e.target.value); return; }
  if(e.target && e.target.id==='final' && !(e.target.value||'').trim()){ S.jj=''; var jm=$('jjmark'); if(jm) jm.innerHTML=''; }
  if(S.mode==='student' && e.target && FIELDNAMES[e.target.id]) progPing(false);
  if(e.target && e.target.tagName==='TEXTAREA') grow(e.target);
  if(e.target && (e.target.tagName==='TEXTAREA' || e.target.tagName==='INPUT')){
    clearTimeout(window.__t);
    window.__t = setTimeout(function(){ grab(); refreshNext(); }, 250);
  }
});
/* 남은 시간 글자를 1초마다 바꿔요. 다 되면 토의 상자를 주황으로. */
setInterval(function(){
  var els = document.querySelectorAll('[data-end]');
  for(var i=0;i<els.length;i++){
    var left = +els[i].getAttribute('data-end') - srvNow();
    els[i].textContent = fmtLeft(left);
    if(left<=0){ var tb = els[i].closest('.talkbox'); if(tb) tb.classList.add('over'); }
  }
}, 1000);
$('btnMode').addEventListener('click', function(){
  grab();
  if(S.mode==='teacher') S.mode='student';
  else if(unlocked()) S.mode='teacher';
  else askPin = true;
  save(); render();
});

load();
if(S.mode==='teacher' && !unlocked()) S.mode='student';   /* 전에 [선생님용]을 눌러 본 아이 기기 */
if(location.search.indexOf('teacher')>=0){ if(unlocked()) S.mode='teacher'; else askPin = true; }
var _qb = /[?&]band=(34|56)/.exec(location.search);
if(_qb){ S.band=_qb[1]; T.band=_qb[1]; save(); }
var _qt = /[?&]topic=([a-z0-9]+)/.exec(location.search);
if(_qt && location.search.indexOf('teacher')<0){
  var _tt = null; for(var _j=0;_j<TOPICS.length;_j++) if(TOPICS[_j].id===_qt[1]) _tt=TOPICS[_j];
  /* 이미 그 주제로 쓰던 아이는 그대로 두고, 처음 들어오는 아이만 그 주제로 엽니다. */
  if(_tt && S.topic!==_tt.id){ S.topic=_tt.id; S.step=1; S.jobs={}; S.jobs2={}; if(_tt.band!=='all') S.band=_tt.band; save(); }
}
var _qs = /[?&]send=([^&#]+)/.exec(location.search);
if(_qs){
  var _u = _qs[1]; try{ _u = decodeURIComponent(_u); }catch(e){}
  if(/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\//.test(_u)){
    S.send=_u;
    /* 선생님 화면 주소(?teacher&send=…)로 열면 시트 주소 칸도 채워 둡니다. 이미 넣은 주소는 덮지 않아요. */
    if(location.search.indexOf('teacher')>=0 && !(T.sheet||'').trim()) T.sheet=_u;
    save();
  }
}
render();
setTimeout(agLoop, 1500);
})();
</script>
</body>
