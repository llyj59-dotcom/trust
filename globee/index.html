<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globee — 초등 국제교류 길잡이</title>
<meta name="description" content="초등 국제교류를 처음부터 끝까지: 순서 안내, 동의서·서류 틀, 자료 모음, 주제 추천, 파트너교 점검, 메일 틀">
<style>
:root{
  /* Jincerely 색: 크림 바탕 · 짙은 청록 글자 · 청록 포인트 · 연한 민트 */
  --bg:#fcfbf7; --card:#fff; --ink:#102d2d; --sub:#5f706d;
  --line:#e4e9e6; --soft:#f3f6f4;
  --honey:#0f6f6a; --honey-d:#0b5551; --honey-l:#ddedea; --honey-x:#f1f7f5;
  --p:#0f6f6a; --p-d:#0b5551; --p-l:#ddedea;
  --blue:#1b7671; --blue-l:#ddedea;
  --green:#2f7d5d; --green-l:#e4f2ea;
  --rose:#b5485a; --rose-l:#f9e6ea;
  --r:14px; --sh:0 1px 2px rgba(16,45,45,.04), 0 4px 16px rgba(16,45,45,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",system-ui,sans-serif;
  font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4{line-height:1.35;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
textarea,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}
code{font-family:inherit;background:var(--soft);border-radius:6px;padding:1px 6px;font-size:.92em}
/* 뼈대: 왼쪽 메뉴 + 본문 */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:#fff3c4;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex:0 0 auto}
.brand .logo img{width:100%;height:100%;object-fit:cover;display:none}
.brand .logo.has img{display:block} .brand .logo.has .bee{display:none}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-top:-2px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:10px;border-radius:10px;padding:9px 12px;font-size:14.5px;font-weight:600;color:var(--sub);text-align:left;transition:.12s;border-left:3px solid transparent}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-selected=true]{background:var(--honey-l);color:var(--p-d);border-left-color:var(--p)}
.tab .ic{font-size:16px;width:20px;text-align:center}
.side-foot{margin-top:auto;padding:0 6px}
.main{padding:28px 32px 90px;max-width:980px;width:100%}
@media (max-width:860px){
  .app{display:block}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:5;overflow:hidden}
  .brand{flex:0 0 auto} .brand small{display:none} .brand b{font-size:17px}
  .tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;white-space:nowrap;border-left:0;border-radius:999px;padding:7px 12px;font-size:13.5px;border:1px solid var(--line)}
  .tab[aria-selected=true]{border-color:var(--honey)}
  .side-foot{display:none}
  .main{padding:16px 16px 80px}
}
/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh);margin-bottom:16px}
.card h2{font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:-.01em}
.card .lead{color:var(--sub);font-size:14px;margin:0 0 14px}
.card.tint-p,.card.tint-peach,.card.tint-sky,.card.tint-lav,.card.tint-sun{background:#fff}
.hint{color:var(--sub);font-size:13px;margin:6px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--p);color:#fff;
  border-radius:10px;padding:10px 16px;font-weight:700;font-size:14.5px}
.btn:hover{background:var(--p-d)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cfd0cb}
.btn.sec:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.peach{background:var(--p);color:#fff} .btn.peach:hover{background:var(--p-d)}
.ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--sub)}
.ghost:hover{background:var(--soft);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--sub);text-align:left;transition:.12s}
.chip:hover{border-color:#bfc0ba;color:var(--ink)}
.chip[aria-pressed=true],.chip.lav[aria-pressed=true],.chip.sky[aria-pressed=true],.chip.sun[aria-pressed=true],.chip.peach[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 4px;color:var(--ink)}
label.f:first-child{margin-top:0}
.fh{font-size:13px;color:var(--sub);margin:-2px 0 6px}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid #d6d6d0;border-radius:10px;padding:9px 12px;background:#fff;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--honey);box-shadow:0 0 0 3px var(--honey-l)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0;vertical-align:middle}
.tag.p{background:var(--green-l);color:var(--green)} .tag.lav{background:var(--p-l);color:var(--p)}
.tag.sky{background:var(--blue-l);color:var(--blue)} .tag.sun{background:var(--honey-l);color:var(--honey-d)}
.tag.peach{background:var(--rose-l);color:var(--rose)} .tag.gray{background:var(--soft);color:var(--sub)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 처음 */
.hero{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.hero .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hero .big em{font-style:normal;color:var(--honey-d)}
.hero p{margin:4px 0 0;color:var(--sub);font-size:14.5px}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.home button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;transition:.12s}
.home button:hover{border-color:var(--honey);background:var(--honey-x)}
.home .ic{font-size:22px;display:block;margin-bottom:8px}
.home .t{font-weight:800;font-size:15.5px;display:block}
.home .d{font-size:13px;color:var(--sub);margin-top:3px;display:block}
.prog{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:14px}
.prog .bar{flex:1;height:8px;border-radius:999px;background:#e2e2dc;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--honey);border-radius:999px;transition:width .3s}
.prog .tx{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
/* 순서 */
.stepnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stepnav button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px 6px 6px;font-size:13.5px;font-weight:600;color:var(--sub)}
.stepnav button[aria-selected=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.stepnav button.done{border-color:#c9e4d6;color:var(--green)}
.stepnav .n{width:22px;height:22px;border-radius:50%;background:var(--soft);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);font-weight:800}
.stepnav button[aria-selected=true] .n{background:#fff;color:var(--ink)}
.stepnav button.done .n{background:var(--green);color:#fff}
.ck{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:#fff;transition:.12s}
.ck:hover{border-color:#c9c9c3}
.ck.on{background:#fafaf7;border-color:#e0e0da}
.ck input{display:none}
.ck .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid #c9c9c3;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink);transition:.12s}
.ck.on .box{background:var(--p);border-color:var(--p);color:#fff}
.ck .t{font-weight:700;font-size:14.5px}
.ck.on .t{color:var(--sub);text-decoration:line-through;text-decoration-color:#c9c9c3}
.ck .d{font-size:13.5px;color:var(--sub);margin-top:2px}
.ck .go{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-l);border-radius:999px;padding:1px 9px;margin-top:5px;margin-right:4px}
.tipbox{background:var(--honey-x);border:1px solid #cfe3de;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px}
.tipbox b{color:var(--honey-d)}
.tipbox li{margin:3px 0}
/* 서류 */
.doclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:5px}
.doc .ic{font-size:22px}
.doc .t{font-weight:800;font-size:15px}
.doc .m{font-size:13px;color:var(--sub)}
.doc .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:8px}
.doc.ready{border-color:#c9e4d6;background:#f8fcfa}
.pre{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.6;max-height:420px;overflow:auto;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(20,24,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:0}
.modal.on{display:flex}
.modal .in{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:900px;max-height:92vh;overflow:auto;padding:20px 22px 28px}
@media (min-width:700px){.modal{align-items:center;padding:20px}.modal .in{border-radius:18px}}
/* 자료 */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.lk{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-decoration:none;color:inherit;transition:.12s}
.lk:hover{border-color:var(--honey);background:var(--honey-x)}
.lk .t{font-weight:800;font-size:14.5px;color:var(--ink)}
.lk .d{font-size:13px;color:var(--sub);margin-top:2px}
.lk .n{font-size:12.5px;color:var(--honey-d);margin-top:4px}
h3.sec{font-size:14px;font-weight:800;margin:20px 0 8px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em}
.stdrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.stdrow:first-child{border-top:0}
.stdrow code{flex:0 0 auto;font-weight:800;color:var(--p);background:var(--p-l);border-radius:6px;padding:1px 7px;font-size:12.5px;margin-top:2px}
.stdrow .tx{flex:1}
.stdrow .cp{flex:0 0 auto}
/* 주제 */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:16px}
.pj{text-align:left;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;transition:.12s;display:flex;flex-direction:column;gap:4px}
.pj:hover{border-color:var(--honey);background:var(--honey-x)}
.pj .ic{font-size:24px}
.pj .t{font-weight:800;font-size:15px}
.pj .en{font-size:12.5px;color:var(--sub);font-weight:600}
.pj .q{font-size:13.5px;color:var(--sub);margin-top:2px}
.pj .tags{margin-top:6px}
.pj .score{font-size:12px;font-weight:800;color:var(--honey-d);margin-left:auto}
.pj.best{border-color:var(--honey);box-shadow:0 0 0 3px var(--honey-l)}
.flow{counter-reset:f;margin:8px 0 0;padding:0;list-style:none}
.flow li{position:relative;padding:6px 0 8px 36px;border-left:2px solid var(--line);margin-left:12px}
.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:-13px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--p);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.flow li b{display:block;font-size:14px}
.flow li span{font-size:13px;color:var(--sub)}
/* 파트너 */
.ask{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff}
.ask .q{font-weight:700;font-size:14.5px}
.ask .w{font-size:13.5px;color:var(--sub);margin-top:2px}
.ask .en{font-size:13.5px;color:var(--blue);margin-top:6px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ask .en i{font-style:normal;flex:1;min-width:200px}
.tz{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tz th,.tz td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.tz th{background:var(--soft);font-weight:700;font-size:13px}
.tz td.ok{background:var(--honey-x);color:var(--honey-d);font-weight:700}
.tz td.no{color:#b3b3ad}
.cinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px}
.cinfo div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.cinfo div b{display:block;font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:2px}
.cinfo .wide{grid-column:1/-1}
/* 메일 */
.mailkinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.out{position:relative}
.out textarea{min-height:320px;font-size:14px;line-height:1.6}
.phr{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.phr:first-child{border-top:0}
.phr .en{flex:1}
.phr .ko{flex:1;color:var(--sub);font-size:13px}
.foot{color:var(--sub);font-size:12.5px;margin-top:30px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo" id="logo"><img src="globee.png" alt="" onerror="this.parentNode.classList.remove('has')" onload="this.parentNode.classList.add('has')"><span class="bee">🐝</span></span><div><b id="appName"></b><small id="appSub"></small></div></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="side-foot"><button class="ghost" id="btnReset" title="이 기기에 저장된 체크·입력을 지웁니다">기록 지우기</button></div>
  </aside>
  <main class="main">
    <div id="view"></div>
    <div class="foot" id="foot"></div>
  </main>
</div>
<div class="modal" id="modal" role="dialog"><div class="in" id="modalIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ★ 선생님이 고치는 곳은 여기부터 "데이터 끝"까지입니다.
   이름·문구·주소를 바꾸고 저장하면 바로 반영됩니다. (따옴표와 쉼표만 지켜 주세요)
   ===================================================================== */
const APP_NAME = 'Globee';
const APP_SUB  = '초등 국제교류 길잡이';
const SAVE_KEY = 'globee-v1';   // 이 기기 브라우저에 체크·입력이 저장되는 이름. 바꾸면 기록이 사라집니다.
const UPDATED  = '2026-10-30';

/* ---------- 탭 ---------- */
const TABS = [
  {id:'home',  ic:'⌂', t:'처음'},
  {id:'steps', ic:'🧭', t:'순서'},
  {id:'docs',  ic:'📁', t:'서류함'},
  {id:'links', ic:'🔗', t:'자료·성취기준'},
  {id:'topic', ic:'💡', t:'주제 찾기'},
  {id:'partner', ic:'🤝', t:'파트너교'},
  {id:'mail',  ic:'✉️', t:'메일 틀'},
];

/* ---------- 🧭 순서: 단계와 체크리스트 ----------
   go:'docs:consent' 처럼 적으면 체크 항목에 바로가기 단추가 붙습니다.
   (docs:서류id / links / topic / partner / mail:메일종류id) */
const STEPS = [
 {id:'why', ic:'🎯', t:'왜·무엇을 할지 정하기', lead:'교류의 모양을 한 문장으로 잡아 두면 뒤의 모든 결정이 쉬워져요.',
  items:[
   {t:'아이들이 교류로 무엇을 얻었으면 하는지 한 문장으로 적기', d:'예: "다른 나라 친구에게 우리 동네를 소개하고, 질문을 주고받으며 다름을 즐기게 하고 싶다"'},
   {t:'학년군·교과·기간·형태 정하기', d:'비동기(영상·글 주고받기) / 실시간(화상) / 혼합. 처음이라면 비동기로 작게 시작하는 게 편해요.', go:'topic'},
   {t:'우리 반 여건 살피기', d:'기기 수, 인터넷, 아이들 영어 수준, 쓸 수 있는 수업 시간(교과·창체)'},
   {t:'아이들과 "어느 나라와 할까" 이야기 나누기', d:'The True Size로 크기 비교, Radio Garden으로 소리 듣기. 파트너가 정해지기 전이라도 세계에 눈을 뜨게 해 줘요.', go:'links:kids'},
   {t:'닿는 성취기준 2~3개 고르기', d:'계획서·평가·보고서에 그대로 쓸 수 있어요.', go:'links'},
  ],
  tips:['실시간 화상은 시차·기술 문제가 많아요. 한 학기에 한 번쯤이면 충분하고, 나머지는 영상 편지·패들렛으로도 충분히 깊어져요.',
        '목표는 "영어 실력"보다 "질문하고 답하는 경험"에 두면 아이들도 선생님도 덜 부담스러워요.']},
 {id:'school', ic:'🏫', t:'학교 안에서 먼저', lead:'관리자·담당 선생님과 먼저 맞춰 두면 나중에 되돌아갈 일이 줄어요.',

function goChip(go){
  const [tab, x] = go.split(':');
  const lab = {docs:'서류함', links:'자료', topic:'주제 찾기', partner:'파트너교', mail:'메일 틀'}[tab] || tab;

  return `<button class="go" data-go="${tab}" data-extra="${x||''}">${lab}${esc(sub)} →</button>`;
}

/* ---------- 💡 주제 찾기 ---------- */
function scoreProject(p){
  const t = S.topic; let s = 0, why = [];
  if(!p.band.includes(S.band)) return {s:-1, why};
  t.ib.forEach(x=>{ if(p.ib.includes(x)) { s+=2; why.push('IB'); } });
  (t.ic||[]).forEach(x=>{ if((p.ic||[]).includes(x)) { s+=2; why.push('인천형'); } });
  t.gced.forEach(x=>{ if(p.gced.includes(x)) { s+=2; why.push('세계시민'); } });
  t.sdg.forEach(x=>{ if(p.sdg.includes(x)) { s+=2; why.push('SDG'); } });
  t.subj.forEach(x=>{ if(p.subj.includes(x)) { s+=1; why.push('교과'); } });
  if(t.mode){ if(p.mode===t.mode || p.mode==='both') s+=1; else s-=1; }
  if(t.len){ if(p.len===t.len) s+=1; }
  return {s, why:[...new Set(why)]};
}
function weave(q){
  const STOP = ['우리','나의','내','수업','활동','프로젝트','하기','만들기','알아보기','함께','반','에서','으로','대한','관련','그리고'];
  const words = q.split(/[\s,·/+]+/).map(w=>w.trim().replace(/(을|를|이|가|은|는|의|에|로|와|과)$/,'')).filter(w=>w.length>=1 && !STOP.includes(w));
  const keys = new Set();
  words.forEach(w=>{ keys.add(w); Object.keys(SYN).forEach(k=>{ if(w.includes(k)||k.includes(w)) SYN[k].forEach(x=>keys.add(x)); }); });
  const list = Object.keys(STD).filter(c=>bandOf(c)===S.band).map(c=>{ let sc=0; keys.forEach(k=>{ if(k.length>=1 && STD[c].includes(k)) sc+= (words.includes(k)?3:1); }); return {c,sc}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  return list.slice(0,10);
}

      <div><label class="f">흐름 (우리 반에 맞게 줄이거나 늘려요)</label><ol class="flow">${flow}</ol></div>
      <div><label class="f">한 줄 목표</label><div class="pre" style="max-height:none">${esc(p.goalKo)}<br><span style="color:var(--sub)">to ${esc(p.goalEn)}</span></div>
           <label class="f">산출물</label><div class="pre" style="max-height:none">${esc(p.out)}</div>
           <label class="f">형태·길이</label><div><span class="tag gray">${MODES[p.mode]}</span><span class="tag gray">${LENS[p.len]}</span></div></div>
    </div>
    <label class="f">닿는 성취기준</label>
    <div>${stds}</div>
    <div class="row" style="margin-top:14px">
      <button class="btn peach" data-tomail="${p.id}">이 주제로 메일 틀 만들기</button>
      <button class="btn sec" data-copy="${esc(summary)}">계획서용으로 복사</button>
    </div>
  </section>`;
}

/* ---------- 🤝 파트너교 ---------- */
function viewPartner(){
  const groups = PARTNER.map(g=>`<h3 class="sec">${esc(g.c)}</h3>${g.list.map(a=>`<div class="ask"><div class="q">${esc(a.q)}</div><div class="w">${esc(a.w)}</div><div class="en"><i>“${esc(a.en)}”</i><button class="ghost" data-copy="${esc(a.en)}">복사</button></div></div>`).join('')}`).join('');
  const allQ = PARTNER.flatMap(g=>g.list.map(a=>'- '+a.en)).join('\n');
  const off = Number(S.tz)||0;
  const ci = COUNTRIES.find(c=>c[1]===off && (S.tzName? c[0]===S.tzName : true)) || COUNTRIES.find(c=>c[1]===off) || COUNTRIES[0];
  const hours = [9,10,11,12,13,14,15];
  let okCount = 0;
  const tzRows = hours.map(h=>{ let ph = h+off; let day=''; if(ph>=24){ph-=24; day=' (+1일)';} if(ph<0){ph+=24; day=' (−1일)';} const ok = ph>=8 && ph<=16; if(ok) okCount++; const lab = Number.isInteger(ph) ? String(ph).padStart(2,'0')+':00' : String(Math.floor(ph)).padStart(2,'0')+':'+String(Math.round((ph%1)*60)).padStart(2,'0'); return `<tr><td>${h}:00</td><td class="${ok?'ok':'no'}">${lab}${day}${ok?' ✓':''}</td></tr>`; }).join('');
  const tzNote = okCount ? `<p class="hint">겹치는 시간이 ${okCount}칸 있어요. 실시간 만남은 이 시간대에, 나머지는 비동기로 하면 돼요.</p>` : `<p class="hint">겹치는 수업 시간이 없어요. 이럴 땐 영상·글을 주고받는 비동기 교류가 답이에요. 꼭 실시간으로 만나고 싶다면 한쪽이 방과 후나 아침 시간을 내야 해요.</p>`;
  return `
  <section class="card tint-sun">
    <h2>파트너교와 매칭됐을 때</h2>
    <p class="lead">먼저 알아 두면 좋은 것들이에요. 영어 문장은 그대로 복사해 메일에 붙여도 돼요.</p>
    <p><button class="btn sec sm" data-copy="${esc(allQ)}">질문 전부 복사 (영어)</button></p>
    ${groups}
  </section>
  <section class="card">
    <h2>파트너교 나라 한눈에</h2>
    <p class="lead">나라를 고르면 수도·언어·화폐·인사말과 시차 표가 나와요. 아이들에게 먼저 보여 주기 좋아요. 서머타임은 반영하지 않았으니 날짜에 따라 1시간 차이가 날 수 있어요.</p>
    <select id="tzsel">${COUNTRIES.map((c,i)=>`<option value="${i}" ${c[0]===ci[0]?'selected':''}>${esc(c[0])} (한국 ${c[1]>=0?'+':''}${c[1]}시간)</option>`).join('')}</select>
    <div class="cinfo"><div><b>수도</b>${esc(ci[2])}</div><div><b>언어</b>${esc(ci[3])}</div><div><b>화폐</b>${esc(ci[4])}</div><div><b>인사말</b>${esc(ci[5])}</div>${ci[6]?`<div class="wide"><b>참고</b>${esc(ci[6])}</div>`:''}</div>
    <div class="row" style="margin-top:8px"><button class="ghost" data-copy="${esc(`${ci[0]} — 수도 ${ci[2]} · 언어 ${ci[3]} · 화폐 ${ci[4]} · 인사말 ${ci[5]} · 한국과 시차 ${ci[1]>=0?'+':''}${ci[1]}시간`)}">나라 정보 복사</button></div>
    <table class="tz"><tr><th>한국(인천) 시간</th><th>파트너교 시간</th></tr>${tzRows}</table>${tzNote}
    <p class="hint">정확한 시간은 <a href="https://www.timeanddate.com/worldclock/meeting.html" target="_blank" rel="noopener">timeanddate 회의 시간 찾기</a>에서 두 도시를 넣어 확인해 보세요.</p>
  </section>`;
}

/* ---------- ✉️ 메일 틀 ---------- */
function mailFill(txt){
  const f = S.mail.f, p = PROJECTS.find(x=>x.id===S.pick);
  const m = {
    name: f.name||'{이름}', school: f.school||'{학교}', grade: f.grade||'{학년}', n: f.n||'{학생 수}', email: f.email||'{이메일}',
    partner: f.partner||'{파트너 선생님}', pschool: f.pschool||'{파트너교}', where: f.where||'{알게 된 곳}',
    project: f.project||(p?p.en:'{프로젝트}'), goal: f.goal||(p?(S.mail.lang==='ko'?p.goalKo:p.goalEn):'{목표}'),
    period: f.period||'{기간}', platform: f.platform||'Padlet', date: f.date||'{날짜}', link: f.link||'{링크}',
    ktime: f.ktime||'{한국 시간}', ptime: f.ptime||'{그쪽 시간}', ttime: f.ttime||'{테스트 시간}', memory: f.memory||'{아이들 말}', reason: f.reason||'{사정}',
  };
  if(S.mail.lang==='ko' && p && !f.project) m.project = p.t;
  return txt.replace(/\{(\w+)\}/g, (_,k)=> m[k]!==undefined ? m[k] : '{'+k+'}');
}
function viewMail(){
  const k = MAIL_KINDS.find(m=>m.id===S.mail.kind) || MAIL_KINDS[0];
  const f = S.mail.f, p = PROJECTS.find(x=>x.id===S.pick);
  const lang = S.mail.lang;
  const body = mailFill(lang==='ko'?k.ko:k.en);
  const subj = mailFill(k.sub);
  const inp = (key, lab, ph) => `<div><label class="f">${lab}</label><input type="text" data-mf="${key}" value="${esc(f[key]||'')}" placeholder="${esc(ph||'')}"></div>`;
  const needs = (k.en.match(/\{(\w+)\}/g)||[]).map(s=>s.slice(1,-1));
  const extra = [['where','알게 된 곳','예: ePals / a colleague'],['date','날짜','예: March 12'],['link','링크','패들렛 주소'],['ktime','한국 시간','예: 10:00'],['ptime','그쪽 시간','예: 18:00 (previous day)'],['ttime','테스트 시간','예: 10:00'],['memory','아이들이 기억하는 것','예: the song you taught us'],['reason','늦은 사정','예: a school festival']].filter(([key])=>needs.includes(key));
  const phrases = PHRASES.map(g=>`<h3 class="sec">${esc(g.c)}</h3>${g.list.map(([en,ko])=>`<div class="phr"><span class="en">${esc(en)}</span><span class="ko">${esc(ko)}</span><button class="ghost" data-copy="${esc(en)}">복사</button></div>`).join('')}`).join('');
  return `
  <section class="card tint-peach">
    <h2>메일·쪽지 틀</h2>
    <p class="lead">종류를 고르고 빈칸을 채우면 아래 글이 바로 바뀌어요. 안 채운 칸은 { }로 남으니 복사한 뒤 고쳐도 돼요. ${p?`지금 고른 주제: <b>${p.ic} ${esc(p.t)}</b>`:'<b>주제 찾기</b>에서 프로젝트를 고르면 제목과 목표가 저절로 들어가요.'}</p>
    <div class="mailkinds">${MAIL_KINDS.map(m=>`<button class="chip peach" aria-pressed="${m.id===k.id}" data-mk="${m.id}">${esc(m.t)}</button>`).join('')}</div>
    <div class="chips"><button class="chip" aria-pressed="${lang==='en'}" data-ml="en">영어</button><button class="chip" aria-pressed="${lang==='ko'}" data-ml="ko">한국어</button></div>
    <div class="grid2" style="margin-top:6px">
      ${inp('name','내 이름 (영문)','예: Yejin Lee')}
      ${inp('school','학교 (영문)','예: Incheon Singeomdan Elementary School')}
      ${inp('grade','학년','예: 6')}
      ${inp('n','학생 수','예: 25')}
      ${inp('email','내 이메일','교육청 계정 추천')}
      ${inp('partner','파트너 선생님 이름','예: Ms. Garcia')}
      ${inp('project','프로젝트 제목','비우면 고른 주제가 들어가요')}
      ${inp('goal','목표 한 줄','비우면 고른 주제의 목표가 들어가요')}
      ${inp('period','기간','예: March to May 2027')}
      ${inp('platform','플랫폼','예: Padlet')}
      ${extra.map(([key,lab,ph])=>inp(key,lab,ph)).join('')}
    </div>
  </section>
  <section class="card">
    <label class="f">제목</label>
    <div class="row"><input type="text" id="mailSubj" value="${esc(subj)}" readonly style="flex:1"><button class="ghost" data-copy="${esc(subj)}">복사</button></div>
    <label class="f">본문 (고쳐도 돼요)</label>
    <div class="out"><textarea id="mailBody">${esc(body)}</textarea></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="copyMail">본문 복사</button><button class="btn sec" id="copyMailAll">제목+본문 복사</button></div>
  </section>
  <section class="card">
    <h2>자주 쓰는 표현</h2>
    <p class="lead">한 줄씩 복사해서 끼워 넣어요.</p>
    ${phrases}
  </section>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('button,a'); if(!b) return;
  if(b.dataset.go){ go(b.dataset.go, b.dataset.extra); return; }
  if(b.dataset.step){ S.step=b.dataset.step; save(); render(); return; }
  if(b.dataset.doc){ openDoc(b.dataset.doc); return; }
  if(b.hasAttribute('data-close')){ closeModal(); return; }
  if(b.dataset.copydoc){ const d=DOCS.find(d=>d.id===b.dataset.copydoc); copy(d.tpl, '복사했어요. 한글이나 문서에 붙여 넣으세요'); return; }
  if(b.dataset.dl){ const d=DOCS.find(d=>d.id===b.dataset.dl); const blob=new Blob(['﻿'+d.tpl],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=d.t.replace(/[\\/:*?"<>|]/g,'')+'.txt'; a.click(); return; }
  if(b.dataset.ready){ S.docReady[b.dataset.ready]=!S.docReady[b.dataset.ready]; save(); render(); return; }
  if(b.dataset.band){ S.band=b.dataset.band; save(); render(); return; }
  if(b.dataset.subj!==undefined){ S.stdSubj=b.dataset.subj; save(); render(); return; }
  if(b.dataset.copy!==undefined){ copy(b.dataset.copy); return; }
  if(b.dataset.copyall){ const codes=Object.keys(STD).filter(c=>bandOf(c)===S.band && (!S.stdSubj||subjOf(c)===S.stdSubj) && (!(S.stdq||'').trim() || c.includes(S.stdq.trim()) || STD[c].includes(S.stdq.trim()))); copy(codes.map(stdLine).join('\n')); return; }
  if(b.dataset.tk){ const arr=S.topic[b.dataset.tk]; const v=b.dataset.tk==='sdg'?Number(b.dataset.tv):b.dataset.tv; const i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); save(); render(); return; }
  if(b.dataset.tone){ const k=b.dataset.tone; S.topic[k] = S.topic[k]===b.dataset.tv ? '' : b.dataset.tv; save(); render(); return; }
  if(b.dataset.topicclear){ S.topic={ib:[],ic:[],gced:[],sdg:[],subj:[],mode:'',len:''}; save(); render(); return; }
  if(b.dataset.pick!==undefined){ S.pick=b.dataset.pick; save(); render(); if(S.pick){ const el=$('#pickCard'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
  if(b.dataset.tomail){ S.pick=b.dataset.tomail; S.mail.f.project=''; S.mail.f.goal=''; go('mail','intro'); toast('주제를 메일 틀에 넣었어요'); return; }
  if(b.dataset.mk){ S.mail.kind=b.dataset.mk; save(); render(); return; }
  if(b.dataset.ml){ S.mail.lang=b.dataset.ml; save(); render(); return; }
  if(b.id==='weaveGo'){ S.weaveQ=$('#weaveQ').value; S.weaveSel=[]; save(); render(); return; }
  if(b.dataset.copyel){ copy($('#'+b.dataset.copyel).value); return; }
  if(b.id==='copyMail'){ copy($('#mailBody').value); return; }
  if(b.id==='copyMailAll'){ copy('Subject: '+$('#mailSubj').value+'\n\n'+$('#mailBody').value); return; }
  if(b.id==='btnReset'){ if(confirm('이 기기에 저장된 체크·입력을 모두 지울까요?')){ localStorage.removeItem(SAVE_KEY); S=load(); render(); toast('지웠어요'); } return; }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.wsel){ S.weaveSel=S.weaveSel||[]; const i=S.weaveSel.indexOf(t.dataset.wsel); if(t.checked&&i<0) S.weaveSel.push(t.dataset.wsel); if(!t.checked&&i>=0) S.weaveSel.splice(i,1); save(); render(); return; }
  if(t.dataset.ck){ S.done[t.dataset.ck]=t.checked; if(!t.checked) delete S.done[t.dataset.ck]; save(); render(); return; }
  if(t.id==='tzsel'){ const c=COUNTRIES[Number(t.value)]; S.tz=c[1]; S.tzName=c[0]; save(); render(); return; }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.mf){ S.mail.f[t.dataset.mf]=t.value; save(); const k=MAIL_KINDS.find(m=>m.id===S.mail.kind); $('#mailBody').value=mailFill(S.mail.lang==='ko'?k.ko:k.en); $('#mailSubj').value=mailFill(k.sub); return; }
  if(t.id==='stdq'){ S.stdq=t.value; save(); clearTimeout(t._x); t._x=setTimeout(()=>{ render(); const q=$('#stdq'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} },250); }
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter' && e.target.id==='weaveQ'){ $('#weaveGo').click(); } });
/* 주소로 바로 열기: #steps / #docs / #topic ... */
(function(){ const h=location.hash.replace('#',''); if(TABS.some(t=>t.id===h)) S.tab=h; })();
render();
</script>
</body>
