      const sc = a.glossary ? Object.assign({}, scope, { glossary: (scope.glossary || []).concat(a.glossary) }) : scope;
      const bodyId = (idPrefix || 'article') + '-body-' + i;
      const body = el('div', { className: 'news-body', id: bodyId, hidden: !pick },
        el('p', { className: 'key-guide', text: pick ? D.evidenceUi.pickGuide : D.ui.keyLineGuide }),
        el('div', { className: 'news-text' }, articleParagraphs(a, sc, pick)),
        footnotes(a.terms, sc)
      );
      const head = el('button', { type: 'button', className: 'news-head', 'aria-expanded': String(!!pick), 'aria-controls': bodyId },
        el('span', { className: 'news-paper', 'aria-hidden': 'true', text: a.label ? '📊' : '📰' }),
        el('span', { className: 'news-title' }, markTerms(a.title, a.terms, sc, false)),
        el('span', { className: 'news-toggle', 'aria-hidden': 'true', text: '▼' })
      );
      // 읽는 중 표시: 빠르게 읽는 속도로도 걸리는 시간만큼 펼쳐 두어야 '읽음'이 돼요
      const progBar = el('i');
      const prog = el('span', { className: 'read-progress', hidden: true },
        el('b', { text: D.ui.readingLabel }), el('span', { className: 'read-bar' }, progBar));
      const card = el('article', { className: 'news-card' + (a.label ? ' deep-card' : '') + (pick ? ' is-open' : '') + (readList && readList.includes(i) ? ' is-read' : '') },
        el('span', { className: 'read-stamp', text: D.ui.readStamp }),
        prog, head, body
      );
      const floorMs = onRead ? readFloorMs(a) : 0;
      let spent = 0, ticking = false;
      // 화면에 보이는 기사만 시간이 가요 (여러 개를 한꺼번에 펼쳐 놓고 기다리기만 하면 안 되게)
      // (보이는지 알려 주는 기능이 없거나 소식이 없으면 '보인다'고 쳐서, 어떤 기기에서도 멈춰 버리지 않게)
      let inView = true, ioHeard = false;
      if (floorMs && 'IntersectionObserver' in window) {
        new IntersectionObserver((entries) => { entries.forEach((en) => { ioHeard = true; inView = en.isIntersecting; }); }, { threshold: 0.15 }).observe(body);
      }
      const counting = () => (!ioHeard || inView) && document.visibilityState !== 'hidden';   // 다른 탭을 보는 동안은 멈춤
      function startReading() {
        if (!floorMs) { onRead(i, card); return; }
        if (ticking) return;
        ticking = true;
        prog.hidden = false;
        let last = Date.now();
        (function step() {
          if (body.hidden) { ticking = false; return; }   // 접으면 잠깐 멈춰요(다시 펼치면 이어서)
          const now = Date.now();
          if (counting()) spent += now - last;
          last = now;
          progBar.style.width = Math.min(100, spent / floorMs * 100) + '%';
          if (spent >= floorMs) { ticking = false; prog.hidden = true; onRead(i, card); return; }
          later(step, 250);
        })();
      }
      head.addEventListener('click', () => {
        const open = body.hidden;
        body.hidden = !open;
        card.classList.toggle('is-open', open);
        head.setAttribute('aria-expanded', String(open));
        if (open && onRead && !(readList && readList.includes(i))) startReading();
      });
      return card;
    });
  }

  // 이 기사를 '읽음'으로 치려면 펼쳐 두어야 하는 시간 (테스트 모드에서는 바로)
  function readFloorMs(a) {
    if (!savingEnabled) return 0;
    const F = D.settings.readFloor;
    if (!F || !F.charsPerSec) return 0;
    const chars = (String(a.title || '') + bodyText(a.body)).replace(/\s/g, '').length;
    return Math.round(Math.min(F.maxSec, Math.max(F.minSec, chars / F.charsPerSec)) * 1000);
  }

  // 결정서에서 고른 문장이 이 회사의 "진짜 문제"를 보여 주는 문장인지
  function evidenceOk(R, sentence) {
    return (R.evidence || []).some((w) => sentence.indexOf(w) >= 0);
  }

  /* ---------- 라운드 화면 ---------- */
  function renderRound() {
    const R = roundData();
    const U = D.ui;
    const total = R.articles.length;
    const need = D.settings.articlesForCondition;

    const readCount = el('p', { className: 'read-count' });
    function updateReadCount() {
      readCount.textContent = U.articlesReadCount
        .replace('{읽은수}', state.readArticles.length)
        .replace('{전체수}', total);
    }
    updateReadCount();

    // 선택 버튼
    const investBtn = button(U.investButton, 'btn-coral', chooseInvest);
    const passBtn = button(U.passButton, 'btn-gray', choosePass);
    const condBtn = button(U.conditionButton, 'btn-green', chooseCondition);
    if (!conditionReady()) condBtn.classList.add('hidden');

    // 기사를 다 읽었는데 심화 자료가 남았으면 알려 줘요
    const deepHint = el('p', { className: 'deep-hint', text: D.deepUi.needDeep, hidden: true });
    function updateDeepHint() {
      deepHint.hidden = !(deepRequired() && state.readArticles.length >= need && !state.deep.answered);
    }
    function tryUnlock() {
      updateDeepHint();
      if (conditionReady() && condBtn.classList.contains('hidden')) {
        condBtn.classList.remove('hidden');
        condBtn.classList.add('sparkle-in');
        fitSpacer();
        if (!state.conditionToastShown) {
          state.conditionToastShown = true;
          showToast(fill(D.lines.conditionOpened));
        }
      }
    }

    const panel = el('div', { className: 'choice-panel' },
      el('div', { className: 'choice-inner' },
        el('p', { className: 'choice-label', text: fill(D.lines.beforeChoice) }),
        el('div', { className: 'choice-buttons' }, investBtn, passBtn, condBtn)
      )
    );
    const spacer = el('div', { className: 'choice-spacer' });

    function markRead(index, card) {
      if (state.readArticles.includes(index)) return;
      state.readArticles.push(index);
      card.classList.add('is-read');
      updateReadCount();
      tryUnlock();
      save();
      checkReadBadge();
      phoneCheck(state.readArticles.length, 0);
    }

    app.appendChild(el('section', { className: 'screen round-screen' },
      statusBar(state.seeds, state.trust).node,
      speech(fill(D.lines.roundStart, R.company)),
      el('div', { className: 'company-card' },
        companyLogo(R),
        el('div', { className: 'company-info' },
          el('h2', { className: 'company-name', text: R.company }),
          el('p', { className: 'company-slogan', text: R.slogan }),
          R.site ? el('p', { className: 'company-site' },
            el('span', { text: D.ui.siteLabel + ' ' }), el('b', { text: R.site })) : null
        )
      ),
      readCount,
      el('div', { className: 'news-list' }, articleCards(R.articles, R, state.readArticles, markRead)),
      R.deep ? deepCard(R, tryUnlock) : null,
      deepHint,
      spacer
    ));
    app.appendChild(panel);

    function fitSpacer() { spacer.style.height = (panel.offsetHeight + 12) + 'px'; }
    fitSpacer();
    updateDeepHint();

    // 📱 기사를 읽다 보면 문자가 와요 (안 읽어도 fallbackSec 초마다 한 단계씩)
    if (D.phone) {
      phoneCheck(state.readArticles.length, 0);
      const sec = D.phone.fallbackSec || 15;
      [1, 2].forEach((k) => later(() => phoneCheck(state.readArticles.length, k), sec * k * 1000));
    }
  }

  function deepRequired() { const R = roundData(); return !!(D.settings.deepForCondition && R && R.deep); }
  function conditionReady() {
    return state.readArticles.length >= D.settings.articlesForCondition && (!deepRequired() || state.deep.answered);
  }

  /* ---------- 📊 심화 자료 카드 (조금 어려운 기사 + 확인 문제 1개) ----------
     끝까지 읽으면(읽는 중 표시가 다 차면) 확인 문제가 열려요. 틀리면 도움말을 보고 다시 골라요. */
  function deepCard(R, onSolved) {
    const d = R.deep;
    const U = D.deepUi;
    const st = state.deep;
    const checkBox = el('div', { className: 'deep-check' });

    const card = articleCards([d], R, st.read ? [0] : [], (i, c) => {
      if (st.read) return;
      st.read = true;
      c.classList.add('is-read');
      save();
      checkReadBadge();
      drawCheck();
    }, 'deep')[0];
    card.classList.add('deep-card');
    const head = card.querySelector('.news-head');
    head.insertBefore(el('span', { className: 'deep-tag', text: U.tag }), head.querySelector('.news-toggle'));
    card.insertBefore(el('p', { className: 'deep-label', text: d.label }), card.querySelector('.news-head'));
    card.querySelector('.news-body').appendChild(checkBox);

    function drawCheck() {
      checkBox.textContent = '';
      if (!st.read) { checkBox.appendChild(el('p', { className: 'deep-locked', text: U.locked })); return; }
      const q = d.check;
      if (!st.order) { st.order = shuffle(q.choices.map((_, k) => k)); save(); }
      checkBox.appendChild(el('p', { className: 'deep-question' }, el('b', { text: U.checkTitle + ' ' }), q.question));
      if (st.answered) {
        const right = q.choices.find((c) => c.correct);
        checkBox.appendChild(el('p', { className: 'deep-answer', text: '✅ ' + right.text }));
        checkBox.appendChild(el('p', { className: 'deep-explain', text: q.explain + ' ' + U.done }));
        return;
      }
      checkBox.appendChild(el('div', { className: 'deep-choices' },
        st.order.map((k, n) => {
          const tried = st.wrong.includes(k);
          return el('button', {
            type: 'button', className: 'condition-card deep-choice' + (tried ? ' is-tried' : ''), disabled: tried,
            onClick: guarded(() => {
              if (st.answered || st.wrong.includes(k)) return;
              if (q.choices[k].correct) {
                st.answered = true;
                state.deepResults[state.round] = st.wrong.length === 0;   // 한 번에 맞혔는지
                save();
                if (st.wrong.length === 0 && state.round === 4) awardBadge('r4deep');
                drawCheck();
                onSolved();
              } else {
                st.wrong.push(k);
                save();
                drawCheck();
              }
            })
          },
            el('span', { className: 'condition-num', 'aria-hidden': 'true', text: tried ? '✗' : String(n + 1) }),
            el('span', { className: 'condition-text', text: q.choices[k].text }));
        })
      ));
      if (st.wrong.length) checkBox.appendChild(el('p', { className: 'deep-hint-text', role: 'status', text: '💡 ' + q.hint }));
    }
    drawCheck();
    return card;
  }

  // 기사 본문: [[문장, 문장], [문장]] → 문단마다 <p>, 문장은 띄어쓰기로 이어요
  function bodyText(body) {
    if (!Array.isArray(body)) return String(body);
    return body.map((p) => (Array.isArray(p) ? p.join(' ') : String(p))).join('\n\n');
  }

  /* 문단마다 "핵심 문장" 하나에 형광펜 (학생 설문: 기사가 길다 → 빠르게 훑어 읽기)
     - 기본은 문단의 첫 문장(신문 기사는 첫 문장에 핵심을 적어요)
     - 문장이 하나뿐인 문단은 표시하지 않아요(전부 칠하면 의미가 없어서)
     - data.js 기사에 keys: [문단마다 문장 번호(0부터), 없으면 -1] 를 적으면 그걸 따라요
     문장 글자는 한 글자도 바꾸지 않아요. 어려운 말 밑줄은 기사 전체에서 처음 나온 곳 한 번만. */
  function articleParagraphs(a, scope, pick) {
    const used = new Set();
    const paras = Array.isArray(a.body) ? a.body : [[String(a.body)]];
    return paras.map((para, pi) => {
      const sents = Array.isArray(para) ? para : [String(para)];
      let key = Array.isArray(a.keys) && typeof a.keys[pi] === 'number' ? a.keys[pi] : 0;
      if (sents.length < 2 && !(Array.isArray(a.keys) && typeof a.keys[pi] === 'number')) key = -1;
      const parts = [];
      sents.forEach((s, si) => {
        // 근거 고르기 모드에서는 어려운 말 밑줄을 누를 수 없게(문장 고르기와 겹치지 않게)
        const nodes = markTerms(s, a.terms, scope, !pick, used);
        let piece = si === key ? el('mark', { className: 'key-line' }, nodes) : el('span', {}, nodes);
        if (pick) {
          piece = el('span', { className: 'pick-sent' + (state.evidenceDraft === s ? ' is-picked' : ''), role: 'button', tabindex: '0', 'aria-label': D.evidenceUi.pickAria }, piece);
          const choose = () => {
            document.querySelectorAll('.pick-sent.is-picked').forEach((x) => x.classList.remove('is-picked'));
            piece.classList.add('is-picked');
            pick(s);
          };
          piece.addEventListener('click', choose);
          piece.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); } });
        }
        parts.push(piece);
        if (si < sents.length - 1) parts.push(' ');
      });
      return el('p', { className: 'news-para' }, parts);
    });
  }

  /* ---------- 어려운 말: 본문 밑줄(*) + 맨 아래 각주 ---------- */
  // 이벤트처럼 회사가 없는 곳에서 쓰는 뜻 찾기 범위(모든 라운드의 기획서 어려운 말 + 사전)
  const COMMON_SCOPE = { company: null, glossary: D.rounds.flatMap((r) => r.glossary) };

  function termMeaning(scope, word) {
    const g = (scope.glossary || []).find((x) => x.word === word); // 기획서의 어려운 말이 먼저
    if (g) return g.meaning;
    return D.words[word] || null;
  }

  function usableTerms(terms, scope) {
    return (terms || []).filter((w) => typeof w === 'string' && w.length > 0 && termMeaning(scope, w));
  }

  // 본문에서 각 낱말의 첫 번째 자리를 찾아 밑줄 버튼으로 바꿔요.
  // 회사 이름 안에 든 글자(예: '익명톡'의 '익명')는 건너뛰어요.
  // interactive=false 이면 누를 수 없는 밑줄만(기사 제목처럼 이미 버튼 안에 있을 때)
  // used: 여러 조각으로 나눠 부를 때 이미 밑줄 친 낱말(기사 전체에서 한 번만 표시)
  function markTerms(text, terms, scope, interactive, used) {
    if (interactive === undefined) interactive = true;
    const company = scope.company || '';
    const list = usableTerms(terms, scope).slice().sort((a, b) => b.length - a.length)
      .filter((w) => !(used && used.has(w)));
    const ranges = [];

    function insideCompany(at, end) {
      if (!company) return false;
      let c = text.indexOf(company);
      while (c >= 0) {
        if (at >= c && end <= c + company.length) return true;
        c = text.indexOf(company, c + 1);
      }
      return false;
    }

    for (const word of list) {
      let from = 0;
      while (true) {
        const at = text.indexOf(word, from);
        if (at < 0) break;
        const end = at + word.length;
        const overlaps = ranges.some((r) => at < r.end && end > r.start);
        if (!insideCompany(at, end) && !overlaps) { ranges.push({ start: at, end: end, word: word }); if (used) used.add(word); break; }
        from = at + 1;
      }
    }
    ranges.sort((a, b) => a.start - b.start);

    const nodes = [];
    let pos = 0;
    for (const r of ranges) {
      if (r.start > pos) nodes.push(text.slice(pos, r.start));
      if (!interactive) {
        nodes.push(el('span', { className: 'term is-static' }, text.slice(r.start, r.end), el('sup', { text: '*' })));
        pos = r.end;
        continue;
      }
      const termBtn = el('button', { type: 'button', className: 'term', 'data-word': r.word, 'aria-label': r.word + ': ' + termMeaning(scope, r.word) },
        text.slice(r.start, r.end), el('sup', { text: '*' }));
      termBtn.addEventListener('click', () => {
        const box = termBtn.closest('.news-body, .breaking, .event-feedback') || document;
        const note = [...box.querySelectorAll('.footnote')].find((n) => n.dataset.word === r.word);
        if (!note) return;
        note.classList.remove('is-flash');
        void note.offsetWidth;
        note.classList.add('is-flash');
        note.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
      nodes.push(termBtn);
      pos = r.end;
    }
    if (pos < text.length) nodes.push(text.slice(pos));
    return nodes;
  }

  function footnotes(terms, scope) {
    const list = usableTerms(terms, scope);
    if (!list.length) return null;
    // 풀이 상자를 눈에 띄게 (학생 설문: "풀이가 있는 줄 몰랐어요")
    return el('div', { className: 'footnote-box' },
      el('p', { className: 'footnote-title', text: D.ui.glossaryBoxTitle }),
      el('ul', { className: 'footnotes', 'aria-label': D.ui.glossaryTitle },
        list.map((w) => el('li', { className: 'footnote', 'data-word': w },
          el('span', { className: 'footnote-mark', 'aria-hidden': 'true', text: '*' }),
          el('b', { text: w }),
          ' — ' + termMeaning(scope, w)
        ))
      )
    );
  }

  // 조건부 투자가 열릴 때 잠깐 떠오르는 말풍선
  function showToast(text) {
    const old = document.querySelector('.toast:not(.msg-noti)');   // 문자 알림은 지우지 않아요
    if (old) old.remove();
    const toast = el('div', { className: 'toast', role: 'status', text: text });
    const panel = document.querySelector('.choice-panel');
    if (panel) toast.style.bottom = (panel.offsetHeight + 8) + 'px'; // 선택 버튼 바로 위
    document.body.appendChild(toast);
    later(() => toast.classList.add('is-out'), 3600);
    later(() => toast.remove(), 4100);
  }

  /* ---------- 선택 → 투자 결정서 ---------- */
  function chooseInvest() {
    if (state.screen !== 'round') return;
    if (state.readArticles.length < D.settings.articlesBeforeInvest) {
      showModal(el('p', { className: 'modal-text', text: fill(D.lines.readMore) }), [
        { label: D.ui.readMoreButton, className: 'btn-primary' },
        { label: D.ui.investAnywayButton, className: 'btn-coral', onClick: () => toDecision({ type: 'invest' }) }
      ]);
      return;
    }
    toDecision({ type: 'invest' });
  }

  function choosePass() {
    if (state.screen !== 'round') return;
    toDecision({ type: 'pass' });
  }

  function chooseCondition() {
    if (state.screen !== 'round') return;
    if (!conditionReady()) return;
    // 한 라운드 안에서는 같은 순서 유지(다른 선택 하기 후 다시 와도 헷갈리지 않게)
    if (!state.conditionOrder) state.conditionOrder = shuffle(roundData().conditions.map((_, i) => i));
    go('condition');
  }

  function pickCondition(index) {
    if (state.screen !== 'condition') return;
    toDecision({ type: 'condition', condition: index });
  }

  function toDecision(choice) {
    if (state.screen !== 'round' && state.screen !== 'condition') return;
    state.pendingChoice = choice;
    go('decision');
  }

  /* ---------- 조건 고르기 화면 ---------- */
  function renderCondition() {
    const R = roundData();
    const order = state.conditionOrder || R.conditions.map((_, i) => i);
    // ❓ 조건부 투자를 다시 설명해 주는 버튼 (학생 설문: 조건 고르기가 어려웠다는 의견 일부)
    const H = D.conditionHelp;
    const helpBtn = H ? button(H.button, 'btn-ghost condition-help', () => {
      showModal(el('div', { className: 'condition-help-box' },
        el('h2', { className: 'code-title', text: H.title }),
        el('p', { className: 'modal-text', text: fill(H.intro) }),
        el('ol', { className: 'condition-help-steps' }, H.steps.map((s) => el('li', { text: fill(s) })))
      ), [
        { label: H.reviewButton, className: 'btn-ghost', onClick: () => { if (state.screen === 'condition') go('round'); } },
        { label: H.closeButton, className: 'btn-primary' }
      ]);
    }) : null;

    app.appendChild(el('section', { className: 'screen condition-screen' },
      statusBar(state.seeds, state.trust).node,
      speech(fill(D.lines.chooseCondition, R.company)),
      el('div', { className: 'condition-company' }, companyLogo(R), el('span', { text: R.company }), helpBtn),
      el('div', { className: 'condition-list' },
        order.map((idx, n) => el('button', {
          type: 'button',
          className: 'condition-card',
          onClick: guarded(() => pickCondition(idx))
        },
          el('span', { className: 'condition-num', 'aria-hidden': 'true', text: String(n + 1) }),
          el('span', { className: 'condition-text', text: R.conditions[idx].text })
        ))
      ),
      // 결과를 보기 전까지는 다른 선택으로 바꿀 수 있어요 (결과 뒤에는 되돌릴 수 없음)
      button(D.ui.conditionBack, 'btn-ghost condition-back', () => {
        if (state.screen !== 'condition') return;
        go('round');
      })
    ));
  }

  /* ---------- 투자 결정서 화면 ---------- */
  function renderDecision() {
    const R = roundData();
    const X = D.decision;
    const pc = state.pendingChoice;
    if (!pc) { go('round'); return; }

    const choiceName = pc.type === 'condition'
      ? X.choiceNames.condition + ' — ' + R.conditions[pc.condition].text
      : X.choiceNames[pc.type];

    const area = el('textarea', {
      className: 'decision-input', id: 'decision-input', rows: '4',
      maxlength: String(X.maxLength), placeholder: (X.placeholders && X.placeholders[pc.type]) || X.placeholder
    });
    area.value = state.reasonDraft || '';
    const count = el('p', { className: 'decision-count' });
    const error = el('p', { className: 'decision-error', role: 'alert' });
    const submitBtn = button(X.submitButton, 'btn-primary btn-block', submit);

    // 🔍 근거 문장 고르기 — 조건부 투자는 꼭, 다른 선택은 골라도 되고 안 골라도 돼요
    const EV = D.evidenceUi;
    const needEv = pc.type === 'condition' && D.settings.evidenceForCondition;
    const chip = el('div', { className: 'evidence-chip' });
    const evFeedback = el('p', { className: 'evidence-feedback', role: 'status' });
    function drawChip() {
      chip.textContent = '';
      const t = state.evidenceDraft;
      if (!t) {
        chip.appendChild(el('span', { className: 'evidence-empty', text: EV.empty }));
        evFeedback.textContent = '';
        evFeedback.className = 'evidence-feedback';
      } else {
        chip.appendChild(el('q', { className: 'evidence-quote', text: t }));
        chip.appendChild(button(EV.clearButton, 'btn-ghost evidence-clear', () => {
          state.evidenceDraft = '';
          document.querySelectorAll('.pick-sent.is-picked').forEach((x) => x.classList.remove('is-picked'));
          save(); drawChip();
        }));
        if (pc.type === 'condition') {
          const ok = evidenceOk(R, t);
          evFeedback.textContent = ok ? EV.good : EV.check;
          evFeedback.className = 'evidence-feedback ' + (ok ? 'is-good' : 'is-check');
        }
      }
      if (typeof update === 'function') update();
    }
    function pickSentence(s) {
      state.evidenceDraft = s;
      save();
      drawChip();
      error.textContent = '';
      evBox.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function update() {
      const len = charLength(area.value.trim());
      count.textContent = X.count.replace('{글자수}', len).replace('{최소}', X.minLength);
      count.classList.toggle('is-ok', len >= X.minLength);
      submitBtn.disabled = len < X.minLength || (needEv && !state.evidenceDraft);
    }
    area.addEventListener('input', () => {
      state.reasonDraft = area.value;
      error.textContent = '';
      update();
      save();
    });
    const evBox = el('div', { className: 'evidence-box' + (needEv ? ' is-required' : '') },
      el('p', { className: 'evidence-title' },
        el('b', { text: EV.title }), ' ', el('small', { text: needEv ? EV.requiredNote : EV.optionalNote })),
      el('p', { className: 'evidence-guide', text: EV.guide }),
      chip,
      evFeedback
    );
    update();
    drawChip();

    function submit() {
      if (state.screen !== 'decision') return;
      const reason = area.value.trim();
      if (needEv && !state.evidenceDraft) { error.textContent = EV.need; evBox.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
      if (charLength(reason) < X.minLength) { error.textContent = X.tooShort.replace('{최소}', X.minLength); return; }
      if (hasBannedWord(reason)) { error.textContent = X.bannedMessage; area.focus(); return; }
      finalizeChoice(reason);
    }

    app.appendChild(el('section', { className: 'screen decision-screen' },
      statusBar(state.seeds, state.trust).node,
      el('div', { className: 'card decision-card' },
        el('h2', { className: 'decision-title', text: X.title }),
        el('div', { className: 'decision-choice' },
          el('span', { className: 'decision-choice-label', text: X.myChoiceLabel }),
          el('b', { className: 'decision-choice-name decision-' + pc.type, text: choiceName })
        ),
        evBox,
        el('label', { className: 'decision-question', for: 'decision-input', text: X.question }),
        X.frameHint ? el('p', { className: 'decision-frame', text: X.frameHint }) : null,
        area,
        count,
        error,
        submitBtn
      ),
      // 근거를 고를 기사들(심화 자료 포함). 조건부 투자면 펼쳐진 채로 시작해요
      el('details', Object.assign({ className: 'decision-articles' }, needEv ? { open: true } : {}),
        el('summary', { text: needEv ? EV.articlesTitle : X.articlesTitle }),
        el('div', { className: 'news-list' },
          articleCards(R.articles.concat(R.deep ? [R.deep] : []), R, state.readArticles, null, 'review', pickSentence))
      ),
      button(X.backButton, 'btn-ghost condition-back', () => {
        if (state.screen !== 'decision') return;
        state.pendingChoice = null;
        go('round');
      })
    ));
  }

  function finalizeChoice(reason) {
    const R = roundData();
    const pc = state.pendingChoice;
    if (!pc) return;
    const s = scoreOf(R, pc.type, state.readArticles.length, pc.condition);
    if (pc.type === 'invest') state.pendingNews = state.round;
    const before = { seeds: state.seeds, trust: state.trust };
    state.seeds += s.seeds;
    state.trust = clampTrust(state.trust + s.trust);
    const ev = state.evidenceDraft || '';
    state.choices[state.round - 1] = {
      type: s.type,
      read: state.readArticles.length,
      condition: pc.type === 'condition' ? pc.condition : null,
      reason: reason,
      evidence: ev,                                   // 결정서에서 고른 근거 문장
      evidenceOk: ev ? evidenceOk(R, ev) : false       // 진짜 문제를 짚은 문장인지
    };
    state.evidenceDraft = '';
    checkChoiceBadges(R, state.choices[state.round - 1], pc);
    state.lastResult = {
      type: s.type, text: s.text,
      seedsBefore: before.seeds, trustBefore: before.trust,
      seedsDelta: s.seeds, trustDelta: s.trust
    };
    state.pendingChoice = null;
    state.reasonDraft = '';
    go('result');
  }

  /* ---------- 결과 화면 ---------- */
  function renderResult() {
    const R = roundData();
    const res = state.lastResult;
    if (!res) { go('round'); return; }
    const bar = statusBar(res.seedsBefore, res.trustBefore);

    function deltaChip(icon, label, delta) {
      const cls = delta > 0 ? 'is-up' : delta < 0 ? 'is-down' : 'is-same';
      return el('div', { className: 'delta-chip ' + cls },
        el('span', { 'aria-hidden': 'true', text: icon }),
        el('span', { text: label }),
        el('b', { text: signed(delta) })
      );
    }

    app.appendChild(el('section', { className: 'screen result-screen' },
      bar.node,
      el('div', { className: 'card result-card' },
        el('div', { className: 'delta-row' },
          deltaChip(D.ui.seedIcon, D.ui.seedLabel, res.seedsDelta),
          deltaChip(D.ui.trustIcon, D.ui.trustLabel, res.trustDelta)
        ),
        el('p', { className: 'result-text', text: fill(res.text, R.company) })
      ),
      learningCard(R.learning, state.round),
      button(D.ui.nextButton, 'btn-primary btn-block', afterResult)
    ));

    // 씨앗·신뢰지수 변화 애니메이션
    later(() => {
      const endSeeds = res.seedsBefore + res.seedsDelta;
      animateNumber(res.seedsBefore, endSeeds, 900, bar.setSeeds);
      animateNumber(res.trustBefore, state.trust, 900, bar.setTrust);
      if (res.seedsDelta !== 0) bar.seedNum.classList.add(res.seedsDelta > 0 ? 'flash-up' : 'flash-down');
      if (state.trust !== res.trustBefore) bar.trustNum.classList.add(state.trust > res.trustBefore ? 'flash-up' : 'flash-down');
    }, 300);
  }

  function afterResult() {
    if (state.screen !== 'result') return;
    if (state.pendingNews) showNews();
    else afterNews();
  }

  /* ---------- 속보 팝업 ---------- */
  function showNews() {
    const R = D.rounds[state.pendingNews - 1];
    const loss = R.invest.news.seeds;
    const from = state.seeds;
    const to = state.seeds + loss;
    const num = el('b', { className: 'news-seeds-num', text: formatNum(from) });

    const content = el('div', { className: 'breaking' },
      el('div', { className: 'breaking-band', text: D.ui.newsBanner }),
      el('p', { className: 'breaking-head', text: fill(D.lines.breakingNews, R.company) }),
      el('p', { className: 'breaking-text' }, markTerms(R.invest.news.text, R.invest.news.terms, R)),
      footnotes(R.invest.news.terms, R),
      el('div', { className: 'breaking-seeds' },
        el('span', { 'aria-hidden': 'true', text: D.ui.seedIcon }),
        num,
        el('span', { className: 'breaking-loss', text: signed(loss) })
      )
    );

    showModal(content, [
      { label: D.ui.okButton, className: 'btn-coral', onClick: () => {
        if (!state.pendingNews) return;
        state.seeds += loss;           // 속보 뒤에 손실 반영
        state.pendingNews = null;
        afterNews();
      } }
    ], 'modal-breaking');

    later(() => {
      num.classList.add('flash-down');
      animateNumber(from, to, 1100, (v) => { num.textContent = formatNum(v); });
    }, 500);
  }

  // 속보 다음: 이 라운드 뒤에 보너스 라운드·긴급 상황이 있으면 먼저, 없으면 다음 라운드
  function afterNews() {
    const ev = eventFor(state.round);
    if (ev && state.eventResults[ev.afterRound] === undefined) {
      state.eventOrder = null;
      state.eventRead = [];
      state.eventWrong = [];
      state.eventHint = null;
      go('event');
      return;
    }
    nextRound();
  }

  function nextRound() {
    if (state.round < D.rounds.length) { startRound(state.round + 1); return; }
    go('transition');
  }

  /* ==================================================================
     보너스 라운드 · 긴급 상황
     ================================================================== */
  // 이벤트별 결과 표시(이벤트에 따로 적힌 levels 가 먼저)
  function eventLevel(ev, level) {
    return (ev.levels && ev.levels[level]) || D.eventUi.levels[level] || D.eventUi.levels.none;
  }

  // 보너스 문제에서 오답 뒤에 정답을 찾았으면 'goodRetry' 로 보여줘요
  function eventLevelKey(ev, picked) {
    if (ev.quiz && picked.level === 'good' && state.eventRetried[ev.afterRound] && ev.levels && ev.levels.goodRetry) return 'goodRetry';
    return picked.level;
  }

  let eventJustLost = 0; // 방금 이벤트에서 잃은 씨앗(숫자 줄어드는 애니메이션용)

  function renderEvent() {
    const ev = eventFor(state.round);
    if (!ev) { nextRound(); return; }
    const E = D.eventUi;
    const answered = state.eventResults[ev.afterRound] !== undefined;
    const lost = eventJustLost;
    eventJustLost = 0;
    const bar = statusBar(state.seeds - lost, state.trust);
    if (!state.eventOrder) { state.eventOrder = shuffle(ev.choices.map((_, i) => i)); save(); }

    // 채팅 화면
    let phone = null;
    if (ev.messages) {
      let who = null;
      const bubbles = ev.messages.map((m, i) => {
        const showName = m.from && m.from !== who;
        if (m.from) who = m.from;
        return el('div', { className: 'chat-msg' + (m.style ? ' is-' + m.style : ''), style: answered ? null : 'animation-delay:' + (0.4 + i * 0.7) + 's' },
          showName ? el('span', { className: 'chat-from', text: m.from }) : null,
          el('span', { className: 'chat-bubble', text: fill(m.text) })
        );
      });
      phone = el('div', { className: 'phone' },
        el('div', { className: 'phone-top' }, el('span', { 'aria-hidden': 'true', text: '💬' }), el('b', { text: ev.chatTitle })),
        el('div', { className: 'phone-body' }, bubbles)
      );
    }

    // 보너스 라운드 기사
    let articlesBlock = null;
    if (ev.articles) {
      const readCount = el('p', { className: 'read-count' });
      const updateCount = () => {
        readCount.textContent = D.ui.articlesReadCount.replace('{읽은수}', state.eventRead.length).replace('{전체수}', ev.articles.length);
      };
      updateCount();
      articlesBlock = el('div', { className: 'event-articles' },
        readCount,
        el('div', { className: 'news-list' }, articleCards(ev.articles, COMMON_SCOPE, state.eventRead, (i, card) => {
          if (state.eventRead.includes(i)) return;
          state.eventRead.push(i);
          card.classList.add('is-read');
          updateCount();
          save();
        }, 'bonus'))
      );
    }

    let bottom;
    const wrongTried = ev.quiz ? (state.eventWrong || []) : [];
    if (!answered && ev.quiz && state.eventHint !== null && state.eventHint !== undefined) {
      // 보너스 문제에서 오답을 골랐을 때: 힌트 보여주고 다시 고르기
      const wrong = ev.choices[state.eventHint];
      const lv = eventLevel(ev, wrong.level);
      bottom = el('div', { className: 'event-after' },
        el('div', { className: 'card event-feedback is-' + wrong.level },
          el('p', { className: 'event-my-choice', text: fill(wrong.text) }),
          el('p', { className: 'event-level', text: lv.icon + ' ' + lv.label }),
          el('p', { className: 'event-feedback-text', text: fill(wrong.feedback) })
        ),
        button(ev.retryButton || E.nextButton, 'btn-primary btn-block', () => {
          if (state.screen !== 'event') return;
          state.eventHint = null;
          go('event');
        })
      );
    } else if (!answered) {
      bottom = el('div', { className: 'event-choices' },
        el('p', { className: 'event-question', text: fill(ev.question || E.question) }),
        state.eventOrder.map((idx, n) => {
          const tried = wrongTried.includes(idx);
          return el('button', {
            type: 'button', className: 'condition-card event-choice' + (tried ? ' is-tried' : ''),
            disabled: tried,
            onClick: guarded(() => {
              if (state.screen !== 'event' || state.eventResults[ev.afterRound] !== undefined) return;
              if (ev.quiz && ev.choices[idx].level !== 'good') {
                if (!state.eventWrong.includes(idx)) state.eventWrong.push(idx);
                state.eventHint = idx;
                go('event');
                return;
              }
              if (ev.quiz && state.eventWrong.length) state.eventRetried[ev.afterRound] = true;
              state.eventResults[ev.afterRound] = idx;
              const delta = ev.choices[idx].seeds || 0;
              if (delta) { state.seeds += delta; eventJustLost = delta; } // 속았을 때 씨앗 손실
              go('event');
            })
          },
            el('span', { className: 'condition-num', 'aria-hidden': 'true', text: tried ? '✗' : String(n + 1) }),
            el('span', { className: 'condition-text', text: fill(ev.choices[idx].text) })
          );
        })
      );
    } else {
      const picked = ev.choices[state.eventResults[ev.afterRound]];
      const lv = eventLevel(ev, eventLevelKey(ev, picked));
      bottom = el('div', { className: 'event-after' },
        el('div', { className: 'card event-feedback is-' + picked.level },
          el('p', { className: 'event-my-choice', text: fill(picked.text) }),
          el('p', { className: 'event-level', text: lv.icon + ' ' + lv.label }),
          picked.seeds ? el('div', { className: 'delta-row event-loss' },
            el('div', { className: 'delta-chip ' + (picked.seeds < 0 ? 'is-down' : 'is-up') },
              el('span', { 'aria-hidden': 'true', text: D.ui.seedIcon }),
              el('span', { text: D.ui.seedLabel }),
              el('b', { text: signed(picked.seeds) }))) : null,
          el('p', { className: 'event-feedback-text' }, markTerms(fill(picked.feedback), ev.terms, COMMON_SCOPE)),
          footnotes(ev.terms, COMMON_SCOPE)
        ),
        ev.tips ? el('div', { className: 'card tips-card' },
          el('h3', { className: 'tips-title', text: ev.tipsTitle }),
          el('ol', { className: 'tips-list' }, ev.tips.map((t) => el('li', { text: fill(t) })))
        ) : null,
        ev.learning ? learningCard(ev.learning) : null,
        button(E.nextButton, 'btn-primary btn-block', () => {
          if (state.screen !== 'event') return;
          nextRound();
        })
      );
    }

    if (lost) {
      later(() => {
        bar.seedNum.classList.add('flash-down');
        animateNumber(state.seeds - lost, state.seeds, 1100, bar.setSeeds);
      }, 500);
    }

    // 새 문자·메시지 이벤트: 알림을 눈에 띄게 (학생 설문: "그런 문자가 온 줄 몰랐어요" 12명)
    const isNewMessage = ev.style === 'message' && ev.messages && !answered;
    if (isNewMessage && bottom && bottom.classList.contains('event-choices')) {
      // 말풍선이 다 도착한 뒤에 선택지가 나타나요 (말풍선을 건너뛰고 답부터 고르지 않게)
      // 애니메이션이 멈춘 기기에서도 반드시 나타나도록 타이머로 열어요
      bottom.classList.add('is-waiting');
      const waitMs = Math.round((0.4 + (ev.messages.length - 1) * 0.7 + 0.9) * 1000);
      later(() => { bottom.classList.remove('is-waiting'); bottom.classList.add('is-shown'); }, waitMs);
    }

    app.appendChild(el('section', { className: 'screen event-screen' },
      bar.node,
      el('div', { className: 'event-banner' + (ev.style ? ' is-' + ev.style : '') + (isNewMessage ? ' is-new' : '') },
        el('span', { className: 'event-banner-tag', text: ev.banner || E.banner }),
        el('h2', { className: 'event-title', text: ev.title })
      ),
      ev.intro ? speech(fill(ev.intro)) : null,
      articlesBlock,
      ev.narration ? el('p', { className: 'event-narration', text: fill(ev.narration) }) : null,
      phone,
      bottom
    ));
    if (answered || (state.eventHint !== null && state.eventHint !== undefined)) later(() => { const fb = app.querySelector('.event-after'); if (fb) fb.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 100);
    if (isNewMessage) showMessageNotice(ev);
  }

  /* ==================================================================
     📱 휴대폰 — 프린세스메이커의 "일상 이벤트"처럼 투자 도중에 문자가 와요
     퀴즈처럼 보기를 고르는 게 아니라, 진짜 휴대폰처럼 링크를 누르거나 답장·차단·삭제를 해요.
     사기 문자의 가짜 누리집에서 정보를 넣으면 "속음" → 씨앗을 잃어요(결과 코드에도 담겨요).
     ================================================================== */
  function phoneMsg(id) { return (D.phone.messages || []).find((m) => m.id === id); }
  function phoneState() {
    if (!state.phone) state.phone = { inbox: [], unread: [], results: {} };
    return state.phone;
  }
  function phoneCaughtCount(st) {
    const ph = (st || state).phone;
    if (!ph) return 0;
    return Object.keys(ph.results || {}).filter((k) => ph.results[k] === 'caught').length;
  }

  function updatePhoneBadge() {
    const n = phoneState().unread.length;
    document.querySelectorAll('.phone-badge').forEach((b) => { b.textContent = n ? String(n) : ''; b.hidden = !n; });
    document.querySelectorAll('.status-phone').forEach((b) => b.classList.toggle('has-new', n > 0));
  }

  // 조건이 맞은 문자를 받은편지함에 넣어요 (readCount: 이번 라운드에 읽은 기사 수, waited: 기다린 단계)
  function phoneCheck(readCount, waited) {
    if (!D.phone) return;
    const ph = phoneState();
    (D.phone.messages || []).forEach((m) => {
      if (m.round !== state.round || ph.inbox.includes(m.id)) return;
      if (readCount >= (m.after || 1) || waited >= (m.after || 1)) {
        ph.inbox.push(m.id);
        ph.unread.push(m.id);
        save();
        updatePhoneBadge();
        later(() => showPhoneNotice(m), 900);
      }
    });
  }

  function showPhoneNotice(m) {
    document.querySelectorAll('.msg-noti.is-phone').forEach((x) => x.remove());
    const first = fill(m.texts[0] || '');
    const noti = el('button', { type: 'button', className: 'toast msg-noti is-phone', 'aria-live': 'assertive' },
      el('span', { className: 'msg-noti-body' },
        el('b', { text: D.phone.notiTitle + ' · ' + m.from }),
        el('small', { text: first.length > 36 ? first.slice(0, 36) + '…' : first })
      )
    );
    noti.addEventListener('click', () => { noti.remove(); openPhone(m.id); });
    document.body.appendChild(noti);
    later(() => noti.classList.add('is-out'), 6200);
    later(() => noti.remove(), 6700);
  }

  function openPhone(threadId) {
    document.querySelectorAll('.phone-backdrop, .msg-noti.is-phone').forEach((x) => x.remove());
    const P = D.phone;
    const box = el('div', { className: 'phone-app', role: 'dialog', 'aria-modal': 'true', 'aria-label': fill(P.title) });
    const back = el('div', { className: 'phone-backdrop' }, box);
    back.addEventListener('click', (e) => { if (e.target === back) back.remove(); });
    document.body.appendChild(back);

    function header(title, onBack) {
      return el('div', { className: 'phone-app-top' },
        onBack ? el('button', { type: 'button', className: 'phone-app-back', text: P.backButton, onClick: onBack }) : el('span', {}),
        el('b', { text: title }),
        el('button', { type: 'button', className: 'phone-app-close', text: P.closeButton, onClick: () => back.remove() }));
    }

    function showList() {
      const ph = phoneState();
      box.textContent = '';
      box.appendChild(header(fill(P.title)));
      if (!ph.inbox.length) { box.appendChild(el('p', { className: 'phone-empty', text: P.empty })); return; }
      box.appendChild(el('ul', { className: 'phone-list' },
        ph.inbox.slice().reverse().map((id) => {
          const m = phoneMsg(id);
          if (!m) return null;
          const unread = ph.unread.includes(id);
          return el('li', {}, el('button', { type: 'button', className: 'phone-row' + (unread ? ' is-unread' : ''), onClick: () => showThread(id) },
            el('span', { className: 'phone-row-face', 'aria-hidden': 'true', text: '👤' }),
            el('span', { className: 'phone-row-main' },
              el('b', { text: m.from }),
              el('small', { text: fill(m.texts[0]) })),
            unread ? el('span', { className: 'phone-row-dot', 'aria-label': '안 읽음' }) : null));
        })));
    }

    function showThread(id) {
      const m = phoneMsg(id);
      const ph = phoneState();
      ph.unread = ph.unread.filter((x) => x !== id);
      save();
      updatePhoneBadge();
      const done = ph.results[id];
      box.textContent = '';
      box.appendChild(header(m.from, showList));
      // 진짜 휴대폰처럼: 저장된 연락처만 표시하고, 모르는 번호엔 따로 경고를 붙이지 않아요(스스로 알아채기)
      box.appendChild(el('p', { className: 'phone-sender' },
        m.saved ? el('span', { className: 'phone-tag is-saved', text: P.savedTag }) : null,
        (m.saved ? ' ' : '') + m.number));
      const bubbles = m.texts.map((t) => el('p', { className: 'phone-bubble', text: fill(t) }));
      if (m.link) {
        bubbles.push(el('p', { className: 'phone-bubble' },
          el('button', { type: 'button', className: 'phone-link', text: '▶ ' + m.link, disabled: !!done, onClick: () => { if (!phoneState().results[id]) showPage(id); } })));
      }
      box.appendChild(el('div', { className: 'phone-thread' }, bubbles));
      if (done) {
        box.appendChild(el('p', { className: 'phone-handled', text: P.handled }));
        return;
      }
      const actions = el('div', { className: 'phone-actions' });
      (m.replies || []).forEach((r) => actions.appendChild(button(r.text, 'btn-ghost phone-reply', () => finish(id, 'replied', r.feedback))));
      if (m.kind === 'legit' && !m.replies) actions.appendChild(button(P.okButton, 'btn-ghost phone-reply', () => finish(id, 'ok', m.okFeedback)));
      actions.appendChild(button(P.reportButton, 'btn-gray phone-report', () =>
        finish(id, m.kind === 'scam' ? 'reported' : 'blocked', m.kind === 'scam' ? P.generic.reportScam : m.blockFeedback)));
      actions.appendChild(button(P.deleteButton, 'btn-gray phone-delete', () =>
        finish(id, 'deleted', m.kind === 'scam' ? P.generic.deleteScam : P.generic.deleteLegit)));
      box.appendChild(actions);
    }

    // 가짜 누리집 — 주소창의 이상한 주소가 가장 큰 단서예요
    function showPage(id) {
      const m = phoneMsg(id);
      const pg = m.page;
      box.textContent = '';
      box.appendChild(el('div', { className: 'phone-browser-bar' },
        el('span', { 'aria-hidden': 'true', text: '🔒' }), el('span', { className: 'phone-url', text: pg.url })));
      const inputs = (pg.fields || []).map((f) => el('label', { className: 'phone-field' },
        el('span', { text: f }),
        el('input', { type: /비밀번호/.test(f) ? 'password' : 'text', inputmode: /비밀번호|번호/.test(f) ? 'numeric' : 'text', autocomplete: 'off', maxlength: '20' })));
      box.appendChild(el('div', { className: 'phone-page' },
        el('p', { className: 'phone-page-brand', text: pg.brand }),
        el('h3', { className: 'phone-page-title', text: pg.title }),
        pg.desc ? el('p', { className: 'phone-page-desc', text: pg.desc }) : null,
        inputs,
        // 입력한 내용은 어디에도 저장하거나 보내지 않아요
        button(pg.button, 'btn-primary btn-block phone-page-btn', () => {
          // 진짜 누리집처럼 빈칸이 있으면 먼저 채우라고 해요
          const empty = inputs.map((l) => l.querySelector('input')).find((x) => !x.value.trim());
          if (empty) { empty.classList.add('is-empty'); empty.placeholder = '필수 입력'; empty.focus(); return; }
          inputs.forEach((l) => { l.querySelector('input').value = ''; });
          finish(id, 'caught', m.caught);
        }),
        button(P.pageBack, 'btn-ghost btn-block', () => finish(id, 'clicked', P.generic.leftPage))
      ));
    }

    function finish(id, outcome, feedback) {
      const m = phoneMsg(id);
      const ph = phoneState();
      if (ph.results[id]) { showThread(id); return; }
      ph.results[id] = outcome;
      let lost = 0;
      if (outcome === 'caught' && P.scamLoss) {
        lost = P.scamLoss;
        state.seeds -= lost;
        document.querySelectorAll('.status-seeds .status-num').forEach((n) => {
          n.textContent = formatNum(state.seeds);
          n.classList.remove('flash-down'); void n.offsetWidth; n.classList.add('flash-down');
        });
      }
      save();
      box.textContent = '';
      box.appendChild(header(m.from, showList));
      const showClues = m.kind === 'scam' && (outcome === 'caught' || outcome === 'reported' || outcome === 'clicked' || outcome === 'deleted');
      box.appendChild(el('div', { className: 'phone-result is-' + outcome },
        el('p', { className: 'phone-result-text', text: fill(feedback || '') }),
        lost ? el('div', { className: 'delta-row' }, el('div', { className: 'delta-chip is-down' },
          el('span', { 'aria-hidden': 'true', text: D.ui.seedIcon }), el('span', { text: P.lossLabel }), el('b', { text: signed(-lost) }))) : null,
        showClues && m.clues ? el('div', { className: 'phone-clues' },
          el('b', { text: P.cluesTitle }),
          el('ul', {}, m.clues.map((c) => el('li', { text: c })))) : null,
        button(P.doneButton, 'btn-primary btn-block', showList)
      ));
    }

    if (threadId && phoneMsg(threadId)) showThread(threadId); else showList();
  }

  // 엔딩·결과 복사에 쓰는 휴대폰 보안 기록
  function phoneStats() {
    const ph = phoneState();
    const got = ph.inbox.map(phoneMsg).filter(Boolean);
    const scams = got.filter((m) => m.kind === 'scam');
    const legit = got.filter((m) => m.kind === 'legit');
    return {
      scams: scams.length,
      safe: scams.filter((m) => ph.results[m.id] !== 'caught').length,
      reported: scams.filter((m) => ph.results[m.id] === 'reported').length,
      caught: scams.filter((m) => ph.results[m.id] === 'caught').length,
      legit: legit.length,
      legitGood: legit.filter((m) => ph.results[m.id] === 'replied' || ph.results[m.id] === 'ok').length
    };
  }

  function phoneSummaryCard() {
    if (!D.phone) return null;
    const P = D.phone, s = phoneStats();
    if (!s.scams && !s.legit) return null;
    return el('div', { className: 'card phone-summary' },
      el('h2', { className: 'section-title', text: P.summaryTitle }),
      el('ul', { className: 'event-summary' },
        el('li', {}, el('span', { text: P.summaryScam.replace('{전체}', s.scams) }), el('b', { text: s.safe + ' / ' + s.scams })),
        el('li', {}, el('span', { text: P.summaryReported }), el('b', { text: s.reported + ' / ' + s.scams })),
        el('li', {}, el('span', { text: P.summaryLegit }), el('b', { text: s.legitGood + ' / ' + s.legit }))
      ),
      el('p', { className: 'save-info', text: P.summaryNote })
    );
  }

  // 휴대폰 알림처럼 위에서 내려와 흔들리는 배너 (약 6초, 누르면 문자 쪽으로 이동)
  function showMessageNotice(ev) {
    const first = ev.messages[0] ? fill(ev.messages[0].text) : '';
    const noti = el('button', { type: 'button', className: 'toast msg-noti', 'aria-live': 'assertive' },
      el('span', { className: 'msg-noti-body' },
        el('b', { text: (ev.banner || D.eventUi.banner) + ' · ' + (ev.chatTitle || '') }),
        el('small', { text: first.length > 34 ? first.slice(0, 34) + '…' : first })
      )
    );
    noti.addEventListener('click', () => {
      const phone = app.querySelector('.phone');
      if (phone) phone.scrollIntoView({ block: 'center', behavior: 'smooth' });
      noti.remove();
    });
    later(() => document.body.appendChild(noti), 250);
    later(() => noti.classList.add('is-out'), 6200);
    later(() => noti.remove(), 6700);
  }

  /* ==================================================================
     엔딩
     ================================================================== */
  function renderTransition() {
    document.body.classList.add('is-dark');
    const toEnding = guarded(() => { if (state.screen === 'transition') go('ending'); });
    const section = el('section', { className: 'transition-screen', onClick: toEnding },
      el('div', { className: 'transition-figure' }, characterFigure(state.character)),
      el('p', { className: 'transition-line', text: fill(D.lines.afterRound5) }),
      el('button', { type: 'button', className: 'btn btn-yellow transition-btn', text: D.ui.toEndingButton })
    );
    app.appendChild(section);
  }

  function endingBackground(ending) {
    const fallback = () => el('div', { className: 'ending-bg-fallback', style: 'background:' + ending.gradient },
      el('span', { className: 'ending-bg-emoji', 'aria-hidden': 'true', text: ending.fallbackEmoji })
    );
    return el('div', { className: 'ending-bg' }, imageOr(ending.image, fallback, ''));
  }

  // 인증서에서 돌아올 때는 어두운 막·타자 효과 없이 바로 결과 코드 쪽을 보여 줘요
  let endingReturn = false;

  function renderEnding() {
    const back = endingReturn;
    endingReturn = false;
    const ending = endingFor(state.seeds, state.trust);
    const S = D.endingScreen;
    const story = Array.from(fill(ending.story));
    // 🏅 엔딩에서 확인하는 배지(엔딩 수집·문자 탐정) — 기록은 바로(도감에 보이게), 알림은 이야기가 나온 뒤에
    if (!back) checkEndingBadges(ending, 3200);

    const storyText = el('p', { className: 'ending-story' });
    const hint = el('p', { className: 'ending-tap', text: S.tapToSkip });
    const dialog = el('div', { className: 'ending-dialog' }, storyText, hint);
    const title = el('h1', { className: 'ending-title' },
      el('span', { className: 'ending-title-emoji', 'aria-hidden': 'true', text: ending.emoji }),
      ' ' + ending.title);
    const curtain = el('div', { className: 'ending-curtain' });
    const stage = el('div', { className: 'ending-stage', role: 'img', 'aria-label': ending.emoji + ' ' + ending.title },
      endingBackground(ending),
      el('div', { className: 'ending-character' }, characterFigure(state.character)),
      title,
      dialog,
      curtain
    );

    const after = el('div', { className: 'ending-after', hidden: true }, endingSummary(ending));

    let shown = 0;
    let typingDone = false;
    function finishTyping() {
      if (typingDone) return;
      typingDone = true;
      storyText.textContent = story.join('');
      hint.textContent = S.scrollHint;
      after.hidden = false;
    }
    function typeNext() {
      if (typingDone) return;
      shown++;
      storyText.textContent = story.slice(0, shown).join('');
      if (shown >= story.length) { finishTyping(); return; }
      later(typeNext, D.settings.typingSpeedMs);
    }
    stage.addEventListener('click', () => {
      if (!typingDone) {
        stage.classList.add('is-title', 'is-character', 'is-dialog');
        curtain.remove();
        finishTyping();
      } else {
        after.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    });

    app.appendChild(el('section', { className: 'screen ending-screen' }, stage, after));

    if (back) {
      stage.classList.add('is-title', 'is-character', 'is-dialog');
      curtain.remove();
      finishTyping();
      later(() => {
        const card = app.querySelector('.submit-card');
        if (card) card.scrollIntoView({ block: 'center' });
      }, 60);
      return;
    }

    // 어두운 화면 → 밝아짐 → 캐릭터 → 칭호 → 이야기 타이핑
    later(() => curtain.classList.add('is-open'), 100);
    later(() => stage.classList.add('is-character'), 1300);
    later(() => stage.classList.add('is-title'), 2100);
    later(() => { stage.classList.add('is-dialog'); typeNext(); }, 2900);
  }

  function endingSummary(ending) {
    const S = D.endingScreen;
    const B = D.badges;

    const badgeRow = el('ol', { className: 'badge-list' },
      D.rounds.map((R, i) => {
        const c = state.choices[i];
        const b = c ? B[c.type] : B.none;
        return el('li', { className: 'badge-item', title: b.label },
          el('span', { className: 'badge-round', text: (i + 1) + '' }),
          el('span', { className: 'badge-icon', 'aria-hidden': 'true', text: b.icon }),
          el('span', { className: 'badge-company', text: R.company }),
          el('span', { className: 'sr-only', text: b.label })
        );
      })
    );
    const legend = el('p', { className: 'badge-legend' },
      ['conditionCorrect', 'conditionWrong', 'pass', 'invest'].map((k) => el('span', { text: B[k].icon + ' ' + B[k].label }))
    );

    const learnings = el('ul', { className: 'promise-list' },
      D.rounds.map((R) => el('li', {},
        el('span', { 'aria-hidden': 'true', text: R.learning.emoji }), ' ' + R.learning.text))
    );

    const diary = el('ol', { className: 'diary-list' },
      D.rounds.map((R, i) => {
        const c = state.choices[i];
        let choiceName = '';
        if (c) {
          choiceName = c.type === 'invest' ? D.decision.choiceNames.invest
            : c.type === 'pass' ? D.decision.choiceNames.pass : D.decision.choiceNames.condition;
        }
        return el('li', { className: 'diary-item' },
          el('p', { className: 'diary-head' },
            el('b', { text: (i + 1) + '. ' + R.company }),
            choiceName ? el('span', { className: 'diary-choice', text: choiceName }) : null),
          c && c.evidence ? el('p', { className: 'diary-evidence' },
            el('span', { text: D.evidenceUi.diaryLabel + ' ' }), el('q', { text: c.evidence })) : null,
          el('p', { className: 'diary-text', text: c && c.reason ? c.reason : S.diaryEmpty })
        );
      })
    );

    const events = el('ul', { className: 'event-summary' },
      D.events.map((ev) => {
        const idx = state.eventResults[ev.afterRound];
        const lv = idx === undefined ? D.eventUi.levels.none : eventLevel(ev, eventLevelKey(ev, ev.choices[idx]));
        return el('li', {},
          el('span', { className: 'event-summary-title', text: ev.summaryTitle || ((ev.banner || D.eventUi.banner) + ' ' + ev.title) }),
          el('b', { text: lv.icon + ' ' + lv.label })
        );
      })
    );

    // 선생님께 알려줄 결과 코드 + 제출용 결과 복사
    const submitText = resultSummaryText(ending);
    const copyBox = el('textarea', { className: 'copy-box', readonly: true, rows: '5', 'aria-label': S.copyBoxTitle });
    copyBox.value = submitText;
    const copyMsg = el('p', { className: 'copy-msg', role: 'status' });
    const copyBtn = button(S.copyButton, 'btn-primary', () => {
      copyBox.focus();
      copyBox.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (!ok && navigator.clipboard) {
        navigator.clipboard.writeText(submitText).then(
          () => { copyMsg.textContent = S.copyDone; },
          () => { copyMsg.textContent = S.copyFail; }
        );
        return;
      }
      copyMsg.textContent = ok ? S.copyDone : S.copyFail;
    });

    const submitCard = el('div', { className: 'card submit-card' },
      el('h2', { className: 'section-title', text: S.codeTitle }),
      el('p', { className: 'code-value submit-code', text: makeResultCode() }),
      el('p', { className: 'save-info', text: S.codeGuide }),
      el('h3', { className: 'submit-sub', text: S.copyBoxTitle }),
      copyBox,
      copyBtn,
      copyMsg
    );

    const buttons = el('div', { className: 'ending-buttons' },
      ending.best
        ? button(S.certificateButton, 'btn-yellow btn-block ending-cert-btn', () => {
          if (endingFor(state.seeds, state.trust).best) go('certificate');
        })
        : el('div', { className: 'ending-retry' },
          ending.hint ? el('p', { className: 'ending-hint', text: ending.hint }) : null,
          button(S.retryButton, 'btn-primary btn-block', retryGame)),
      button(S.homeButton, 'btn-ghost btn-block', goHome)
    );

    return [
      el('div', { className: 'card ending-stats' },
        el('div', { className: 'stat' }, el('span', { text: D.ui.seedIcon + ' ' + S.finalSeedsLabel }), el('b', { text: formatNum(state.seeds) })),
        el('div', { className: 'stat' }, el('span', { text: D.ui.trustIcon + ' ' + S.finalTrustLabel }), el('b', { className: 'trust-' + trustLevel(state.trust), text: trustText(state.trust) }))
      ),
      el('div', { className: 'card' }, el('h2', { className: 'section-title', text: S.badgesTitle }), badgeRow, legend),
      ethicsCard(),        // 🧭 오늘 만난 AI 윤리 원칙 (공모전판)
      badgeCard(),
      el('div', { className: 'card promise-card' }, el('h2', { className: 'section-title', text: fill(S.learningTitle) }), learnings),
      fairnessCard(),      // ⚖️ 공정성 생각 열기 (공모전판)
      postCheckCard(),     // 🧪 사후 자기 점검 → 📈 나의 변화 (공모전판)
      deepReadingCard(),
      phoneSummaryCard(),
      el('div', { className: 'card' }, el('h2', { className: 'section-title', text: S.diaryTitle }), diary),
      el('div', { className: 'card' }, el('h2', { className: 'section-title', text: S.eventsTitle }), events),
      submitCard,
      specialCard(),   // 결과 코드를 먼저 적고, 시간이 남으면 도전해요
      buttons
    ];
  }

  // 🧠 깊이 읽기: 심화 확인 문제를 한 번에 맞힌 수 + 진짜 문제를 짚은 근거 문장 수 (점수·엔딩과는 상관없어요)
  function deepReadingStats() {
    const rounds = D.rounds.filter((R) => R.deep).length;
    const firstTry = Object.keys(state.deepResults || {}).filter((k) => state.deepResults[k] === true).length;
    const evid = state.choices.filter((c) => c && c.evidence);
    return { rounds: rounds, firstTry: firstTry, evidence: evid.length, evidenceOk: evid.filter((c) => c.evidenceOk).length };
  }

  function deepReadingCard() {
    const U = D.deepUi;
    const s = deepReadingStats();
    if (!s.rounds) return null;
    return el('div', { className: 'card deep-summary' },
      el('h2', { className: 'section-title', text: U.summaryTitle }),
      el('ul', { className: 'event-summary' },
        el('li', {}, el('span', { text: U.summaryCheck }), el('b', { text: s.firstTry + ' / ' + s.rounds })),
        el('li', {}, el('span', { text: U.summaryEvidence }), el('b', { text: s.evidenceOk + ' / ' + s.evidence }))
      ),
      el('p', { className: 'save-info', text: U.summaryNote })
    );
  }

  // 선생님께 제출할 결과 요약 (구글 폼 등에 붙여넣기)
  function resultSummaryText(ending) {
    const B = D.badges;
    const lines = [];
    lines.push('별명: ' + state.nickname);
    lines.push('엔딩: ' + ending.emoji + ' ' + ending.title);
    lines.push('최종 씨앗: ' + formatNum(state.seeds) + ' / 신뢰지수: ' + trustText(state.trust));
    lines.push('결과 코드: ' + makeResultCode());
    lines.push('라운드별 선택: ' + D.rounds.map((R, i) => {
      const c = state.choices[i];
      return (i + 1) + '.' + R.company + ' ' + (c ? B[c.type].label : B.none.label);
    }).join(' / '));
    lines.push('긴급 상황 대처: ' + D.events.map((ev) => {
      const idx = state.eventResults[ev.afterRound];
      const lv = idx === undefined ? D.eventUi.levels.none : eventLevel(ev, eventLevelKey(ev, ev.choices[idx]));
      return ev.title + ' ' + lv.label;
    }).join(' / '));
    const dr = deepReadingStats();
    if (dr.rounds) lines.push('깊이 읽기: 심화 확인 문제 한 번에 맞힘 ' + dr.firstTry + '/' + dr.rounds + ' / 진짜 문제를 짚은 근거 ' + dr.evidenceOk + '/' + dr.evidence);
    if (D.phone) {
      const ps = phoneStats();
      if (ps.scams || ps.legit) lines.push('휴대폰 보안: 사기 문자 ' + ps.scams + '개 중 속지 않음 ' + ps.safe + ' / 신고 ' + ps.reported + ' / 진짜 문자에 알맞게 답함 ' + ps.legitGood + '/' + ps.legit);
    }
    // 공모전판: 자기 점검·공정성 활동 기록 (점수와 무관)
    if (D.selfCheck && (Array.isArray(state.pre) || Array.isArray(state.post))) {
      const S = D.selfCheck;
      const show = (arr) => (Array.isArray(arr) ? arr.map((v) => v + 1).join('·') : '없음');
      lines.push('자기점검(1~4점, 네 문항): 사전 ' + show(state.pre) + ' / 사후 ' + show(state.post));
    }
    if (D.fairness && (state.fair === 0 || state.fair)) {
      lines.push('공정성 생각 열기: ' + (state.fair + 1) + '번 — ' + D.fairness.choices[state.fair].text);
    }
    if (D.collect) lines.push('배지: ' + badgeCount() + '/' + BADGE_IDS.length + (state.badgesNew && state.badgesNew.length ? ' (이번 판 새 배지 ' + state.badgesNew.length + '개)' : ''));
    if (D.special && state.special && state.special.choice) lines.push('스페셜 라운드: 팩트체크 ' + state.special.correct + '/' + D.special.factCheck.items.length + ' / 보너스 신뢰 ' + signed(state.special.bonus));
    lines.push('투자 일기:');
    D.rounds.forEach((R, i) => {
      const c = state.choices[i];
      lines.push(' ' + (i + 1) + ') ' + R.company + ' — ' + (c && c.reason ? c.reason : D.endingScreen.diaryEmpty) +
        (c && c.evidence ? ' [근거: ' + c.evidence + ']' : ''));
    });
    return lines.join('\n');
  }

  // 다시 도전하기: 닉네임·캐릭터는 그대로, 나머지는 처음으로
  function retryGame() {
    const keep = { nickname: state.nickname, character: state.character };
    state = Object.assign(freshState(), keep);
    startRound(1);
  }

  // 처음으로: 닉네임부터 새로 (저장된 게임은 목록에 남아요)
  function goHome() {
    state = freshState();
    render();
  }

  /* ==================================================================
     인증서 (최고 엔딩 전용)
     1123×794px 고정 크기로 만들고, 작은 화면에서는 비율을 유지해 줄여서 보여줘요.
     ================================================================== */
  const CERT_W = 1123;
  const CERT_H = 794;

  function certificateDate() {
    const d = new Date(state.certDate || Date.now());
    return D.certificate.dateFormat.replace('{년}', d.getFullYear()).replace('{월}', d.getMonth() + 1).replace('{일}', d.getDate());
  }

  function buildCertificate() {
    const C = D.certificate;
    const B = D.badges;
    const corner = (pos) => el('span', { className: 'cert-corner cert-corner-' + pos, 'aria-hidden': 'true', text: '🌿' });
    return el('div', { className: 'cert' },
      el('div', { className: 'cert-vine' }, el('div', { className: 'cert-vine-leaf' },
        el('div', { className: 'cert-paper' },
          corner('tl'), corner('tr'), corner('bl'), corner('br'),
          el('p', { className: 'cert-academy', text: C.academy }),
          el('h1', { className: 'cert-title', text: C.title }),
          el('div', { className: 'cert-main' },
            el('div', { className: 'cert-figure' }, characterFigure(state.character)),
            el('div', { className: 'cert-info' },
              el('p', { className: 'cert-honor', text: C.honor }),
              el('p', { className: 'cert-name', text: fill(C.name) }),
              el('p', { className: 'cert-body', text: C.body })
            )
          ),
          el('div', { className: 'cert-bottom' },
            el('div', { className: 'cert-stats' },
              el('p', {}, el('span', { text: D.ui.seedIcon + ' ' + C.finalSeedsLabel }), el('b', { text: formatNum(state.seeds) })),
              el('p', {}, el('span', { text: D.ui.trustIcon + ' ' + C.finalTrustLabel }), el('b', { text: trustText(state.trust) })),
              el('p', {}, el('span', { text: C.badgesLabel }),
                el('b', { className: 'cert-badges', text: state.choices.map((c) => (c ? B[c.type].icon : B.none.icon)).join(' ') }))
            ),
            el('div', { className: 'cert-sign' },
              el('p', { className: 'cert-date', text: C.issuedLabel + ' ' + certificateDate() }),
              el('div', { className: 'cert-stamp', text: C.stamp })
            )
          )
        )
      ))
    );
  }

  let onResize = null;

  function renderCertificate() {
    if (!endingFor(state.seeds, state.trust).best) { go('ending'); return; }
    const C = D.certificate;
    if (!state.certDate) { state.certDate = Date.now(); save(); } // 처음 받은 날을 발급일로

    const cert = buildCertificate();
    const frame = el('div', { className: 'cert-frame' }, cert);

    // 인증서 밖(아래)에 결과 코드를 한 번 더 보여 줘요 — 설문에 코드를 쓸 때 돌아가지 않아도 되게
    const codeRow = el('div', { className: 'card cert-code' },
      el('span', { className: 'cert-code-label', text: C.codeLabel }),
      el('b', { className: 'code-value cert-code-value', text: makeResultCode() }),
      el('small', { className: 'cert-code-hint', text: C.codeHint })
    );

    app.appendChild(el('section', { className: 'screen cert-screen' },
      frame,
      el('p', { className: 'cert-hint', text: C.captureHint }),
      codeRow,
      el('div', { className: 'btn-row cert-buttons' },
        button(C.backButton, 'btn-ghost', () => { endingReturn = true; go('ending'); }),
        button(C.homeButton, 'btn-primary', goHome))
    ));

    function fit() {
      const scale = Math.min(1, frame.clientWidth / CERT_W);
      cert.style.transform = 'scale(' + scale + ')';
      frame.style.height = Math.ceil(CERT_H * scale) + 'px';
    }
    fit();
    onResize = fit;
    window.addEventListener('resize', fit);
  }

  /* ==================================================================
     🧪 사전·사후 자기 점검 / 🧭 윤리 원칙 카드 / ⚖️ 공정성 (2026-10 공모전판)
     모두 점수·엔딩·결과 코드와 상관없어요. 기기에만 저장돼요.
     ================================================================== */
  function selfCheckList(answers, onChange, readOnly) {
    const S = D.selfCheck;
    return el('ol', { className: 'sc-list' }, S.items.map((q, i) => {
      const btns = S.scale.map((label, v) => {
        const b = el('button', {
          type: 'button', className: 'sc-btn' + (answers[i] === v ? ' is-on' : ''),
          disabled: !!readOnly, 'aria-pressed': String(answers[i] === v), text: label
        });
        b.addEventListener('click', () => {
          if (readOnly) return;
          answers[i] = v;
          Array.prototype.forEach.call(b.parentNode.children, (x, xi) => {
            x.classList.toggle('is-on', xi === v);
            x.setAttribute('aria-pressed', String(xi === v));
          });
          if (onChange) onChange();
        });
        return b;
      });
      return el('li', { className: 'sc-item' },
        el('p', { className: 'sc-q', text: q }),
        el('div', { className: 'sc-btns' }, btns));
    }));
  }

  function renderPrecheck() {
    const S = D.selfCheck;
    if (!S) { startRound(1); return; }
    const answers = Array.isArray(state.pre) ? state.pre.slice() : [];
    const err = el('p', { className: 'decision-error', role: 'alert' });
    const submit = button(S.submitPre, 'btn-primary btn-block', () => {
      if (S.items.some((_, i) => typeof answers[i] !== 'number')) { err.textContent = S.needAll; return; }
      state.pre = answers.slice();
      save();
      startRound(1);
    });
    const refresh = () => {
      submit.disabled = S.items.some((_, i) => typeof answers[i] !== 'number');
      err.textContent = '';
    };
    const list = selfCheckList(answers, refresh);
    refresh();

    app.appendChild(el('section', { className: 'screen precheck-screen' },
      speech(S.guide),
      el('div', { className: 'card sc-card' },
        el('h2', { className: 'section-title', text: S.preTitle }),
        list,
        err,
        submit,
        el('p', { className: 'save-info', text: S.note })
      ),
      el('p', { className: 'save-info', text: S.skipNote }),
      button(S.skipButton, 'btn-ghost btn-block', () => startRound(1))
    ));
  }

  // 엔딩: 🧭 오늘 만난 AI 윤리 원칙
  function ethicsCard() {
    const E = D.ethics;
    if (!E) return null;
    const list = D.rounds.slice();
    return el('div', { className: 'card ethics-card' },
      el('h2', { className: 'section-title', text: E.endingTitle }),
      el('ol', { className: 'ethics-list' }, list.map((R, i) => (R.principles ? el('li', { className: 'ethics-item' },
        el('p', { className: 'ethics-head' },
          el('b', { text: (i + 1) + '. ' + R.company }),
          el('span', { className: 'ethics-topic', text: R.topic })),
        principleRow(R.principles),
        R.discuss ? el('p', { className: 'ethics-q', text: '💬 ' + R.discuss }) : null
      ) : null))),
      el('p', { className: 'save-info', text: E.endingNote }),
      el('p', { className: 'save-info', text: E.source })
    );
  }

  // 엔딩: ⚖️ 공정성 생각 열기 (점수 없음)
  function fairnessCard() {
    const F = D.fairness;
    if (!F) return null;
    const box = el('div', { className: 'fair-box' });
    function draw() {
      box.textContent = '';
      if (state.fair === null || state.fair === undefined) {
        box.appendChild(el('div', { className: 'condition-list' }, F.choices.map((c, i) =>
          el('button', { type: 'button', className: 'condition-card fair-choice', onClick: guarded(() => { state.fair = i; save(); draw(); }) },
            el('span', { className: 'condition-num', 'aria-hidden': 'true', text: String(i + 1) }),
            el('span', { className: 'condition-text', text: c.text })))));
      } else {
        const c = F.choices[state.fair];
        box.appendChild(el('p', { className: 'fair-my' }, el('b', { text: F.myChoice + ' · ' }), c.text));
        box.appendChild(el('p', { className: 'fair-feedback', text: c.feedback }));
        box.appendChild(button(F.again, 'btn-ghost', () => { state.fair = null; save(); draw(); }));
      }
    }
    draw();
    return el('div', { className: 'card fair-card' },
      el('h2', { className: 'section-title', text: F.title }),
      el('p', { className: 'fair-intro', text: fill(F.intro) }),
      box,
      el('p', { className: 'save-info', text: F.note })
    );
  }

  // 엔딩: 🧪 사후 자기 점검 → 📈 나의 변화
  function postCheckCard() {
    const S = D.selfCheck;
    if (!S) return null;
    if (Array.isArray(state.post)) return changeCard();

    const answers = [];
    const err = el('p', { className: 'decision-error', role: 'alert' });
    const submit = button(S.submitPost, 'btn-primary btn-block', () => {
      if (S.items.some((_, i) => typeof answers[i] !== 'number')) { err.textContent = S.needAll; return; }
      state.post = answers.slice();
      save();
      endingReturn = true;          // 이야기 연출·배지 판정을 되풀이하지 않아요
      go('ending');
      later(() => { const n = app.querySelector('.change-card'); if (n) n.scrollIntoView({ block: 'center' }); }, 150);
    });
    const refresh = () => {
      submit.disabled = S.items.some((_, i) => typeof answers[i] !== 'number');
      err.textContent = '';
    };
    const list = selfCheckList(answers, refresh);
    refresh();
    return el('div', { className: 'card sc-card' },
      el('h2', { className: 'section-title', text: S.postTitle }),
      el('p', { className: 'save-info', text: S.postGuide }),
      list, err, submit,
      el('p', { className: 'save-info', text: S.note })
    );
  }

  function changeCard() {
    const S = D.selfCheck;
    const pre = Array.isArray(state.pre) ? state.pre : null;
    const post = state.post;
    const rows = S.items.map((q, i) => {
      const a = pre ? pre[i] : null;
      const b = post[i];
      const dir = a === null ? 'same' : b > a ? 'up' : b < a ? 'down' : 'same';
      return el('li', { className: 'change-row is-' + dir },
        el('span', { className: 'change-name', text: (S.shortItems && S.shortItems[i]) || q }),
        el('span', { className: 'change-val' },
          pre ? S.scale[a] + ' → ' : '', el('b', { text: S.scale[b] })),
        el('span', { className: 'change-mark', 'aria-hidden': 'true', text: S.changeLabels[dir] }));
    });
    let summary = '';
    if (pre) {
      const up = S.items.filter((_, i) => post[i] > pre[i]).length;
      const down = S.items.filter((_, i) => post[i] < pre[i]).length;
      summary = S.changeSummary.replace('{올라감}', up).replace('{그대로}', S.items.length - up - down).replace('{내려감}', down);
    }
    return el('div', { className: 'card change-card' },
      el('h2', { className: 'section-title', text: S.changeTitle }),
      el('ul', { className: 'change-list' }, rows),
      summary ? el('p', { className: 'change-summary', text: summary }) : el('p', { className: 'save-info', text: '시작 전 점검을 건너뛰어서 변화는 비교할 수 없어요.' }),
      el('p', { className: 'save-info', text: S.note })
    );
  }

  /* ==================================================================
     🏅 배지 도감 (2026-09 추가)
     별명마다 그 기기에 모여요(게임 저장과 따로 있어서 [다시 도전하기]를 해도 남아요).
     저장 모양: { 별명: { got: { 배지id: 얻은 시각 }, endings: [본 엔딩 id], doneAt: 다 모은 시각 } }
     ================================================================== */
  const BADGE_IDS = D.collect ? Object.keys(D.collect.items) : [];
  let memoryBadges = {};   // 테스트 모드에서는 기기에 저장하지 않고 여기에만

  function readBadgeStore() {
    if (!savingEnabled) return memoryBadges;
    try {
      const raw = localStorage.getItem(D.collect.storageKey);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === 'object') return parsed;
    } catch (e) { /* 저장소를 쓸 수 없는 경우 */ }
    return {};
  }
  function writeBadgeStore(all) {
    if (!savingEnabled) { memoryBadges = all; return; }
    try { localStorage.setItem(D.collect.storageKey, JSON.stringify(all)); } catch (e) { /* 저장 실패는 조용히 */ }
  }
  function badgeRecord(name) {
    if (!D.collect) return { got: {}, endings: [] };
    const r = readBadgeStore()[name || state.nickname] || {};
    return { got: r.got || {}, endings: r.endings || [], doneAt: r.doneAt || null };
  }
  function badgeCount(name) {
    const got = badgeRecord(name).got;
    return BADGE_IDS.filter((id) => got[id]).length;
  }

  // 배지 주기 (이미 있으면 아무 일도 없어요). popDelay: 알림을 늦게 띄울 때(ms)
  function awardBadge(id, popDelay) {
    if (!D.collect || !D.collect.items[id] || !state.nickname) return;
    const all = readBadgeStore();
    const rec = all[state.nickname] || {};
    rec.got = rec.got || {};
    rec.endings = rec.endings || [];
    if (rec.got[id]) return;
    rec.got[id] = Date.now();
    if (!rec.doneAt && BADGE_IDS.every((b) => rec.got[b])) rec.doneAt = Date.now();
    all[state.nickname] = rec;
    writeBadgeStore(all);
    if (!Array.isArray(state.badgesNew)) state.badgesNew = [];
    if (!state.badgesNew.includes(id)) state.badgesNew.push(id);
    save();
    if (popDelay) setTimeout(() => showBadgePop(id), popDelay); else showBadgePop(id);
  }

  // 화면 위에서 잠깐 내려오는 "새 배지!" 알림 (화면이 바뀌어도 끝까지 보여요)
  function showBadgePop(id) {
    const b = D.collect.items[id];
    let wrap = document.getElementById('badge-pops');
    if (!wrap) {
      wrap = el('div', { id: 'badge-pops', className: 'badge-pops', 'aria-live': 'polite' });
      document.body.appendChild(wrap);
    }
    const pop = el('div', { className: 'badge-pop' },
      el('span', { className: 'badge-pop-icon', 'aria-hidden': 'true', text: b.icon }),
      el('span', { className: 'badge-pop-text' }, el('small', { text: D.collect.popTitle }), el('b', { text: b.name })));
    wrap.appendChild(pop);
    setTimeout(() => pop.classList.add('is-out'), 3400);
    setTimeout(() => pop.remove(), 3900);
  }

  // 라운드의 기사 전부 + 심화 자료를 끝까지 읽었을 때
  function checkReadBadge() {
    const R = roundData();
    if (!R || state.screen !== 'round') return;
    if (state.readArticles.length >= R.articles.length && (!R.deep || state.deep.read)) awardBadge('r' + state.round + 'read');
  }

  // 선택을 마쳤을 때 (결과 화면으로 가기 직전)
  function checkChoiceBadges(R, c, pc) {
    if (!c) return;
    const r = state.round;
    if (c.type === 'conditionCorrect') awardBadge('r' + r + 'cond');
    if (r === 1 && c.type === 'invest') awardBadge('r1invest');
    if (r === 2 && c.type === 'conditionWrong' && pc && R.conditions[pc.condition] && R.conditions[pc.condition].half) awardBadge('r2half');
    if (r === 3 && c.evidenceOk) awardBadge('r3evid');
    if (r === 5 && c.type === 'pass' && c.read >= 1) awardBadge('r5pass');
    const good = state.choices.filter((x) => x && x.type === 'conditionCorrect').length;
    if (good >= 3) awardBadge('trap3');
    if (good >= D.rounds.length) awardBadge('perfect');
  }

  // 엔딩에서: 본 엔딩 기록(다른 길 탐험가) + 문자 탐정
  function checkEndingBadges(ending, popDelay) {
    if (!D.collect || !state.nickname) return;
    const all = readBadgeStore();
    const rec = all[state.nickname] || {};
    rec.got = rec.got || {};
    rec.endings = rec.endings || [];
    if (!rec.endings.includes(ending.id)) { rec.endings.push(ending.id); all[state.nickname] = rec; writeBadgeStore(all); }
    if (rec.endings.length >= 2) awardBadge('explorer', popDelay);
    if (D.phone) {
      const ps = phoneStats();
      if (ps.scams >= 3 && ps.reported === ps.scams) awardBadge('phone', popDelay);
    }
  }

  // 배지 도감 (얻은 배지는 색, 못 얻은 배지는 회색 + 얻는 방법)
  function badgeBook(name, fresh) {
    const C = D.collect;
    const got = badgeRecord(name).got;
    fresh = fresh || [];
    return el('div', { className: 'badge-book' },
      C.groups.map((g) => el('div', { className: 'badge-group' },
        el('h3', { className: 'badge-group-title', text: g.title }),
        el('ul', { className: 'badge-grid' }, g.ids.map((id) => {
          const b = C.items[id];
          if (!b) return null;
          const has = !!got[id];
          const isNew = fresh.includes(id);
          return el('li', { className: 'badge-tile' + (has ? ' is-got' : ' is-locked') + (isNew ? ' is-new' : '') },
            isNew ? el('span', { className: 'badge-tile-new', text: C.newTag }) : null,
            el('span', { className: 'badge-tile-icon', 'aria-hidden': 'true', text: b.icon }),
            el('b', { className: 'badge-tile-name', text: b.name }),
            el('small', { className: 'badge-tile-how', text: b.how }),
            el('span', { className: 'sr-only', text: has ? '얻음' : '아직 못 얻음' }));
        }))
      ))
    );
  }

  function badgeCountText(name) {
    return D.collect.count.replace('{얻은수}', badgeCount(name)).replace('{전체수}', BADGE_IDS.length);
  }

  // 엔딩 화면의 배지 카드
  function badgeCard() {
    if (!D.collect) return null;
    const C = D.collect;
    const n = badgeCount();
    const fresh = Array.isArray(state.badgesNew) ? state.badgesNew.filter((id) => C.items[id]) : [];
    return el('div', { className: 'card badge-card' },
      el('h2', { className: 'section-title' }, C.title + ' ', el('span', { className: 'badge-count', text: badgeCountText() })),
      el('div', { className: 'badge-progress', 'aria-hidden': 'true' }, el('i', { style: 'width:' + Math.round(n / BADGE_IDS.length * 100) + '%' })),
      el('p', { className: 'badge-new-line', text: fresh.length
        ? C.newThisGame + ': ' + fresh.map((id) => C.items[id].icon + ' ' + C.items[id].name).join(', ')
        : C.noneThisGame }),
      badgeBook(null, fresh),
