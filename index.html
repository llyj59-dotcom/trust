  <style>
/* =====================================================================
   신뢰를 사다 — 스타일
   파스텔톤(민트·연두·코랄·연노랑), 둥근 모서리, 큰 버튼
   ===================================================================== */

:root {
  --mint: #bff0e0;
  --mint-deep: #5cc9a7;
  --lime: #d9f5b0;
  --green: #4fbf6a;
  --green-deep: #2f9a4c;
  --coral: #ff9a85;
  --coral-deep: #f0705a;
  --yellow: #fff3b0;
  --yellow-deep: #f2c94c;
  --red: #e85b5b;
  --gray: #d7dbe0;
  --gray-deep: #8a929c;
  --ink: #3a3f47;
  --ink-soft: #6b7280;
  --paper: #fffdf6;
  --bg: #f4fbf6;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 4px 0 rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
  /* 공모전판은 인터넷 없이 쓰므로 기기에 이미 있는 글꼴만 씁니다(Jua 가 깔려 있으면 Jua 로 보여요) */
  --font: 'Jua', 'HY헤드라인M', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  /* 읽는 글(기사·대사·조건·설명)은 굵기를 고를 수 있는 글꼴로 — 학생 설문 "글씨체가 너무 두꺼움" 반영 */
  --font-body: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body-weight: 500;
}

* { box-sizing: border-box; }

/* 화면이 넓어지면 글씨와 카드도 같이 커져요 (큰 모니터에서 작아 보이지 않게) */
html {
  font-size: clamp(16px, 0.85vw + 10px, 23px);
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: var(--body-weight);
  font-size: 1.05rem;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  overflow-wrap: break-word;
  overflow-x: clip; /* 엔딩 화면을 가로로 꽉 채울 때 가로 스크롤이 생기지 않게 */
}

body {
  background:
    radial-gradient(circle at 10% 10%, #e3f8ee 0, transparent 40%),
    radial-gradient(circle at 90% 20%, #fff6d6 0, transparent 40%),
    var(--bg);
  min-height: 100vh;
}

#app {
  max-width: 50rem;          /* 화면이 커지면 이 폭도 같이 커져요 */
  margin: 0 auto;
  padding: 16px 16px 32px;
  min-height: 100vh;
}

h1, h2, h3, p { margin: 0; }

.hidden { display: none !important; }

/* ---------- 버튼 ---------- */
.btn {
  font-family: inherit;
  font-size: 1.1rem;
  min-height: 52px;
  padding: 10px 22px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  color: var(--ink);
  background: var(--gray);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
  transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s;
  touch-action: manipulation;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible { outline: 3px solid var(--mint-deep); outline-offset: 3px; }
.btn-primary { background: var(--mint-deep); color: #fff; }
.btn-coral   { background: var(--coral); color: #fff; }
.btn-green   { background: var(--green); color: #fff; }
.btn-gray    { background: var(--gray); color: var(--ink); }
.btn-yellow  { background: var(--yellow-deep); color: var(--ink); }
.btn-ghost   { background: #fff; color: var(--ink); border: 2px solid var(--gray); box-shadow: none; }
.btn-block   { width: 100%; }

.btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn-row .btn { flex: 1 1 160px; }

/* ---------- 카드 ---------- */
.card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

/* ---------- 화면 전환 ---------- */
.screen { animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 시작 화면 ---------- */
.start-screen {
  min-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}
.start-title-wrap { text-align: center; }
.start-sprout { font-size: 4rem; line-height: 1; display: inline-block; animation: sway 3s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.start-title {
  font-size: clamp(2.6rem, 9vw, 4rem);
  color: var(--green-deep);
  letter-spacing: 2px;
  text-shadow: 0 4px 0 #fff, 0 6px 12px rgba(47, 154, 76, 0.2);
}
.start-subtitle { font-size: clamp(1.05rem, 3.6vw, 1.35rem); color: var(--ink-soft); margin-top: 6px; }

.start-card { max-width: 32rem; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.nickname-label { font-size: 1.1rem; }
.nickname-input {
  font-family: inherit;
  font-size: 1.4rem;
  width: 100%;
  min-height: 56px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 3px solid var(--mint);
  background: var(--paper);
  color: var(--ink);
  text-align: center;
}
.nickname-input:focus { outline: none; border-color: var(--mint-deep); }
.nickname-input.is-error { border-color: var(--coral-deep); animation: shake 0.4s; }
.nickname-count { text-align: right; font-size: 0.9rem; color: var(--ink-soft); margin-top: -8px; }
.nickname-count.is-over { color: var(--coral-deep); }
.nickname-guide {
  background: var(--yellow);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.98rem;
}
.nickname-error { color: var(--coral-deep); font-size: 1rem; min-height: 1.5em; text-align: center; }
.autosave-note { font-size: 0.88rem; color: var(--ink-soft); background: #eefaf4; border-radius: var(--radius-sm); padding: 8px 12px; }
.save-box { max-width: 32rem; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.save-title { font-size: 1.2rem; }
.save-info { font-size: 0.92rem; color: var(--ink-soft); }
.save-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
.save-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: #f4fbf6;
}
.save-face { font-size: 1.6rem; flex: 0 0 auto; }
.save-meta { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.save-name { font-weight: normal; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-meta small { color: var(--ink-soft); font-size: 0.85rem; }
.save-btn { flex: 0 0 auto; min-height: 48px; padding: 8px 18px; font-size: 1rem; }
@media (max-width: 420px) {
  .save-row { flex-wrap: wrap; }
  .save-btn { flex: 1 1 100%; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

/* ---------- 캐릭터 (그림 / 대체 표시) ---------- */
.char-figure {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.char-figure img { max-width: 100%; max-height: 100%; object-fit: contain; }
.char-fallback {
  width: 82%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(2.4rem, 9vw, 4rem);
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.06);
}
.char-bg-1 { background: #ffe3ec; }
.char-bg-2 { background: #dcecff; }
.char-bg-3 { background: #dff7e4; }
.char-bg-4 { background: #efe3ff; }

/* ---------- 캐릭터 고르기 ---------- */
.screen-title { font-size: clamp(1.4rem, 5vw, 1.9rem); text-align: center; margin: 12px 0 20px; }
.char-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.char-card {
  font-family: inherit;
  color: inherit;
  background: #fff;
  border: 4px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  transition: transform 0.15s, border-color 0.15s;
}
.char-card:hover { transform: translateY(-3px); }
.char-card.is-selected { border-color: var(--mint-deep); background: #f0fcf7; transform: translateY(-4px); }
.char-card:focus-visible { outline: 3px solid var(--mint-deep); outline-offset: 2px; }
.char-look { font-size: 1.05rem; }
.char-desc { font-size: 0.9rem; color: var(--ink-soft); }
@media (max-width: 640px) {
  .char-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ---------- 말풍선 (작은 캐릭터 얼굴 + 대사) ---------- */
.speech {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.speech-face {
  flex: 0 0 64px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.speech-face .char-figure { width: 100%; height: 100%; }
.speech-face img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.speech-face .char-fallback { width: 100%; font-size: 2rem; }
.speech-bubble {
  position: relative;
  flex: 1;
  background: #fff;
  border-radius: var(--radius);
  padding: 14px 18px;
  box-shadow: var(--shadow);
  font-size: 1.1rem;
}
.speech-bubble::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 22px;
  border-width: 8px 12px 8px 0;
  border-style: solid;
  border-color: transparent #fff transparent transparent;
}

/* ---------- 튜토리얼 ---------- */
.tutorial-screen {
  min-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}
.tutorial-card { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.tutorial-figure { width: 160px; }
.tutorial-text { font-size: 1.25rem; min-height: 5.5em; display: flex; align-items: center; }
.dots { display: flex; gap: 10px; justify-content: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gray); }
.dot.is-on { background: var(--mint-deep); }

/* ---------- 게임 속 팝업 ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(40, 50, 60, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
  animation: fadeIn 0.2s ease;
}
.modal {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  padding: 24px 20px 20px;
  max-width: 30rem;
  width: 100%;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  text-align: center;
  animation: popIn 0.25s ease;
}
.modal-text { font-size: 1.2rem; }
@keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- 상단 상태바 ---------- */
.status-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: 1fr auto 1fr auto;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(6px);
  border-radius: 999px;
  box-shadow: var(--shadow);
  padding: 8px 16px;
  margin-bottom: 16px;
  font-size: 1.15rem;
}
.status-seeds { display: flex; align-items: center; gap: 6px; }
.status-trust { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.status-num { min-width: 2ch; text-align: right; transition: color 0.3s; }
.round-dots { display: flex; gap: 4px; color: var(--mint-deep); font-size: 0.95rem; letter-spacing: 1px; }
.round-dot { color: var(--gray-deep); }
.round-dot.is-on { color: var(--mint-deep); }
.trust-bar {
  width: clamp(60px, 16vw, 140px);
  height: 14px;
  background: #eef0f2;
  border-radius: 999px;
  overflow: hidden;
}
.trust-fill { height: 100%; border-radius: 999px; transition: width 0.2s linear, background 0.3s; }
.trust-fill.is-low  { background: var(--red); }
.trust-fill.is-mid  { background: var(--yellow-deep); }
.trust-fill.is-high { background: var(--green); }
.flash-up { animation: flashUp 1.2s ease; }
.flash-down { animation: flashDown 1.2s ease; }
@keyframes flashUp { 0%, 100% { color: inherit; transform: none; } 30% { color: var(--green-deep); transform: scale(1.25); } }
@keyframes flashDown { 0%, 100% { color: inherit; transform: none; } 30% { color: var(--red); transform: scale(1.25); } }
.status-code {
  font-family: inherit;
  font-size: 0.85rem;
  min-height: 36px;
  padding: 4px 10px;
  border: 2px solid var(--gray);
  border-radius: 999px;
  background: #fff;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
}
.status-code:hover { border-color: var(--mint-deep); color: var(--ink); }
/* 라운드가 바뀌어 저장됐을 때 [💾 코드] 버튼을 잠깐 반짝 */
.status-code.is-pulse { border-color: var(--mint-deep); color: var(--green-deep); animation: codePulse 1s ease 3; }
@keyframes codePulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(92, 201, 167, 0); } 50% { box-shadow: 0 0 0 6px rgba(92, 201, 167, 0.35); } }
@media (max-width: 480px) {
  .status-bar { grid-template-columns: auto 1fr auto auto; padding: 8px 10px; font-size: 1rem; gap: 5px; }
  .status-code { padding: 4px 7px; font-size: 0.75rem; }
  .round-dots { font-size: 0.7rem; gap: 1px; justify-content: center; letter-spacing: 0; }
  .status-seeds, .status-trust { gap: 3px; }
  .trust-bar { width: 44px; }
  .company-card { flex-direction: column; text-align: center; }
  .choice-buttons .btn { flex-basis: 120px; padding: 10px 14px; }
}

/* ---------- 라운드 화면 ---------- */
.round-screen, .condition-screen, .result-screen { display: flex; flex-direction: column; gap: 16px; }
.round-screen .status-bar, .condition-screen .status-bar, .result-screen .status-bar { margin-bottom: 0; }

.company-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #fff3b0 0%, #ffd6cc 50%, #d9f5ff 100%);
  box-shadow: var(--shadow), 0 0 0 3px #fff inset;
}
.company-card::after { /* 반짝이는 광고 느낌 */
  content: '';
  position: absolute;
  top: -50%;
  left: -60%;
  width: 40%;
  height: 200%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
  transform: rotate(20deg);
  animation: shine 3.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shine { 0% { left: -60%; } 60%, 100% { left: 130%; } }
.company-logo {
  flex: 0 0 84px;
  width: 84px;
  height: 84px;
  border-radius: 22px;
  background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.company-logo img { width: 100%; height: 100%; object-fit: contain; }
.logo-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  color: #fff;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
}
.logo-bg-1 { background: #ffb3c7; }
.logo-bg-2 { background: #9fd3ff; }
.logo-bg-3 { background: #b9a7f5; }
.logo-bg-4 { background: #8fdcb8; }
.logo-bg-5 { background: #ffc98a; }
.company-info { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 4px; }
.company-name { font-size: 1.6rem; color: var(--coral-deep); }
.company-slogan { font-size: 1.1rem; }
.company-slogan::before { content: '✨ '; }
.company-slogan::after { content: ' ✨'; }
.company-site { font-size: 0.95rem; color: var(--ink-soft); }
.company-site b { font-weight: normal; color: #2f5fa8; letter-spacing: 0.5px; font-family: 'Consolas', 'Menlo', monospace; }
.event-loss { justify-content: flex-start; }

.read-count { text-align: right; font-size: 1rem; color: var(--ink-soft); margin-bottom: -6px; }

/* 신문 모양 기사 카드 */
.news-list { display: flex; flex-direction: column; gap: 12px; }
.news-card {
  position: relative;
  background: var(--paper);
  border-radius: var(--radius-sm);
  border-top: 5px double #b9b2a0;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.news-head {
  width: 100%;
  min-height: 60px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 1.1rem;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.news-head:focus-visible { outline: 3px solid var(--mint-deep); outline-offset: -3px; }
.news-paper { font-size: 1.3rem; }
.news-title { flex: 1; }
.news-toggle { color: var(--gray-deep); font-size: 0.85rem; transition: transform 0.2s; }
.news-card.is-open .news-toggle { transform: rotate(180deg); }
.news-card.is-read .news-head { padding-right: 96px; }
.news-body { padding: 0 18px 16px; border-top: 1px dashed #d8d2c0; animation: fadeIn 0.25s ease; }
.news-text { padding-top: 6px; font-size: 1.05rem; line-height: 1.85; }
.news-para { margin: 0 0 0.9em; }
.news-para:last-child { margin-bottom: 0; }
/* 문단의 핵심 문장: 굵게 + 형광펜 */
.key-line {
  color: var(--ink);
  font-weight: 700;
  background: linear-gradient(transparent 58%, #fff0a0 58%);
  padding: 0 1px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.key-guide { margin-top: 10px; font-size: 0.85rem; color: var(--ink-soft); }
/* 어려운 말: 본문 밑줄 + 각주 */
.term {
  font: inherit;
  color: #2358a8;               /* 파란 글씨로 한눈에 (학생 설문 반영) */
  background: #e3efff;
  border: none;
  border-bottom: 2px solid #5b8fd9;
  border-radius: 4px 4px 0 0;
  padding: 0 2px;
  margin: 0;
  cursor: pointer;
  line-height: inherit;
}
.term.is-static { cursor: inherit; background: transparent; }
.term sup { color: #fff; background: #5b8fd9; border-radius: 999px; font-size: 0.62em; padding: 0 4px; margin-left: 2px; }
.term:hover { background: #cfe2ff; }
.term:focus-visible { outline: 2px solid #5b8fd9; outline-offset: 1px; }
/* 어려운 말 풀이 상자 — 눈에 띄게 (파란 테두리 + 제목) */
.footnote-box {
  margin: 14px 0 0;
  padding: 10px 12px 10px;
  background: #eef5ff;
  border: 2px solid #b9d3f5;
  border-left: 6px solid #5b8fd9;
  border-radius: var(--radius-sm);
}
.footnote-title { font-size: 0.92rem; color: #2f5fa8; margin-bottom: 4px; }
.footnotes {
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 0.95rem;
  color: var(--ink);
  text-align: left;
}
.footnote { padding: 2px 6px; border-radius: 6px; }
.footnote + .footnote { margin-top: 2px; }
.footnote b { color: var(--ink); font-weight: normal; }
.footnote-mark { color: #3d74c4; margin-right: 3px; }
.footnote.is-flash { animation: noteFlash 1.6s ease; }
@keyframes noteFlash { 0%, 60% { background: #fff0a8; } 100% { background: transparent; } }
.read-stamp {
  display: none;
  position: absolute;
  top: 10px;
  right: 40px;
  padding: 2px 10px;
  border: 3px solid var(--coral-deep);
  border-radius: 10px;
  color: var(--coral-deep);
  font-size: 0.95rem;
  transform: rotate(-8deg);
  background: rgba(255, 255, 255, 0.8);
  pointer-events: none;
}
.news-card.is-read .read-stamp { display: block; animation: stamp 0.35s ease; }
@keyframes stamp { from { transform: rotate(-8deg) scale(2); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }

/* 읽는 중 표시 (펼쳐 둔 시간만큼 막대가 차요) */
.read-progress {
  position: absolute; top: 10px; right: 40px; z-index: 1;
  display: flex; align-items: center; gap: 6px;
  font-size: 0.8rem; color: var(--ink-soft); background: rgba(255, 255, 255, 0.9);
  border-radius: 999px; padding: 2px 10px; pointer-events: none;
}
.read-progress b { font-weight: normal; }
.read-bar { width: 56px; height: 6px; background: #ece7d8; border-radius: 999px; overflow: hidden; }
.read-bar i { display: block; height: 100%; width: 0; background: var(--mint-deep); transition: width 0.25s linear; }
.news-card.is-read .read-progress { display: none; }

/* 📊 심화 자료 (조금 어려운 기사) */
.deep-card { border-top: 5px solid #7c6fd6; background: #fbfaff; }
.deep-label { margin: 10px 16px 0; font-size: 0.85rem; color: #5b4fc0; }
.deep-tag { flex: 0 0 auto; font-size: 0.78rem; color: #5b4fc0; background: #ece9ff; border-radius: 999px; padding: 2px 8px; font-family: var(--font); }
.deep-check { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm); background: #f1efff; border: 2px dashed #b8b0f0; display: flex; flex-direction: column; gap: 10px; }
.deep-locked { color: var(--ink-soft); font-size: 0.95rem; }
.deep-question { font-size: 1.02rem; line-height: 1.6; }
.deep-question b { font-weight: normal; font-family: var(--font); color: #5b4fc0; }
.deep-choices { display: flex; flex-direction: column; gap: 10px; }
.deep-choice { min-height: 56px; }
.deep-hint-text { color: #7a5a00; background: var(--yellow); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 0.95rem; }
.deep-answer { color: var(--green-deep); }
.deep-explain { font-size: 0.95rem; color: var(--ink); }
.deep-hint { text-align: center; font-size: 0.95rem; color: #5b4fc0; background: #ece9ff; border-radius: var(--radius-sm); padding: 10px 14px; }

/* 🔍 근거 문장 고르기 */
.evidence-box { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: var(--radius-sm); background: #f4fbf6; border: 2px solid var(--mint); }
.evidence-box.is-required { border-color: var(--mint-deep); }
.evidence-title small { color: var(--ink-soft); font-size: 0.85rem; }
.evidence-title b { font-weight: normal; font-family: var(--font); }
.evidence-guide { font-size: 0.92rem; color: var(--ink-soft); }
.evidence-chip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.evidence-empty { color: var(--gray-deep); font-size: 0.95rem; }
.evidence-quote { flex: 1 1 240px; background: #fff; border-left: 5px solid var(--mint-deep); padding: 8px 12px; border-radius: 8px; line-height: 1.6; }
.evidence-clear { min-height: 40px; padding: 6px 14px; font-size: 0.9rem; }
.evidence-feedback { font-size: 0.95rem; min-height: 0; }
.evidence-feedback.is-good { color: var(--green-deep); }
.evidence-feedback.is-check { color: #7a5a00; }
.pick-sent { cursor: pointer; border-radius: 4px; transition: background 0.15s; }
.pick-sent:hover, .pick-sent:focus-visible { background: #dff5ea; outline: none; }
.pick-sent.is-picked { background: #bff0e0; box-shadow: 0 0 0 2px var(--mint-deep); }
.diary-evidence { font-size: 0.92rem; color: var(--ink-soft); margin: 2px 0; }
.diary-evidence q { color: var(--ink); }

/* 선택 버튼 (화면 아래 고정) */
.choice-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(244, 251, 246, 0) 0%, rgba(244, 251, 246, 0.97) 22%);
}
.choice-inner {
  max-width: 48rem;
  margin: 0 auto;
  background: #fff;
  border-radius: var(--radius);
  box-shadow: 0 -2px 18px rgba(0, 0, 0, 0.1);
  padding: 12px 14px 14px;
}
.choice-label { text-align: center; margin-bottom: 10px; font-size: 1.05rem; }
.choice-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.choice-buttons .btn { flex: 1 1 150px; }
.sparkle-in { animation: sparkleIn 0.9s ease; }
@keyframes sparkleIn {
  0% { transform: scale(0.3); opacity: 0; box-shadow: 0 0 0 0 rgba(79, 191, 106, 0.8); }
  60% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 0 14px rgba(79, 191, 106, 0); }
  100% { transform: scale(1); }
}
.choice-spacer { flex: 0 0 auto; }

.toast {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 190px;
  margin: 0 auto;
  width: fit-content;
  z-index: 60;
  max-width: min(calc(100vw - 32px), 34rem);
  background: var(--green-deep);
  color: #fff;
  padding: 12px 20px;
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  text-align: center;
  font-size: 1.05rem;
  animation: toastIn 0.4s ease;
  transition: opacity 0.4s;
}
.toast.is-out { opacity: 0; }

/* 새 문자 알림 — 휴대폰 알림처럼 위에서 내려와 흔들려요 (약 6초) */
.msg-noti {
  top: 12px;
  bottom: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  font: inherit;
  background: #1f2937;
  color: #fff;
  border: 2px solid #fbbf24;
  cursor: pointer;
  animation: notiDrop 0.45s ease, notiShake 0.6s ease 0.5s 3;
}
.msg-noti-icon { font-size: 1.7rem; }
.msg-noti-body { display: flex; flex-direction: column; }
.msg-noti-body b { font-weight: normal; }
.msg-noti-body small { opacity: 0.85; font-size: 0.85rem; }
@keyframes notiDrop { from { transform: translateY(-140%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes notiShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px) rotate(-1.5deg); }
  40% { transform: translateX(7px) rotate(1.5deg); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
/* 이벤트 제목 위 "📱 새 문자 1개" 배지도 몇 번 흔들려요 */
.event-banner.is-new .event-banner-tag { display: inline-block; animation: tagWiggle 0.5s ease 0.3s 5; }
@keyframes tagWiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg) scale(1.08); } 75% { transform: rotate(8deg) scale(1.08); } }
/* 말풍선이 다 도착한 뒤에 선택지가 나타나요 */
.event-choices.is-waiting { visibility: hidden; opacity: 0; }
.event-choices.is-shown { animation: choicesIn 0.45s ease; }
@keyframes choicesIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .msg-noti, .event-banner.is-new .event-banner-tag { animation: none; }
}
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

/* ---------- 조건 고르기 ---------- */
.condition-company { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.3rem; }
.condition-company .company-logo { flex-basis: 48px; width: 48px; height: 48px; border-radius: 14px; }
.condition-company .logo-fallback { font-size: 1.4rem; }
.condition-company { flex-wrap: wrap; }
.condition-help { min-height: 40px; padding: 6px 14px; font-size: 0.95rem; }
.condition-help-box { display: flex; flex-direction: column; gap: 10px; text-align: left; }
.condition-help-steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: 1rem; line-height: 1.6; }
.condition-list { display: flex; flex-direction: column; gap: 14px; }
.condition-card {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  min-height: 72px;
  padding: 16px 18px;
  border: 3px solid var(--mint);
  border-radius: var(--radius);
  background: #fff;
  box-shadow: var(--shadow);
  font-family: inherit;
  font-size: 1.15rem;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: transform 0.12s, border-color 0.12s;
}
.condition-card:hover { border-color: var(--mint-deep); transform: translateY(-2px); }
.condition-card:focus-visible { outline: 3px solid var(--mint-deep); outline-offset: 2px; }
.condition-back { align-self: center; min-width: 200px; }
.condition-num {
  flex: 0 0 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--mint-deep);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---------- 결과 화면 ---------- */
.result-card { display: flex; flex-direction: column; gap: 14px; text-align: center; animation: popIn 0.35s ease; }
.delta-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.delta-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 1.1rem;
  background: #f1f3f5;
}
.delta-chip b { font-weight: normal; font-size: 1.3rem; }
.delta-chip.is-up { background: #e2f7e6; color: var(--green-deep); }
.delta-chip.is-down { background: #fde4e1; color: var(--red); }
.result-text { font-size: 1.2rem; line-height: 1.7; }
.learning-card {
  background: var(--yellow);
  border: 3px dashed var(--yellow-deep);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.learning-title { font-size: 0.95rem; color: #9a7a14; margin-bottom: 4px; }
.learning-text { font-size: 1.15rem; }
.learning-emoji { font-size: 1.3rem; }

/* ---------- 속보 팝업 ---------- */
.modal-breaking {
  padding-top: 0;
  overflow: hidden;
  border: 4px solid var(--red);
  animation: popIn 0.25s ease, shakeHard 0.6s ease 0.25s;
}
@keyframes shakeHard {
  0%, 100% { transform: rotate(0); }
  15% { transform: rotate(-3deg) translateX(-6px); }
  30% { transform: rotate(3deg) translateX(6px); }
  45% { transform: rotate(-2deg) translateX(-4px); }
  60% { transform: rotate(2deg) translateX(4px); }
  75% { transform: rotate(-1deg); }
}
.breaking { display: flex; flex-direction: column; gap: 14px; }
.breaking-band {
  margin: 0 -20px;
  padding: 10px;
  background: var(--red);
  color: #fff;
  font-size: 1.6rem;
  letter-spacing: 8px;
  background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0 10px, transparent 10px 20px);
}
.breaking-head { font-size: 1.1rem; }
.breaking-text {
  background: var(--paper);
  border-top: 4px double #b9b2a0;
  padding: 12px;
  border-radius: 8px;
  font-size: 1.1rem;
  text-align: left;
}
.breaking-seeds { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.5rem; }
.news-seeds-num { font-weight: normal; }
.breaking-loss { color: var(--red); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ---------- 이어하기 코드 ---------- */
.code-box { max-width: 32rem; width: 100%; margin: 0 auto; }
.code-summary { cursor: pointer; font-size: 1.1rem; min-height: 32px; }
.code-box[open] .code-summary { margin-bottom: 8px; }
.code-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.code-input {
  flex: 1 1 160px;
  font-family: inherit;
  font-size: 1.3rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  min-height: 52px;
  border-radius: var(--radius-sm);
  border: 3px solid var(--yellow);
  background: var(--paper);
  color: var(--ink);
}
.code-input:focus { outline: none; border-color: var(--yellow-deep); }
.code-row .btn { flex: 1 1 140px; }
.code-error { color: var(--coral-deep); min-height: 1.4em; text-align: center; margin-top: 6px; }
.code-popup { display: flex; flex-direction: column; gap: 12px; }
.code-title { font-size: 1.3rem; }
.code-value {
  font-size: 2.2rem;
  letter-spacing: 6px;
  background: var(--yellow);
  border: 3px dashed var(--yellow-deep);
  border-radius: var(--radius-sm);
  padding: 10px;
  user-select: all;
}
.code-guide { font-size: 1rem; }
.code-note { font-size: 0.88rem; color: var(--ink-soft); }

/* ---------- 투자 결정서 ---------- */
.decision-screen { display: flex; flex-direction: column; gap: 16px; }
.decision-screen .status-bar { margin-bottom: 0; }
.decision-card { display: flex; flex-direction: column; gap: 12px; border-top: 6px solid var(--mint-deep); }
.decision-title { font-size: 1.5rem; text-align: center; }
.decision-choice {
  display: flex; flex-direction: column; gap: 4px;
  background: #f4fbf6; border-radius: var(--radius-sm); padding: 10px 14px;
}
.decision-choice-label { font-size: 0.9rem; color: var(--ink-soft); }
.decision-choice-name { font-weight: normal; font-size: 1.15rem; }
.decision-invest { color: var(--coral-deep); }
.decision-condition { color: var(--green-deep); }
.decision-question { font-size: 1.1rem; }
.decision-frame { font-size: 0.92rem; color: #7a5a00; background: var(--yellow); border-radius: var(--radius-sm); padding: 7px 12px; margin-top: -4px; }
.decision-input::placeholder { color: #9aa3ad; }
.decision-input {
  font-family: inherit;
  font-size: 1.1rem;
  line-height: 1.6;
  width: 100%;
  min-height: 120px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 3px solid var(--mint);
  background: var(--paper);
  color: var(--ink);
  resize: vertical;
}
.decision-input:focus { outline: none; border-color: var(--mint-deep); }
.decision-count { text-align: right; font-size: 0.9rem; color: var(--ink-soft); margin-top: -6px; }
.decision-count.is-ok { color: var(--green-deep); }
.decision-error { color: var(--coral-deep); text-align: center; min-height: 1.4em; }
.decision-articles summary { cursor: pointer; font-size: 1.05rem; padding: 10px 4px; min-height: 44px; }
.decision-articles .news-list { margin-top: 6px; }

/* ---------- 보너스 라운드 · 긴급 상황 ---------- */
.event-screen { display: flex; flex-direction: column; gap: 16px; }
.event-screen .status-bar { margin-bottom: 0; }
.event-banner {
  text-align: center;
  padding: 16px;
  border-radius: var(--radius);
  background: repeating-linear-gradient(135deg, #ffe08a 0 14px, #ffd166 14px 28px);
  box-shadow: var(--shadow);
  animation: popIn 0.4s ease;
}
.event-banner.is-bonus { background: repeating-linear-gradient(135deg, #c9f0dc 0 14px, #b3e8cd 14px 28px); }
.event-banner-tag {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font-size: 1rem;
  animation: blink 1.2s ease-in-out 3;
}
.event-banner.is-bonus .event-banner-tag { background: var(--green-deep); }
/* 예고 없이 오는 새 메시지: 눈에 띄지 않는 평범한 알림 모양 */
.event-banner.is-message { background: #fff; }
.event-banner.is-message .event-banner-tag { background: #5b6b7d; animation: none; }
.tips-card { background: #eef6ff; border: 3px solid #b9d6f5; }
.tips-title { font-size: 1.15rem; margin: 0 0 8px; }
.tips-list { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.tips-list li { line-height: 1.6; }
.event-feedback.is-retry { border-left-color: #7aa7d9; }
.event-choice.is-tried { opacity: 0.5; cursor: not-allowed; border-style: dashed; transform: none; }
.event-choice.is-tried .condition-num { background: var(--gray-deep); }
.event-choice.is-tried .condition-text { text-decoration: line-through; }
@keyframes blink { 50% { opacity: 0.35; } }
.event-title { font-size: 1.5rem; margin-top: 8px; }
.event-narration { font-size: 1.1rem; background: #fff; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.event-articles { display: flex; flex-direction: column; gap: 12px; }

.phone {
  max-width: 26rem;
  width: 100%;
  margin: 0 auto;
  border-radius: 28px;
  background: #2f3542;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}
.phone-top {
  display: flex; align-items: center; gap: 8px;
  color: #fff; padding: 6px 10px 10px; font-size: 1rem;
}
.phone-top b { font-weight: normal; }
.phone-body {
  background: #b8d4e8;
  border-radius: 20px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 160px;
}
.chat-msg { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; animation: chatIn 0.35s ease both; }
@keyframes chatIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.chat-from { font-size: 0.82rem; color: #3a4a5a; margin-left: 6px; }
.chat-bubble {
  max-width: 90%;
  background: #fff;
  border-radius: 4px 16px 16px 16px;
  padding: 8px 12px;
  font-size: 1rem;
  line-height: 1.5;
  word-break: break-all;
}
.chat-msg.is-link .chat-bubble { color: #1a5fd0; text-decoration: underline; font-family: 'Consolas', 'Menlo', monospace; letter-spacing: 0.5px; }
.chat-msg.is-image .chat-bubble { background: #eef1f4; color: var(--ink-soft); font-style: italic; }
.chat-msg.is-video .chat-bubble { background: #1f2430; color: #fff; }

.event-question { font-size: 1.2rem; text-align: center; margin-bottom: 4px; }
.event-choices { display: flex; flex-direction: column; gap: 12px; }
.event-after { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 80px; }
.event-feedback { display: flex; flex-direction: column; gap: 10px; border-left: 8px solid var(--gray); }
.event-feedback.is-good { border-left-color: var(--green); }
.event-feedback.is-ok { border-left-color: var(--yellow-deep); }
.event-feedback.is-bad { border-left-color: var(--red); }
.event-my-choice { font-size: 0.95rem; color: var(--ink-soft); }
.event-my-choice::before { content: '👉 '; }
.event-level { font-size: 1.35rem; }
.event-feedback-text { font-size: 1.1rem; line-height: 1.7; }

/* ---------- 5라운드 후 전환 화면 ---------- */
body.is-dark { background: #14171f; }
.transition-screen {
  min-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  color: #fff;
  text-align: center;
  cursor: pointer;
  animation: fadeIn 1.2s ease;
}
.transition-figure { width: 120px; opacity: 0.9; }
.transition-line { font-size: clamp(1.3rem, 4.5vw, 1.9rem); line-height: 1.6; max-width: 640px; }
.transition-btn { min-width: 200px; }

/* ---------- 엔딩 화면 ---------- */
.ending-screen { display: flex; flex-direction: column; gap: 16px; }
.ending-stage {
  position: relative;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-top: -16px;
  height: 100vh;
  height: 100dvh;
  min-height: 480px;
  overflow: hidden;
  cursor: pointer;
  background: #000;
}
.ending-bg, .ending-bg img, .ending-bg-fallback { position: absolute; inset: 0; width: 100%; height: 100%; }
.ending-bg img { object-fit: cover; }
.ending-bg-fallback { display: flex; align-items: flex-start; justify-content: center; }
.ending-bg-emoji { font-size: clamp(6rem, 22vw, 12rem); margin-top: 18vh; opacity: 0.9; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15)); }
.ending-curtain {
  position: absolute; inset: 0; background: #000; z-index: 5;
  transition: opacity 1.6s ease;
  pointer-events: none;
}
.ending-curtain.is-open { opacity: 0; }
.ending-character {
  position: absolute;
  left: 50%;
  bottom: 24%;
  width: clamp(130px, 26vh, 240px);
  transform: translate(-50%, 40px);
  opacity: 0;
  transition: opacity 0.8s ease, transform 0.8s ease;
  z-index: 2;
}
.ending-stage.is-character .ending-character { opacity: 1; transform: translate(-50%, 0); }
@media (orientation: portrait) {
  .ending-character { bottom: 40%; } /* 세로 화면에서는 대화창에 가리지 않게 조금 위로 */
}
.ending-title {
  position: absolute;
  top: 6%;
  left: 0;
  right: 0;
  margin: 0 auto;
  width: fit-content;
  max-width: min(calc(100vw - 32px), 760px);
  padding: 8px 26px;
  border-radius: 999px;
  background: rgba(40, 60, 50, 0.45);
  transform: translateY(20px) scale(0.9);
  text-align: center;
  font-size: clamp(1.7rem, 5.5vw, 3rem);
  color: #fff;
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25), 0 0 20px rgba(0, 0, 0, 0.35);
  opacity: 0;
  transition: opacity 0.9s ease, transform 0.9s ease;
  z-index: 3;
}
.ending-stage.is-title .ending-title { opacity: 1; transform: none; }
.ending-dialog {
  position: absolute;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  width: min(calc(100vw - 32px), 820px);
  max-height: 42%;
  overflow-y: auto;
  background: rgba(255, 255, 255, 0.94);
  border: 4px solid #fff;
  outline: 3px solid rgba(92, 201, 167, 0.8);
  border-radius: var(--radius);
  padding: 16px 20px 10px;
  opacity: 0;
  transition: opacity 0.6s ease;
  z-index: 4;
}
.ending-stage.is-dialog .ending-dialog { opacity: 1; }
.ending-story { font-size: clamp(1.02rem, 2.6vw, 1.25rem); line-height: 1.75; min-height: 3.5em; }
.ending-tap { font-size: 0.85rem; color: var(--ink-soft); text-align: right; margin-top: 6px; }

.ending-after { display: flex; flex-direction: column; gap: 16px; animation: fadeIn 0.6s ease; }
.ending-after > .card { display: flex; flex-direction: column; gap: 12px; }
.section-title { font-size: 1.2rem; }
.ending-stats { flex-direction: row !important; justify-content: space-around; flex-wrap: wrap; text-align: center; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
.stat span { color: var(--ink-soft); }
.stat b { font-weight: normal; font-size: 2rem; }
.trust-high { color: var(--green-deep); }
.trust-mid { color: #c99a10; }
.trust-low { color: var(--red); }
.badge-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.badge-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: #f4fbf6; border-radius: var(--radius-sm); padding: 8px 4px; text-align: center;
}
.badge-round { font-size: 0.8rem; color: var(--ink-soft); }
.badge-icon { font-size: 1.8rem; line-height: 1.2; }
.badge-company { font-size: 0.8rem; word-break: keep-all; }
.badge-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; color: var(--ink-soft); }
.promise-card { background: var(--yellow); }
.promise-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.promise-list li { background: rgba(255, 255, 255, 0.7); border-radius: 10px; padding: 8px 12px; }
.diary-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.diary-item { border-bottom: 1px dashed var(--gray); padding-bottom: 8px; }
.diary-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.diary-head b { font-weight: normal; }
.diary-choice { font-size: 0.8rem; background: var(--mint); border-radius: 999px; padding: 1px 10px; }
.diary-text { font-size: 1rem; color: var(--ink); margin-top: 4px; white-space: pre-wrap; }
.event-summary { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.event-summary li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #f7f7f2; border-radius: 10px; padding: 8px 12px; }
.event-summary b { font-weight: normal; }
.ending-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.ending-retry { display: flex; flex-direction: column; gap: 10px; }
.ending-hint { background: #fff; border-radius: var(--radius-sm); padding: 12px 14px; box-shadow: var(--shadow); text-align: center; }
.ending-cert-btn { font-size: 1.3rem; min-height: 60px; }
@media (max-width: 480px) {
  .badge-list { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .badge-company { font-size: 0.68rem; }
}

/* ---------- 인증서 (1123×794 고정, 화면에서는 비율 유지해 축소) ---------- */
.cert-screen { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.cert-frame { width: 100%; position: relative; overflow: hidden; }
.cert {
  width: 1123px;
  height: 794px;
  transform-origin: top left;
  position: absolute;
  top: 0;
  left: 0;
  font-family: var(--font);
  color: #3b3a2e;
}
.cert-vine { /* 연두색·금색 넝쿨 무늬 테두리 (이미지 저장 도구가 그릴 수 있는 테두리로 만들었어요) */
  width: 100%;
  height: 100%;
  padding: 8px;
  border-radius: 14px;
  background: #d4a93a;
}
.cert-vine-leaf {
  width: 100%;
  height: 100%;
  padding: 10px;
  border-radius: 10px;
  background: #8fcb5c;
  border: 7px dashed #f3dc84;
}
.cert-paper {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 8px;
  background: #fffdf3;
  border: 6px double #c9a03a;
  padding: 34px 70px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.cert-corner { position: absolute; font-size: 44px; line-height: 1; }
.cert-corner-tl { top: 8px; left: 10px; }
.cert-corner-tr { top: 8px; right: 10px; transform: scaleX(-1); }
.cert-corner-bl { bottom: 8px; left: 10px; transform: scaleY(-1); }
.cert-corner-br { bottom: 8px; right: 10px; transform: scale(-1, -1); }
.cert-academy { font-size: 24px; color: #5f8f3a; letter-spacing: 2px; }
.cert-title {
  font-size: 64px;
  color: #3f7a2a;
  letter-spacing: 10px;
  margin: 4px 0 18px;
  padding-bottom: 8px;
  border-bottom: 3px solid #d9b44a;
}
.cert-main { display: flex; align-items: center; gap: 44px; width: 100%; flex: 1; }
.cert-figure {
  flex: 0 0 230px;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: radial-gradient(circle, #f3fbe9 0 60%, #e2f2cf 100%);
  border: 5px solid #d9b44a;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.cert-figure .char-figure { width: 88%; height: 88%; }
.cert-figure .char-fallback { font-size: 96px; width: 100%; }
.cert-info { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.cert-honor {
  align-self: flex-start;
  font-size: 26px;
  color: #fff;
  background: #6aa84f;
  border-radius: 999px;
  padding: 4px 22px;
}
.cert-honor::before { content: '🌳 '; }
.cert-name { font-size: 48px; color: #2f3d22; border-bottom: 2px dashed #c9a03a; padding-bottom: 4px; }
.cert-body { font-size: 22px; line-height: 1.75; word-break: keep-all; }
.cert-bottom { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px; }
.cert-stats { display: flex; flex-direction: column; gap: 4px; font-size: 19px; }
.cert-stats p { display: flex; gap: 12px; align-items: baseline; }
.cert-stats span { color: #7a7563; min-width: 150px; }
.cert-stats b { font-weight: normal; font-size: 24px; }
.cert-badges { letter-spacing: 4px; }
.cert-sign { display: flex; align-items: center; gap: 22px; }
.cert-date { font-size: 22px; }
.cert-stamp {
  width: 104px;
  height: 104px;
  border-radius: 50%;
  border: 6px solid #d8342f;
  color: #d8342f;
  font-size: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-14deg);
  box-shadow: inset 0 0 0 3px #fffdf3, inset 0 0 0 5px #d8342f;
  background: rgba(255, 240, 238, 0.6);
}
.cert-buttons .btn { flex: 1 1 200px; }
.cert-status { text-align: center; color: var(--green-deep); min-height: 1.5em; }
.cert-hint {
  text-align: center;
  font-size: 0.95rem;
  color: var(--ink-soft);
  background: var(--yellow);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
}
/* 인증서 아래 결과 코드 (설문에 쓸 때 돌아가지 않아도 되게) */
.cert-code { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 14px 16px; }
.cert-code-label { color: var(--ink-soft); font-size: 1rem; }
.cert-code-value { font-size: 2rem; letter-spacing: 5px; color: var(--green-deep); }
.cert-code-hint { color: var(--ink-soft); font-size: 0.88rem; }

/* ---------- 선생님용 관리자 모드 ---------- */
.teacher-box .code-summary { color: var(--ink-soft); font-size: 1rem; }
.teacher-input { letter-spacing: 2px; }
.teacher-screen { display: flex; flex-direction: column; gap: 14px; padding-bottom: 24px; }
.teacher-group { display: flex; flex-direction: column; gap: 10px; }
.teacher-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
.teacher-buttons .btn { flex: 1 1 240px; font-size: 1rem; min-height: 50px; }
.teacher-saved-count { color: var(--ink-soft); }
.roster-name { flex: 1 1 120px; letter-spacing: 0; font-size: 1.1rem; text-align: left; padding: 8px 14px; }
.roster-code { flex: 1 1 180px; }
.roster-box { margin-top: 4px; }
.roster-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
.roster-row {
  display: flex; align-items: center; gap: 10px;
  background: #f4fbf6; border-radius: var(--radius-sm); padding: 8px 12px;
}
.roster-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.roster-main b { font-weight: normal; font-size: 1.05rem; }
.roster-main small { color: var(--ink-soft); font-size: 0.85rem; }
.roster-ending { font-size: 0.9rem; color: var(--green-deep); }
.roster-del { flex: 0 0 auto; min-height: 40px; padding: 4px 14px; font-size: 0.9rem; }

/* 제출용 결과 (엔딩 화면) */
.submit-card { border-top: 6px solid var(--yellow-deep); }
.submit-code { font-size: 2rem; margin: 4px 0; }
.submit-sub { font-size: 1rem; color: var(--ink-soft); margin-top: 6px; }
.copy-box {
  width: 100%;
  font-family: inherit;
  font-size: 0.95rem;

<script>/* =====================================================================
   신뢰를 사다 — 게임 로직
   문구·수치는 모두 data.js(GAME_DATA)에 있어요.
   ===================================================================== */
(function () {
  'use strict';

  const D = GAME_DATA;
  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modal-root');

  /* ------------------------------------------------------------------
     상태
     ------------------------------------------------------------------ */
  function freshState() {
    return {
      // start | character | tutorial | round | condition | decision | result | event | transition | ending | certificate
      screen: 'start',
      nickname: '',
      character: null,        // 1~4
      tutorialPage: 0,
      round: 1,               // 1~5
      seeds: D.settings.startSeeds,
      trust: D.settings.startTrust,
      choices: D.rounds.map(() => null), // 라운드별 선택 기록 { type, read, condition, reason }
      readArticles: [],       // 현재 라운드에서 읽은 기사 번호
      conditionToastShown: false,
      conditionOrder: null,   // 조건 고르기 화면에서 섞인 순서
      pendingChoice: null,    // 투자 결정서를 쓰는 중인 선택 { type, condition }
      reasonDraft: '',        // 쓰고 있는 투자 결정서
      lastResult: null,       // 결과 화면에 보여줄 내용
      pendingNews: null,      // 아직 안 보여준 속보(라운드 번호)
      eventResults: {},       // 보너스 라운드·긴급 상황 선택 { afterRound: 고른 번호 }
      eventOrder: null,       // 이벤트 선택지 섞인 순서
      eventRead: [],          // 보너스 라운드에서 읽은 기사 번호
      eventWrong: [],         // 보너스 문제에서 이미 골랐던 오답 번호
      eventHint: null,        // 지금 힌트를 보여주고 있는 오답 번호
      eventRetried: {},       // 오답 뒤에 정답을 찾은 문제 { afterRound: true }
      phone: { inbox: [], unread: [], results: {} }, // 📱 받은 문자 id, 안 읽은 문자 id, 처리 결과 { id: 결과 }
      deep: freshDeep(),      // 지금 라운드의 📊 심화 자료 { read, answered, wrong:[], order }
      deepResults: {},        // 라운드별 심화 확인 문제를 한 번에 맞혔는지 { 라운드: true/false }
      evidenceDraft: '',      // 결정서에서 고르고 있는 근거 문장
      certDate: null,         // 인증서 발급일(처음 받은 날)
      special: null,          // ⭐ 스페셜 라운드 { read, answers, submitted, correct, order, picking, choice, bonus }
      badgesNew: [],          // 🏅 이번 판에서 처음 얻은 배지 id
      // 공모전판(2026-10): 자기 점검과 공정성 활동. 점수·엔딩·결과 코드와는 상관없어요.
      pre: null,              // 🧪 사전 자기 점검 [0~3, 0~3, 0~3, 0~3]
      post: null,             // 🧪 사후 자기 점검
      fair: null              // ⚖️ 공정성 생각 열기에서 고른 번호
    };
  }
  function freshDeep() { return { read: false, answered: false, wrong: [], order: null }; }

  let state = freshState();

  /* ------------------------------------------------------------------
     타이머 (화면이 바뀌면 모두 멈춰요)
     ------------------------------------------------------------------ */
  let timers = [];
  function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  /* ------------------------------------------------------------------
     저장 (브라우저 localStorage, 별명마다 따로)
     같은 기기·같은 브라우저에서 다음 날 이어서 할 수 있어요.
     ------------------------------------------------------------------ */
  let savingEnabled = true; // 테스트 모드에서는 꺼요(6단계)

  /* ⏱ 수업 운영 모드 (2026-10 공모전판)
     기본(80분 2차시): 심화 자료 + 읽는 시간 바닥 그대로.
     간편(40분 1차시): 심화 자료를 선택 활동으로 돌리고 읽는 시간 바닥을 줄여요(약 25~30분).
     선생님 모드에서 바꾸며, 그 기기에만 저장돼요. 주소 끝에 ?quick=1 / ?quick=0 으로도 바꿀 수 있어요. */
  const MODE_KEY = 'trustGame_mode_v1';
  function quickMode() {
    try { return localStorage.getItem(MODE_KEY) === 'quick'; } catch (e) { return false; }
  }
  function applyMode() {
    if (!quickMode()) return;
    D.settings.deepForCondition = false;
    D.settings.evidenceForCondition = false;
    D.settings.readFloor = { charsPerSec: 16, minSec: 5, maxSec: 22 };
  }
  function setQuickMode(on) {
    try { localStorage.setItem(MODE_KEY, on ? 'quick' : 'full'); } catch (e) { /* 저장소를 못 쓰면 이번만 적용 */ }
    if (on) { applyMode(); } else { location.reload(); }
  }

  function readSaves() {
    try {
      const raw = localStorage.getItem(D.settings.saveKey);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && parsed.slots && typeof parsed.slots === 'object') return parsed;
    } catch (e) { /* 저장소를 쓸 수 없거나 망가진 경우 */ }
    return { slots: {} };
  }

  function writeSaves(all) {
    try { localStorage.setItem(D.settings.saveKey, JSON.stringify(all)); } catch (e) { /* 저장 실패는 조용히 넘어가요 */ }
  }

  function save() {
    if (!savingEnabled || !state.nickname || state.screen === 'start') return;
    const all = readSaves();
    all.slots[state.nickname] = { state: state, savedAt: Date.now() };
    const names = Object.keys(all.slots).sort((a, b) => all.slots[b].savedAt - all.slots[a].savedAt);
    names.slice(D.settings.maxSaves).forEach((n) => { delete all.slots[n]; });
    writeSaves(all);
  }

  function savedList() {
    const all = readSaves();
    return Object.keys(all.slots)
      .map((name) => Object.assign({ name: name }, all.slots[name]))
      .filter((s) => s.state && typeof s.state === 'object')
      .sort((a, b) => b.savedAt - a.savedAt);
  }

  function resume(name) {
    const slot = readSaves().slots[name];
    if (!slot || !slot.state) return;
    state = Object.assign(freshState(), slot.state);
    render();
    afterRestore();
  }

  // 아직 안 보여준 속보가 있으면 이어하기 직후 보여줘요
  function afterRestore() {
    if (state.pendingNews && state.screen === 'result') showNews();
  }

  /* ------------------------------------------------------------------
     작은 도구들
     ------------------------------------------------------------------ */

  /* ---------- 받침에 따라 조사 고르기 ----------
     예) '얼굴천재'이에요 → '얼굴천재'예요, '익명톡'이에요 → 그대로
     한글이 아닌 끝 글자는 한국어로 읽는 소리로 판단해요.
     (영어 L·M·N·R, 숫자 0·1·3·6·7·8 은 받침이 있는 소리) */
  const JOSA_PAIRS = [
    ['이에요', '예요'], ['이었', '였'], ['이랑', '랑'], ['으로', '로'],
    ['이', '가'], ['은', '는'], ['을', '를'], ['과', '와'], ['아', '야']
  ];
  const JOSA_PATTERN = JOSA_PAIRS.flat().sort((a, b) => b.length - a.length).join('|');
  const PLACEHOLDER_RE = new RegExp('(\\{닉네임\\}|\\[기업명\\])([\'"‘’“”)\\]」』]*)(' + JOSA_PATTERN + ')?', 'g');

  // 받침 정보: null(판단 불가) / { has: 받침 있음?, rieul: 받침이 ㄹ? }
  function finalSound(word) {
    const chars = Array.from(String(word));
    for (let i = chars.length - 1; i >= 0; i--) {
      const ch = chars[i];
      const code = ch.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        const jong = (code - 0xAC00) % 28;
        return { has: jong !== 0, rieul: jong === 8 };
      }
      if (/[a-zA-Z]/.test(ch)) {
        const up = ch.toUpperCase();
        return { has: 'LMNR'.includes(up), rieul: 'LR'.includes(up) };
      }
      if (/[0-9]/.test(ch)) {
        return { has: '013678'.includes(ch), rieul: '178'.includes(ch) };
      }
      if (/[ㄱ-ㅎ]/.test(ch)) return { has: true, rieul: ch === 'ㄹ' };
      if (/[ㅏ-ㅣ]/.test(ch)) return { has: false, rieul: false };
      // 이모지·기호 등은 건너뛰고 앞 글자를 봐요
    }
    return null;
  }

  function pickJosa(word, josa) {
    const pair = JOSA_PAIRS.find((p) => p.includes(josa));
    const sound = finalSound(word);
    if (!pair || !sound) return josa; // 판단할 수 없으면 원래 문구 그대로
    if (pair[0] === '으로') return sound.has && !sound.rieul ? '으로' : '로';
    return sound.has ? pair[0] : pair[1];
  }

  // {닉네임}, [기업명] 자리 바꿔 넣기 + 뒤에 붙은 조사 맞추기
  // (결과는 항상 textContent 로만 화면에 넣어요)
  function fill(text, company) {
    const values = { '{닉네임}': state.nickname };
    if (company !== undefined) values['[기업명]'] = company;
    return String(text).replace(PLACEHOLDER_RE, (whole, key, quote, josa) => {
      if (!(key in values)) return whole;
      const word = values[key];
      return word + quote + (josa ? pickJosa(word, josa) : '');
    });
  }

  // 요소 만들기. 글자는 모두 textContent/텍스트 노드로 넣어서 HTML로 해석되지 않아요.
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    if (props) {
      for (const key of Object.keys(props)) {
        const value = props[key];
        if (value === undefined || value === null || value === false) continue;
        if (key === 'className') node.className = value;

  // 숫자가 올라가거나 내려가는 애니메이션

    let done = false;
    function finish() {
      if (done) return;
      done = true;
      onFrame(to);
      if (onDone) onDone();
    }
    function step(now) {
      if (done) return;
      const t = Math.min(1, (now - start) / ms);
      if (t >= 1) { finish(); return; }
      const eased = 1 - Math.pow(1 - t, 3);
      onFrame(Math.round(from + (to - from) * eased));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    // 탭이 가려져 애니메이션이 멈춰도 마지막 값은 꼭 보여줘요
    setTimeout(finish, ms + 150);

  /* ------------------------------------------------------------------

  // type: invest | pass | condition, readCount: 읽은 기사 수, condition: 조건 번호
  function scoreOf(R, type, readCount, condition) {

  /* ------------------------------------------------------------------
     이어하기 코드
     담기는 것: 캐릭터, 끝낸 라운드 수, 라운드별 선택, 남은 속보, 이벤트 선택

  const CODE_ALPHABET = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // 헷갈리는 0·1·I·O 없음
  /* 2026-10 공모전판: 아이들이 공책에 옮겨 적는 코드라 7글자(XXXX-XXX)로 짧게 유지해요.
     담는 것: 캐릭터 · 라운드 6개의 선택 · 남은 속보 · 이벤트 4개 (35비트에 딱 맞춰요)
     끝낸 라운드 수는 선택에서 계산하고, 자기 점검·공정성 기록은 코드에 넣지 않아요

  const CODE_LEN = 7;                        // 7글자 = 35비트

    }

  /* ------------------------------------------------------------------
     🔖 확장 코드 5글자 (2026-10 공모전판)
     이어하기 코드와 결과 코드 뒤에 "-XXXXX" 로 붙여요.
       담는 것: 🧪 사전 점검 4문항 · 🧪 사후 점검 4문항 · ⚖️ 공정성 선택 · ⏱ 모드 · ⚖️ 보너스 라운드 선택
       담지 않는 것: 별명, 그 밖의 어떤 개인정보도 담기지 않아요.

  function bonusCodeValue() { return 0; }
  function makeExt(st) {
    st = st || state;
    const hasPre = Array.isArray(st.pre), hasPost = Array.isArray(st.post);
    const pre = hasPre ? packFour(st.pre) : 0;
    const post = hasPost ? packFour(st.post) : 0;
    const flag = (hasPre ? 1 : 0) + (hasPost ? 2 : 0);              // 0~3
    const fair = (st.fair === 0 || st.fair) ? st.fair + 1 : 0;      // 0 없음, 1~3
    const quick = quickMode() ? 1 : 0;
    const bonus = bonusCodeValue(st);                                // 0~4
    let p = pre;
    p = p * 256 + post;
    p = p * 4 + flag;
    p = p * 4 + fair;
    p = p * 2 + quick;
    p = p * 5 + bonus;                                               // 최대 256*256*4*4*2*5 = 10,485,760
    const full = p * 2 + (codeChecksum(p) % 2);                      // 1비트 검사값

    let n = (full * EXT_MUL) % 33554432;                             // 32^5 안에서 섞기
    let out = '';
    for (let i = 0; i < EXT_LEN; i++) { out = CODE_ALPHABET[n % 32] + out; n = Math.floor(n / 32); }

    let t = 0, newT = 1, r = 33554432, newR = EXT_MUL;
    while (newR !== 0) {

    return ((t % 33554432) + 33554432) % 33554432;

  // "1234-5678-ABCDE" → { base: '12345678', ext: 'ABCDE' }
  function splitCode(input) {

    const joined = parts.join('');

  function choiceCode(c) {

  function makeCode() {
    let p = CODE_VERSION;                       // 이 판의 코드라는 표시
    p = p * 4 + (state.character - 1);
    p = p * 2 + (state.pendingNews ? 1 : 0);
    for (let i = 0; i < D.rounds.length; i++) p = p * 8 + choiceCode(state.choices[i]);
    for (const ev of D.events) {
      const v = state.eventResults[ev.afterRound];
      p = p * 4 + (v === undefined || v === null ? 0 : v + 1);
    }
    const full = BigInt(p) * 32n + BigInt(codeChecksum(p));

  /* ------------------------------------------------------------------

  const RESULT_MOD = 100000000n;   // 8자리

  const RESULT_MAX = Math.pow(6, D.rounds.length) * Math.pow(4, D.events.length);
  const RESULT_PHONE_MAX = 3;   // 📱 속은 횟수(0~3, 사기 문자가 3개)를 맨 앞자리에 — 범위가 좁을수록 잘못 적은 코드를 더 잘 걸러요

  function resultChoiceCode(c) {
    if (!c) return 0;
    if (c.type === 'invest') return 1;
    if (c.type === 'pass') return c.read >= 1 ? 2 : 3;
    return c.type === 'conditionCorrect' ? 4 : 5;
  }

  // st 를 넘기면 그 게임(저장 목록의 게임 등)의 코드를 만들어요
  function makeResultCode(st) {
    st = st || state;
    let p = 0;
    for (let i = 0; i < D.rounds.length; i++) p = p * 6 + resultChoiceCode(st.choices[i]);
    for (const ev of D.events) {
      const v = st.eventResults[ev.afterRound];
      p = p * 4 + (v === undefined || v === null ? 0 : v + 1);
    }
    // 📱 사기 문자에 속은 횟수는 맨 앞자리에 담아요 (0번이면 예전 코드와 똑같아요)
    p += Math.min(RESULT_PHONE_MAX, phoneCaughtCount(st)) * RESULT_MAX;
    const n = (BigInt(p) * RESULT_MUL) % RESULT_MOD;
    const s = n.toString().padStart(8, '0');
    const base = s.slice(0, 4) + '-' + s.slice(4);
    // 자기 점검·공정성 기록이 있을 때만 뒤에 5글자를 붙여요 (없으면 숫자 8자리로 짧게)
    const hasExtra = Array.isArray(st.pre) || Array.isArray(st.post) || st.fair === 0 || st.fair;
    return hasExtra ? base + '-' + makeExt(st) : base;
  }

  function parseResultCode(input) {
    const split = splitCode(input);
    const ext = split.ext ? parseExt(split.ext) : null;
    if (split.ext && !ext) return null;
    const clean = split.base.replace(/[^0-9]/g, '');
    if (clean.length !== 8) return null;
    let p = Number((BigInt(clean) * RESULT_MUL_INV) % RESULT_MOD);
    if (!(p >= 0) || p >= RESULT_MAX * (RESULT_PHONE_MAX + 1)) return null;   // 잘못 적은 코드는 여기서 걸러져요
    const phone = Math.floor(p / RESULT_MAX);
    p = p % RESULT_MAX;
    const events = [];
    for (let i = D.events.length - 1; i >= 0; i--) { events[i] = p % 4; p = Math.floor(p / 4); }
    const c = [];
    for (let i = D.rounds.length - 1; i >= 0; i--) { c[i] = p % 6; p = Math.floor(p / 6); }
    // 라운드를 끝낸 만큼만 계산해요
    let k = 0;
    for (let i = 0; i < D.rounds.length; i++) { if (c[i] !== 0) k = i + 1; }
    for (let i = 0; i < k; i++) if (c[i] === 0) return null;   // 중간이 비어 있으면 잘못된 코드
    for (let i = 0; i < D.events.length; i++) {
      const ev = D.events[i];
      if (events[i] && k < ev.afterRound) return null;
      if (events[i] && events[i] - 1 >= ev.choices.length) return null;
    }
    // codeSummary 가 쓰는 모양으로 바꿔요 (4=올바른 조건, 5=엉뚱한 조건 → 실제 조건 번호)
    const cc = c.map((v, i) => {
      if (v < 4) return v;
      const R = D.rounds[i];
      const idx = v === 4 ? R.conditions.findIndex((x) => x.correct) : R.conditions.findIndex((x) => !x.correct);
      return 4 + Math.max(0, idx);
    });
    if (phone && !D.phone) return null;
    return { character: 1, k: k, pend: false, c: cc, events: events, phone: phone, ext: ext, raw: c };
  }

  function restoreFromCode(nickname, data) {
    state = freshState();
    state.nickname = nickname;
    state.character = data.character;

    for (let r = 1; r <= data.k; r++) {
      const R = D.rounds[r - 1];
      const v = data.c[r - 1];
      const type = v === 1 ? 'invest' : v <= 3 ? 'pass' : 'condition';
      const read = v === 3 ? 0 : v === 2 ? 1 : null;
      const condition = v >= 4 ? v - 4 : null;
      const s = scoreOf(R, type, read || 0, condition);
      const before = { seeds: state.seeds, trust: state.trust };
      state.seeds += s.seeds;
      state.trust = clampTrust(state.trust + s.trust);
      state.choices[r - 1] = { type: s.type, read: read, condition: condition, reason: '' };
      const newsWaiting = data.pend && r === data.k;
      if (type === 'invest' && !newsWaiting) state.seeds += R.invest.news.seeds;
      if (newsWaiting) {
        state.lastResult = { type: s.type, text: s.text, seedsBefore: before.seeds, trustBefore: before.trust, seedsDelta: s.seeds, trustDelta: s.trust };
      }
      // 이 라운드 뒤 이벤트에서 고른 것(씨앗이 바뀌는 선택이면 그대로 반영)
      D.events.forEach((ev, i) => {
        if (ev.afterRound !== r || !data.events[i]) return;
        const idx = data.events[i] - 1;
        state.eventResults[r] = idx;
        state.seeds += ev.choices[idx].seeds || 0;
      });
    }

    // 공모전판 확장: 자기 점검·공정성 기록을 되살려요 (옛 코드에는 없으니 건너뜀)
    if (data.ext) {
      state.pre = data.ext.pre;
      state.post = data.ext.post;
      state.fair = data.ext.fair;
    }

    const k = data.k;
    if (data.pend) {
      state.round = k; state.pendingNews = k; state.screen = 'result';
    } else if (k >= 1 && eventFor(k) && state.eventResults[k] === undefined) {
      state.round = k; state.screen = 'event';
    } else if (k === 5) {
      state.round = 5; state.screen = 'transition';
    } else {
      state.round = k + 1; state.screen = 'round';
    }
    save();
    render();
    afterRestore();
  }

  function showCodePopup() {
    const C = D.code;
    showModal(el('div', { className: 'code-popup' },
      el('h2', { className: 'code-title', text: C.popupTitle }),
      el('p', { className: 'code-value', text: makeCode() }),
      el('p', { className: 'code-guide', text: C.popupGuide }),
      el('p', { className: 'code-note', text: C.popupNote })
    ), [{ label: C.closeButton, className: 'btn-primary' }]);
  }

  /* ------------------------------------------------------------------
     화면 그리기
     ------------------------------------------------------------------ */
  function go(screen) {
    state.screen = screen;
    save();
    render();
  }

  function render() {
    clearTimers();
    if (onResize) { window.removeEventListener('resize', onResize); onResize = null; }
    closeModal();
    document.querySelectorAll('.toast, .phone-backdrop').forEach((t) => t.remove());
    document.body.classList.remove('is-dark');
    app.textContent = '';
    window.scrollTo(0, 0);
    const screens = {
      start: renderStart,
      character: renderCharacter,
      tutorial: renderTutorial,
      precheck: renderPrecheck,
      round: renderRound,
      condition: renderCondition,
      decision: renderDecision,
      result: renderResult,
      event: renderEvent,
      transition: renderTransition,
      ending: renderEnding,
      certificate: renderCertificate,
      special: renderSpecial,
      badgeCert: renderBadgeCert,
      teacher: renderTeacher
    };
    (screens[state.screen] || renderStart)();
    if (!savingEnabled) app.appendChild(el('div', { className: 'test-badge', text: D.ui.testBadge }));
  }

  /* ---------- 시작 화면 ---------- */
  function renderStart() {
    const S = D.start;
    const C = D.code;
    const max = D.settings.nicknameMaxLength;

    const input = el('input', {
      className: 'nickname-input',
      id: 'nickname',
      type: 'text',
      autocomplete: 'off',
      spellcheck: 'false',
      placeholder: S.nicknamePlaceholder,
      'aria-describedby': 'nickname-guide'
    });
    const count = el('div', { className: 'nickname-count', text: '0/' + max });
    const error = el('p', { className: 'nickname-error', role: 'alert' });
    const saves = savedList();
    const startBtn = button(saves.length ? S.newGameButton : S.startButton, 'btn-primary btn-block', submit, { disabled: true });

    function update() {
      const name = input.value.trim();
      count.textContent = charLength(name) + '/' + max;
      count.classList.toggle('is-over', charLength(name) > max);
      startBtn.disabled = !isNicknameLengthOk(name);
      error.textContent = '';
      input.classList.remove('is-error');
    }

    function shakeInput(message) {
      error.textContent = message;
      input.classList.remove('is-error');
      void input.offsetWidth; // 흔들림 애니메이션 다시 시작
      input.classList.add('is-error');
      input.focus();
    }

    // 별명이 괜찮으면 별명을, 아니면 null
    function checkedName() {
      const name = input.value.trim();
      if (!isNicknameLengthOk(name)) { shakeInput(C.needName); return null; }
      if (hasBannedWord(name)) { shakeInput(S.bannedWordMessage); return null; }
      return name;
    }

    // 같은 별명으로 저장된 게임이 있으면 먼저 물어봐요
    function confirmOverwrite(name, proceed) {
      if (!saves.some((s) => s.name === name)) { proceed(); return; }
      showModal(el('p', { className: 'modal-text', text: S.newGameConfirm }), [
        { label: S.newGameConfirmNo, className: 'btn-ghost' },
        { label: S.newGameConfirmYes, className: 'btn-coral', onClick: proceed }
      ]);
    }

    function submit() {
      const name = checkedName();
      if (!name) return;
      confirmOverwrite(name, () => {
        state = freshState();
        state.nickname = name;
        go('character');
      });
    }

    // 저장된 게임 목록 (여러 학생이 같은 기기를 쓰는 경우 대비)
    function savedBox() {
      if (!saves.length) return null;
      return el('div', { className: 'card save-box' },
        el('h2', { className: 'save-title', text: S.savedTitle }),
        el('p', { className: 'save-info', text: S.savedGuide }),
        el('ul', { className: 'save-list' },
          saves.map((s) => {
            const st = s.state;
            const c = D.characters.find((x) => x.id === st.character);
            let progress = S.savedProgressReady;
            if (['round', 'condition', 'decision', 'result', 'event'].includes(st.screen)) progress = S.savedProgress.replace('{번호}', st.round);
            else if (['transition', 'ending', 'certificate', 'special', 'badgeCert'].includes(st.screen)) {
              progress = S.savedProgressDone;
              // 끝낸 게임은 결과 코드를 목록에서 바로 보여 줘요 (처음으로 눌러도 다시 볼 수 있게)
              try { if (st.choices && st.eventResults) progress += ' · ' + S.savedCode.replace('{코드}', makeResultCode(st)); } catch (e) { /* 옛 저장 형식은 건너뜀 */ }
            }
            const d = new Date(s.savedAt);
            const date = S.savedDate.replace('{월}', d.getMonth() + 1).replace('{일}', d.getDate());
            const nBadges = D.collect ? badgeCount(s.name) : 0;
            return el('li', { className: 'save-row' },
              el('span', { className: 'save-face', 'aria-hidden': 'true', text: c ? c.emoji : '🌱' }),
              el('span', { className: 'save-meta' },
                el('b', { className: 'save-name', text: s.name }),
                el('small', { text: progress + ' · ' + date })
              ),
              // 🏅 그 별명의 배지 도감 (얻는 방법을 보고 다음 판을 계획할 수 있게)
              D.collect ? button(D.collect.openButton + ' ' + nBadges, 'btn-ghost save-badge-btn', () => showBadgeModal(s.name)) : null,
              button(S.continueButton, 'btn-green save-btn', () => resume(s.name))
            );
          })
        )
      );
    }

    // 선생님용: 비밀번호를 넣으면 관리자 모드로 들어가요
    function teacherBox() {
      const T = D.teacher;
      const pw = el('input', {
        className: 'code-input teacher-input', type: 'password', autocomplete: 'off',
        placeholder: T.placeholder, 'aria-label': T.openTitle
      });
      const err = el('p', { className: 'code-error', role: 'alert' });
      const enterBtn = button(T.submitButton, 'btn-gray', () => {
        if (teacherHash(pw.value.trim()) === String(T.passwordHash)) { openTeacherPanel(); return; }
        err.textContent = T.wrong;
        pw.value = '';
        pw.focus();
      });
      pw.addEventListener('input', () => { err.textContent = ''; });
      pw.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) enterBtn.click(); });
      return el('details', { className: 'card code-box teacher-box' },
        el('summary', { className: 'code-summary', text: T.openTitle }),
        el('p', { className: 'save-info', text: T.guide }),
        el('div', { className: 'code-row' }, pw, enterBtn),
        err
      );
    }

    // 👩‍🏫 교사용 안내 · 생성형 AI 활용 표기 (공모전판, 접이식)
    function guideBox() {
      const G = D.teacherGuide;
      if (!G) return null;
      return el('details', { className: 'card code-box guide-box' },
        el('summary', { className: 'code-summary', text: G.title }),
        el('p', { className: 'save-info', text: G.summary }),
        G.sections.map((sec) => el('div', { className: 'guide-section' },
          el('h3', { className: 'guide-h', text: sec.h }),
          el('ul', { className: 'guide-list' }, sec.lines.map((t) => el('li', { text: t })))
        ))
      );
    }

    // 코드로 이어하기 (다른 기기에서 하던 게임)
    function codeBox() {
      const codeInput = el('input', {
        className: 'code-input', type: 'text', autocomplete: 'off', spellcheck: 'false',
        placeholder: C.placeholder, 'aria-label': C.startTitle, maxlength: '18'
      });
      const codeError = el('p', { className: 'code-error', role: 'alert' });
      const codeBtn = button(C.submitButton, 'btn-yellow', () => {
        codeError.textContent = '';
        const name = checkedName();
        if (!name) return;
        const data = parseCode(codeInput.value);
        if (!data) { codeError.textContent = C.invalid; codeInput.focus(); return; }
        confirmOverwrite(name, () => restoreFromCode(name, data));
      });
      codeInput.addEventListener('input', () => { codeError.textContent = ''; });
      codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) codeBtn.click(); });
      return el('details', { className: 'card code-box' },
        el('summary', { className: 'code-summary', text: C.startTitle }),
        el('p', { className: 'save-info', text: C.startGuide }),
        el('div', { className: 'code-row' }, codeInput, codeBtn),
        codeError
      );
    }

    input.addEventListener('input', update);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && !startBtn.disabled) startBtn.click();
    });

    app.appendChild(el('section', { className: 'screen start-screen' },
      el('div', { className: 'start-title-wrap' },
        el('div', { className: 'start-sprout', 'aria-hidden': 'true', text: '🌱' }),
        el('h1', { className: 'start-title', text: S.title }),
        el('p', { className: 'start-subtitle', text: S.subtitle })
      ),
      el('div', { className: 'card start-card' },
        el('label', { className: 'nickname-label', for: 'nickname', text: S.nicknameLabel }),
        input,
        count,
        el('p', { className: 'nickname-guide', id: 'nickname-guide', text: S.nicknameGuide }),
        error,
        startBtn,
        el('p', { className: 'autosave-note', text: S.autoSaveNote })
      ),
      savedBox(),
      codeBox(),
      guideBox(),      // 👩‍🏫 교사용 안내 · AI 활용 표기 (공모전판)
      teacherBox(),
      S.copyright ? el('p', { className: 'copyright', text: S.copyright }) : null
    ));
    if (!saves.length) input.focus();
  }

  /* ---------- 캐릭터 고르기 ---------- */
  function renderCharacter() {
    let selected = state.character;
    const confirmBtn = button(D.characterSelect.confirmButton, 'btn-primary btn-block', () => {
      if (!selected) return;
      state.character = selected;
      state.tutorialPage = 0;
      go('tutorial');
    }, { disabled: !selected });

    const cards = D.characters.map((c) => {
      const card = el('button', {
        type: 'button',
        className: 'char-card' + (selected === c.id ? ' is-selected' : ''),
        'aria-pressed': String(selected === c.id)
      },
        characterFigure(c.id),
        el('span', { className: 'char-look', text: c.look }),
        el('span', { className: 'char-desc', text: c.desc })
      );
      card.addEventListener('click', () => {
        selected = c.id;
        cards.forEach((other) => {
          const on = other === card;
          other.classList.toggle('is-selected', on);
          other.setAttribute('aria-pressed', String(on));
        });
        confirmBtn.disabled = false;
      });
      return card;
    });

    app.appendChild(el('section', { className: 'screen' },
      el('h2', { className: 'screen-title', text: fill(D.characterSelect.guide) }),
      el('div', { className: 'char-grid' }, cards),
      confirmBtn
    ));
  }

  /* ---------- 튜토리얼 ---------- */
  function renderTutorial() {
    const T = D.tutorial;
    const page = Math.min(Math.max(state.tutorialPage, 0), T.pages.length - 1);
    const isLast = page === T.pages.length - 1;

    const buttons = el('div', { className: 'btn-row' },
      page > 0 ? button(T.prevButton, 'btn-ghost', () => { state.tutorialPage = page - 1; go('tutorial'); }) : null,
      isLast
        // 공모전판: 투자 전에 🧪 사전 자기 점검을 먼저 해요
        ? button(T.startButton, 'btn-primary', () => { if (D.selfCheck) go('precheck'); else startRound(1); })
        : button(T.nextButton, 'btn-primary', () => { state.tutorialPage = page + 1; go('tutorial'); })
    );

    app.appendChild(el('section', { className: 'screen tutorial-screen' },
      el('div', { className: 'card tutorial-card' },
        el('div', { className: 'tutorial-figure' }, characterFigure(state.character)),
        el('p', { className: 'tutorial-text', text: fill(T.pages[page]) }),
        el('div', { className: 'dots', 'aria-label': (page + 1) + ' / ' + T.pages.length },
          T.pages.map((_, i) => el('span', { className: 'dot' + (i === page ? ' is-on' : '') }))
        )
      ),
      buttons
    ));
  }

  /* ==================================================================
     라운드
     ================================================================== */
  function roundData() { return D.rounds[state.round - 1]; }

  function startRound(n) {
    state.round = n;
    state.readArticles = [];
    state.conditionToastShown = false;
    state.conditionOrder = null;
    state.pendingChoice = null;
    state.reasonDraft = '';
    state.lastResult = null;
    state.deep = freshDeep();
    state.evidenceDraft = '';
    go('round');
    // 라운드가 바뀔 때마다 "저장됐어요" 안내를 짧게 (학생 설문: 이어하기 기능을 몰랐다 10명+)
    if (n >= 2 && savingEnabled) {
      later(() => {
        showToast(D.ui.savedToast);
        const code = document.querySelector('.status-code');
        if (code) { code.classList.add('is-pulse'); later(() => code.classList.remove('is-pulse'), 3200); }
      }, 600);
    }
  }

  /* ---------- 상단 상태바 ---------- */
  function trustLevel(v) { return v >= 70 ? 'high' : v >= 40 ? 'mid' : 'low'; }

  // seeds/trust 를 넘기면 그 값으로 그려요(결과 화면 애니메이션 시작값)
  function statusBar(seeds, trust) {
    const U = D.ui;
    const seedNum = el('span', { className: 'status-num', text: formatNum(seeds) });
    const trustNum = el('span', { className: 'status-num', text: String(trust) });
    const fill_ = el('div', { className: 'trust-fill' });
    const bar = el('div', { className: 'trust-bar', role: 'meter', 'aria-valuemin': String(D.settings.trustMin), 'aria-valuemax': String(D.settings.trustMax) }, fill_);

    function setSeeds(v) { seedNum.textContent = formatNum(v); }
    function setTrust(v) {
      // 막대 너비 = 신뢰지수 ÷ 최댓값(150) × 100%
      trustNum.textContent = trustText(v);
      fill_.style.width = Math.min(100, Math.max(0, v / D.settings.trustMax * 100)) + '%';
      fill_.className = 'trust-fill is-' + trustLevel(v);
      bar.setAttribute('aria-valuenow', String(v));
    }
    setTrust(trust);

    const dots = el('div', { className: 'round-dots', 'aria-label': U.roundLabel.replace('{번호}', state.round) },
      D.rounds.map((_, i) => el('span', { className: 'round-dot' + (i < state.round ? ' is-on' : ''), text: i < state.round ? '●' : '○' }))
    );

    const codeBtn = el('button', {
      type: 'button', className: 'status-code', text: D.code.stopButton,
      title: D.code.stopButtonLabel, 'aria-label': D.code.stopButtonLabel,
      onClick: guarded(showCodePopup)
    });
    // 📱 휴대폰 (안 읽은 문자 수 배지)
    const phoneBtn = D.phone ? el('button', {
      type: 'button', className: 'status-phone', title: D.phone.buttonLabel, 'aria-label': D.phone.buttonLabel,
      onClick: guarded(() => openPhone())
    }, el('span', { 'aria-hidden': 'true', text: D.phone.button }), el('b', { className: 'phone-badge' })) : null;

    const node = el('header', { className: 'status-bar' + (phoneBtn ? ' has-phone' : '') },
      el('div', { className: 'status-seeds', title: U.seedLabel },
        el('span', { 'aria-hidden': 'true', text: U.seedIcon }), seedNum),
      dots,
      el('div', { className: 'status-trust', title: U.trustLabel },
        el('span', { 'aria-hidden': 'true', text: U.trustIcon }), bar, trustNum),
      phoneBtn,
      codeBtn
    );
    if (phoneBtn) later(updatePhoneBadge, 0);
    return { node, setSeeds, setTrust, seedNum, trustNum };
  }

  /* ---------- 기업 로고 ---------- */
  function companyLogo(round) {
    const fallback = () => el('div', { className: 'logo-fallback logo-bg-' + round.id, 'aria-hidden': 'true', text: Array.from(round.company)[0] });
    return el('div', { className: 'company-logo' }, imageOr(round.logo, fallback, round.company));
  }

  /* ---------- 기사 카드 (라운드·결정서·보너스 라운드가 함께 써요) ----------
     scope: 어려운 말 뜻을 찾을 곳 { glossary, company }
     readList: 읽은 기사 번호 배열(도장 표시) / onRead: 처음 펼쳤을 때 */
  // pick: 근거 문장 고르기 모드(결정서). 문장을 누르면 pick(문장) 을 불러요.
  function articleCards(articles, scope, readList, onRead, idPrefix, pick) {
    return articles.map((a, i) => {
